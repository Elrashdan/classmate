<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d6b58">
<title>Classmate · المحاضرين</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<div class="overlay" id="overlay" hidden>
  <div class="inner">
    <h2 id="ovTitle"></h2>
    <div class="code" id="ovCode"></div>
    <div class="bar"><i id="ovBar"></i></div>
    <div class="row" style="justify-content:center;gap:28px"><span class="lbl" id="ovLeft"></span><span class="lbl" id="ovCount"></span></div>
    <div><button class="btn" id="ovClose" style="background:transparent;color:var(--board-ink);border-color:var(--board-dim)">إغلاق العرض</button></div>
  </div>
</div>

<div class="scanov" id="scanOv" hidden>
  <video id="scanVid" playsinline muted autoplay></video>
  <div class="frame"><i></i></div>
  <div class="res info" id="scanRes"><b>وجّه الكاميرا على كود الطالب</b><span>الطالب يفتح «كود الحضور» من موبايله.</span></div>
  <div class="foot"><span id="scanCount"></span><button class="btn" id="scanClose">قفل الكاميرا</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const { $, esc, rpc, errText, store, sb } = CM;
  const app = $("#app");
  if (!CM.configured) { app.innerHTML = CM.setupNotice(); return; }

  const ROLE = { admin: "مسؤول", lecturer: "محاضر", ta: "معيد" };
  const REASON = { wrong_code: "كود غلط", expired_code: "كود منتهي (غالبا اتبعت له)", device_used: "موبايل سجّل لطالب تاني", other_group: "من مجموعة تانية والتعويض مقفول", rejected_by_staff: "اترفض طلبه", bad_qr: "كود حضور (QR) مش صحيح", old_qr: "كود حضور (QR) قديم (غالبا صورة)" };
  const reasonText = r => r.startsWith("too_far:") ? "برة نطاق القاعة (" + CM.dist(+r.split(":")[1]) + ")" : (REASON[r] || r);

  let me = null, staff = [], settings = { domain: "" }, courses = [], tasAll = [], curId = store.get("cm_course"), view = "course";
  let D = null; // current course data
  let flash = {}; // per-panel messages
  let liveTab = "all", regGroup = "all", confirmKey = null, startState = null, report = null;
  let codeState = null, codeTimer = null, liveTimer = null, manFor = null, manDraft = "";
  let addOpen = false, addDraft = { code: "", name: "", grp: "", pin: "" };
  let login = { step: "email", email: "", err: "", busy: false };

  /* ======================= auth ======================= */
  function renderLogin() {
    stopLoops();
    app.innerHTML = `<header class="top"><div class="brand"><div class="mark">C</div><div><h1>Classmate</h1><p class="muted small">دخول المحاضرين والمعيدين</p></div></div></header>
      <section class="panel" style="max-width:480px">
      ${login.step === "email" ? `
        <h2>ادخل بإيميل الجامعة</h2>
        <p class="muted small">مفيش باسورد. هيوصلك كود على إيميلك تدخل بيه. لو إيميلك مش متسجل، اطلب من مسؤول القسم يضيفك.</p>
        <label class="f"><span>إيميل الجامعة</span><input type="email" id="lgEmail" dir="ltr" autocomplete="username" value="${esc(login.email)}"></label>
        ${login.err ? `<div class="msg bad">${esc(login.err)}</div>` : ""}
        <button class="btn primary" id="lgSend" ${login.busy ? "disabled" : ""}>${login.busy ? `<span class="spinner"></span>` : "ابعت كود الدخول"}</button>
      ` : `
        <div class="eyebrow mono" style="text-align:start">${esc(login.email)}</div>
        <h2>بص على إيميلك</h2>
        <p class="muted small">لو الإيميل فيه كود، اكتبه هنا. لو فيه لينك، افتحه من نفس الجهاز ده وهتدخل على طول. لو مالقيتهوش، بص في Spam أو Junk.</p>
        <label class="f"><span>كود الدخول</span><input type="text" id="lgCode" class="codein" inputmode="numeric" maxlength="10" autocomplete="one-time-code"></label>
        ${login.err ? `<div class="msg bad">${esc(login.err)}</div>` : ""}
        <div class="row"><button class="btn primary" id="lgVerify" ${login.busy ? "disabled" : ""}>${login.busy ? `<span class="spinner"></span>` : "دخول"}</button><button class="btn ghost" id="lgBack">إيميل تاني</button></div>
      `}</section>`;
    if (login.step === "email") {
      const send = async () => {
        const email = $("#lgEmail").value.trim().toLowerCase(); login.email = email; login.err = "";
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { login.err = "اكتب إيميل صحيح."; return renderLogin(); }
        login.busy = true; renderLogin();
        try {
          const allowed = await rpc("staff_can_login", { p_email: email });
          if (!allowed) throw { message: "الإيميل ده مش متسجل أو موقوف. اطلب من مسؤول القسم يضيفك." };
          const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
          if (error) throw error;
          login.step = "code";
        } catch (e) { login.err = e.message && e.message.startsWith("الإيميل") ? e.message : errText(e); }
        login.busy = false; renderLogin();
      };
      $("#lgSend").onclick = send; $("#lgEmail").onkeydown = e => { if (e.key === "Enter") send(); };
    } else {
      const verify = async () => {
        const token = $("#lgCode").value.trim(); login.err = "";
        if (!token) return;
        login.busy = true; renderLogin();
        try {
          const { error } = await sb.auth.verifyOtp({ email: login.email, token, type: "email" });
          if (error) throw error;
          login = { step: "email", email: "", err: "", busy: false };
          await afterLogin();
          return;
        } catch (e) { login.err = errText(e); }
        login.busy = false; renderLogin();
      };
      $("#lgVerify").onclick = verify; $("#lgCode").onkeydown = e => { if (e.key === "Enter") verify(); };
      $("#lgBack").onclick = () => { login.step = "email"; login.err = ""; renderLogin(); };
    }
  }

  async function signOut(msg) {
    stopLoops(); closeScanner(); await sb.auth.signOut().catch(() => {});
    me = null; D = null; login = { step: "email", email: "", err: msg || "", busy: false }; renderLogin();
  }

  async function afterLogin() {
    app.innerHTML = `<div class="empty" style="margin-top:40px"><span class="spinner"></span></div>`;
    try {
      me = await rpc("staff_me");
      if (!me) return signOut("الإيميل ده مش متسجل كمحاضر أو حسابه موقوف. كلّم مسؤول القسم.");
      await loadBase();
      await loadCourse();
    } catch (e) { app.innerHTML = `<div class="msg bad">${esc(errText(e))}</div>`; }
  }

  async function loadBase() {
    const [st, se, co, ta] = await Promise.all([
      sb.from("staff").select("*").order("name"),
      sb.from("settings").select("*").single(),
      sb.from("courses").select("*").order("created_at"),
      sb.from("course_tas").select("*")
    ]);
    for (const r of [st, se, co, ta]) if (r.error) throw r.error;
    staff = st.data; settings = se.data; courses = co.data; tasAll = ta.data;
    const fl = filtered(); if (!fl.find(c => c.id === curId)) curId = (fl.find(c => role(c) !== "viewer" && !c.archived) || fl[0] || {}).id || null;
  }

  /* ======================= permissions & helpers ======================= */
  const staffName = e => (staff.find(s => s.email === e) || {}).name || e;

  /* ---------- course classification: academic year, term, level, track ---------- */
  const LEVELS = ["", "المستوى الأول", "المستوى الثاني", "المستوى الثالث", "المستوى الرابع", "المستوى الخامس"];
  const TERMS = { 1: "الترم الأول", 2: "الترم الثاني", 3: "الترم الصيفي" };
  const TRACKS = ["عمارة داخلية", "سينوغرافيا"];
  const nowYear = () => { const d = new Date(), y = d.getFullYear(); return d.getMonth() >= 7 ? `${y}/${y + 1}` : `${y - 1}/${y}`; };
  const nowTerm = () => { const m = new Date().getMonth() + 1; return m >= 9 || m === 1 ? 1 : m <= 6 ? 2 : 3; };
  const yearList = () => { const b = +nowYear().split("/")[0], ys = new Set(); for (let y = b - 2; y <= b + 1; y++) ys.add(`${y}/${y + 1}`); courses.forEach(c => c.academic_year && ys.add(c.academic_year)); return [...ys].sort().reverse(); };
  const clsLabel = c => [LEVELS[c.level] || "", c.track || "", TERMS[c.term] || "", c.academic_year || ""].filter(Boolean).join(" · ") || "غير مصنفة";
  const groupLabel = c => c.level ? LEVELS[c.level] + (c.track ? " · " + c.track : (c.level <= 2 ? " · تخصص عام" : "")) : "غير مصنفة";
  let fYear = store.get("cm_year") || nowYear(), fTerm = store.get("cm_term") || String(nowTerm());
  const inFilter = c => (fYear === "all" || !c.academic_year || c.academic_year === fYear) && (fTerm === "all" || !c.term || String(c.term) === fTerm);
  const filtered = () => courses.filter(inFilter).sort((a, b) => (a.level || 9) - (b.level || 9) || (a.track || "").localeCompare(b.track || "", "ar") || a.name.localeCompare(b.name, "ar"));
  function classFields(p, c) {
    c = c || {};
    const y = c.academic_year || (fYear !== "all" ? fYear : nowYear()), t = String(c.term || (fTerm !== "all" ? fTerm : nowTerm())), l = c.level || "";
    return `<label class="f"><span>العام الدراسي</span><select id="${p}Year">${yearList().map(v => `<option value="${v}" ${v === y ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label class="f"><span>الترم</span><select id="${p}Term">${Object.entries(TERMS).map(([k, v]) => `<option value="${k}" ${k === t ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label class="f"><span>المستوى</span><select id="${p}Level"><option value="">اختار المستوى</option>${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${n === l ? "selected" : ""}>${LEVELS[n]}${n <= 2 ? " (تخصص عام)" : ""}</option>`).join("")}</select></label>
      <label class="f" id="${p}TrackBox" ${l >= 3 ? "" : "hidden"}><span>الشعبة</span><select id="${p}Track"><option value="">اختار الشعبة</option>${TRACKS.map(v => `<option value="${v}" ${v === c.track ? "selected" : ""}>${v}</option>`).join("")}</select></label>`;
  }
  function wireClass(p) { const l = $("#" + p + "Level"); if (l) l.onchange = () => { $("#" + p + "TrackBox").hidden = !(+l.value >= 3); }; }
  function readClass(p) {
    const level = +$("#" + p + "Level").value || null, track = level >= 3 ? $("#" + p + "Track").value : "";
    if (!level) throw { message: "اختار المستوى." };
    if (level >= 3 && !track) throw { message: "المستوى " + LEVELS[level].replace("المستوى ", "") + " لازم تختار له شعبة: عمارة داخلية أو سينوغرافيا." };
    return { p_year: $("#" + p + "Year").value, p_term: +$("#" + p + "Term").value, p_level: level, p_track: track };
  }
  function role(c) {
    if (!c || !me) return null;
    if (c.owner_email === me.email) return "owner";
    const t = tasAll.find(t => t.course_id === c.id && t.email === me.email);
    if (t) return t.kind === "co" ? "co" : "ta";
    return me.role === "admin" ? "viewer" : null;
  }
  const course = () => courses.find(c => c.id === curId) || null;
  const canRun = c => ["owner", "co", "ta"].includes(role(c));
  const canManage = c => ["owner", "co"].includes(role(c)); // students, roster, ended lectures
  const isOwner = c => role(c) === "owner";                 // team, course settings, delete
  const isOwn = (s, e) => !s.grp || (e && s.grp === e.grp);
  const counted = r => r && r.status !== "pending";
  const groupsOf = () => [...new Set(D.enroll.map(e => e.grp).filter(Boolean))].sort();
  const running = () => D && D.sessions.find(s => !s.ended);
  const isOpen = s => s && !s.ended && !s.closed_at && new Date(s.ends_at) > new Date();
  const nameOf = code => (D.enroll.find(e => e.student_code === code) || {}).name || code;
  function absences(e) {
    const missed = D.sessions.filter(s => s.ended && isOwn(s, e) && !counted((D.att[s.id] || {})[e.student_code])).length;
    const made = D.sessions.filter(s => !isOwn(s, e) && counted((D.att[s.id] || {})[e.student_code])).length;
    return Math.max(0, missed - made);
  }
  function attendance(e) {
    const own = D.sessions.filter(s => isOwn(s, e)).length, att = D.sessions.filter(s => counted((D.att[s.id] || {})[e.student_code])).length;
    return { own, att, pct: own ? Math.min(100, Math.round(att / own * 100)) : 0 };
  }
  const say = (k, text) => { flash[k] = text; };
  const msgHtml = k => flash[k] ? `<div class="msg ${flash[k].startsWith("!") ? "bad" : "ok"}">${esc(flash[k].replace(/^!/, ""))}</div>` : "";

  /* ======================= data ======================= */
  async function loadCourse() {
    stopLoops();
    const c = course();
    if (!c) { D = null; return render(); }
    store.set("cm_course", c.id);
    const [en, se, ta, au] = await Promise.all([
      CM.fetchAll(() => sb.from("enrollments").select("*").eq("course_id", c.id).order("student_code")),
      sb.from("sessions").select("*").eq("course_id", c.id).order("n"),
      sb.from("course_tas").select("*").eq("course_id", c.id),
      sb.from("audit").select("*").eq("course_id", c.id).order("at", { ascending: false }).limit(60)
    ]);
    for (const r of [se, ta, au]) if (r.error) throw r.error;
    const sessions = se.data, ids = sessions.map(s => s.id);
    const att = {};
    if (ids.length) {
      const rows = await CM.fetchAll(() => sb.from("attendance").select("*").in("session_id", ids).order("at"));
      rows.forEach(r => { (att[r.session_id] = att[r.session_id] || {})[r.student_code] = r; });
    }
    const focus = sessions.find(s => !s.ended) || sessions[sessions.length - 1];
    let attempts = [];
    if (focus) { const r = await sb.from("attempts").select("*").eq("session_id", focus.id).order("at", { ascending: false }).limit(300); if (r.error) throw r.error; attempts = r.data; }
    let bindings = {};
    try { (await rpc("course_bindings", { cid: c.id })).forEach(b => bindings[b.student_code] = b); } catch (e) {}
    D = { cid: c.id, enroll: en, sessions, tas: ta.data, audit: au.data, att, attempts, bindings };
    if (scan && !sessions.some(x => x.id === scan.sid && !x.ended)) closeScanner();
    render();
    startLoops();
  }

  async function refreshLive() {
    const s = D && running(); if (!s) return;
    const [a, t, ss, au] = await Promise.all([
      sb.from("attendance").select("*").eq("session_id", s.id),
      sb.from("attempts").select("*").eq("session_id", s.id).order("at", { ascending: false }).limit(300),
      sb.from("sessions").select("*").eq("id", s.id).single(),
      sb.from("audit").select("*").eq("course_id", s.course_id).order("at", { ascending: false }).limit(60)
    ]);
    if (a.error || t.error || ss.error || !D || D.cid !== s.course_id) return;
    D.att[s.id] = {}; a.data.forEach(r => D.att[s.id][r.student_code] = r);
    D.attempts = t.data;
    if (!au.error && (au.data[0] || {}).id !== (D.audit[0] || {}).id) { D.audit = au.data; renderAudit(); }
    const i = D.sessions.findIndex(x => x.id === s.id), wasOpen = isOpen(s);
    if (i >= 0) D.sessions[i] = ss.data;
    if (!manFor) renderLive();
    renderRegister();
    scanCount();
    if (wasOpen !== isOpen(ss.data)) renderSession();
  }

  /* ======================= loops (code + live list) ======================= */
  function stopLoops() { manFor = null; clearTimeout(codeTimer); clearInterval(liveTimer); codeTimer = null; liveTimer = null; codeState = null; $("#overlay").hidden = true; }
  function startLoops() {
    const c = course(), s = running();
    if (!s) return;
    liveTimer = setInterval(() => { if (document.visibilityState === "visible") refreshLive().catch(() => {}); }, 5000);
    if (canRun(c) && isOpen(s)) fetchCode();
  }
  async function fetchCode() {
    const s = running(); if (!s) return;
    try {
      const r = await rpc("current_code", { sid: s.id });
      if (!r.open) { codeState = null; await loadCourse(); return; }
      codeState = { code: r.code, until: Date.now() + Number(r.ms_left), ends: Date.now() + Number(r.ends_in_ms) };
      tick();
      codeTimer = setTimeout(fetchCode, Math.max(500, Number(r.ms_left) + 300));
    } catch (e) { codeTimer = setTimeout(fetchCode, 3000); }
  }
  function tick() {
    if (!codeState) return;
    const left = codeState.until - Date.now(), pct = Math.max(0, Math.min(100, left / 300)), code = codeState.code.slice(0, 3) + " " + codeState.code.slice(3);
    const s = running(), c = course(), exp = s ? D.enroll.filter(e => isOwn(s, e)) : [], pres = s ? exp.filter(e => counted((D.att[s.id] || {})[e.student_code])).length : 0;
    const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
    set("#bCode", code); set("#ovCode", code);
    const bar = $("#bBar"); if (bar) bar.style.width = pct + "%";
    $("#ovBar").style.width = pct + "%";
    set("#bNext", "الكود الجاي بعد " + Math.max(0, Math.ceil(left / 1000)) + " ثانية");
    set("#bLeft", "التسجيل يقفل بعد " + CM.mmss(codeState.ends - Date.now()));
    set("#ovLeft", "التسجيل يقفل بعد " + CM.mmss(codeState.ends - Date.now()));
    set("#ovCount", "حضر " + pres + " من " + exp.length);
    if (s && c) set("#ovTitle", c.name + " · المحاضرة " + s.n + (s.kind === "outdoor" ? " (خارجية)" : "") + " · " + (s.grp ? "مجموعة " + s.grp : "الدفعة كلها"));
    if (codeState.ends <= Date.now()) { codeState = null; clearTimeout(codeTimer); loadCourse(); }
  }
  setInterval(tick, 1000);
  $("#ovClose").onclick = () => { $("#overlay").hidden = true; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); };

  /* ======================= render ======================= */
  function render() {
    const c = course();
    const owned = courses.filter(x => x.owner_email === me.email).length;
    app.innerHTML = `
      <header class="top">
        <div class="brand"><div class="mark">C</div><div><h1>Classmate</h1><p class="muted small">${esc(me.name)} · ${ROLE[me.role]}${owned ? " · " + owned + " مادة" : ""}</p></div></div>
        <div class="row">
          ${me.role !== "ta" && view === "course" ? `<button class="btn sm" id="newC">مادة جديدة</button>` : ""}
          ${me.role === "admin" ? `<button class="btn sm ${view === "admin" ? "primary" : ""}" id="admin">${view === "admin" ? "رجوع للمواد" : "لوحة المسؤول"}</button>` : ""}
          <button class="btn sm ghost" id="out">خروج</button>
        </div>
      </header>
      <div id="newCForm" class="panel" hidden style="margin-bottom:16px">
        <h3>مادة جديدة</h3>
        <div class="settings"><label class="f"><span>اسم المادة</span><input type="text" id="ncName" placeholder="مثلا: التشريح الفني"></label>${classFields("nc")}</div>
        <div class="row"><button class="btn primary" id="ncSave">أضف المادة</button><span class="muted small">المستوى الأول والثاني تخصص عام. الثالث والرابع والخامس لازم تختار الشعبة.</span></div>
      </div>
      ${view === "course" ? `<div class="panel" style="margin-bottom:16px;padding-block:12px">
        <div class="settings" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
          <label class="f"><span>العام الدراسي</span><select id="fYear"><option value="all" ${fYear === "all" ? "selected" : ""}>كل الأعوام</option>${yearList().map(v => `<option value="${v}" ${v === fYear ? "selected" : ""}>${v}${v === nowYear() ? " (الحالي)" : ""}</option>`).join("")}</select></label>
          <label class="f"><span>الترم</span><select id="fTerm"><option value="all" ${fTerm === "all" ? "selected" : ""}>كل الترمات</option>${Object.entries(TERMS).map(([k, v]) => `<option value="${k}" ${k === fTerm ? "selected" : ""}>${v}</option>`).join("")}</select></label>
          ${filtered().length ? `<label class="f" style="grid-column:span 2"><span>المادة</span><select id="pick">${(() => { const groups = new Map(); filtered().forEach(x => { const g = groupLabel(x); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(x); });
            return [...groups].map(([g, list]) => `<optgroup label="${esc(g)}">${list.map(x => { const r = role(x); return `<option value="${x.id}" ${x.id === curId ? "selected" : ""}>${esc(x.name)}${x.archived ? " (أرشيف)" : ""}${r === "ta" ? " · معيد" : r === "co" ? " · محاضر مشارك" : r === "viewer" ? " · " + esc(staffName(x.owner_email)) : ""}</option>`; }).join("")}</optgroup>`).join(""); })()}</select></label>` : ""}
        </div></div>` : ""}

  function scanCount() {

  async function openScanner(s) {

  async function scanFrame() {
    if (!scan || scan.busy) return;
    const v = $("#scanVid"); if (!v || !v.videoWidth) { if (!scan.detector) return; }
    let text = "";
    try {
      if (scan.detector) { const r = await scan.detector.detect(v); text = r && r[0] ? r[0].rawValue : ""; }
      else if (window.jsQR) {
        const w = Math.min(640, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);

  /* ---------- live attendance ---------- */

    const recs = D.att[s.id] || {};
    const pres = D.enroll.filter(e => counted(recs[e.student_code])).sort((a, b) => new Date(recs[b.student_code].at) - new Date(recs[a.student_code].at));
    const pend = D.enroll.filter(e => recs[e.student_code] && recs[e.student_code].status === "pending");
    const abs = D.enroll.filter(e => isOwn(s, e) && !recs[e.student_code]);
    const rej = D.attempts.filter(a => a.session_id === s.id);
    const editable = canRun(c) && (!s.ended || canManage(c));
    const items = [];
    if (liveTab === "all" || liveTab === "pend") pend.forEach(e => items.push({ e, k: "warn", chip: recs[e.student_code].makeup ? "تعويض معلّق" : "معلّق", r: recs[e.student_code] }));
    if (liveTab === "all" || liveTab === "pres") pres.forEach(e => { const r = recs[e.student_code]; items.push({ e, k: r.makeup || r.status === "manual" ? "man" : "ok", chip: r.makeup ? "تعويض" : r.status === "manual" ? "يدوي" : r.via === "scan" ? "حاضر · QR" : "حاضر", r }); });

  function importFile(file) {
    if (!file) return;
    const c = course(), fr = new FileReader();
    fr.onload = async ev => {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" }).filter(r => r.some(v => String(v).trim()));
        if (!rows.length) throw { message: "empty_roster" };
        let ci = -1, ni = -1, gi = -1, pi = -1, start = 0; const h = rows[0].map(v => String(v).trim());
        h.forEach((v, i) => {
          if (gi < 0 && /مجموع|group|سكشن|section|فوج/i.test(v)) gi = i;
          else if (pi < 0 && /رمز|تفعيل|pin|قومي/i.test(v)) pi = i;
          else if (ci < 0 && /كود|رقم|code|id/i.test(v)) ci = i;
          else if (ni < 0 && /اسم|name/i.test(v)) ni = i;
        });
        if (ci >= 0 && ni >= 0) start = 1;
        else { ci = 0; ni = 1; if (!/\d/.test(String(rows[0][0])) && /\d/.test(String(rows[0][1]))) { ci = 1; ni = 0; } if (!/\d/.test(String(rows[0][ci]))) start = 1; }
        const normG = v => { v = String(v ?? "").trim(); const m = { a: "أ", b: "ب", c: "ج", "1": "أ", "2": "ب", "3": "ج", "ا": "أ" }; return m[v.toLowerCase()] || v.slice(0, 10); };
        const list = rows.slice(start).map(r => ({ code: String(r[ci]).trim(), name: String(r[ni]).trim(), grp: gi >= 0 ? normG(r[gi]) : "", pin: pi >= 0 ? String(r[pi]).trim().slice(-4) : "" })).filter(r => r.code && r.name);
        if (!list.length) throw { message: "empty_roster" };
        const n = await rpc("replace_roster", { cid: c.id, rows: list, p_file: file.name });
        const gs = [...new Set(list.map(x => x.grp).filter(Boolean))].sort();
        say("roster", "اتضاف " + n + " طالب من «" + file.name + "»" + (gs.length > 1 ? "، مقسمين على " + gs.map(g => "مجموعة " + g + " (" + list.filter(x => x.grp === g).length + ")").join(" و") : "") + (pi >= 0 ? "، ومعاهم رمز تفعيل" : "") + ".");
      } catch (e) { say("roster", "!" + (e.message === "empty_roster" ? errText(e) : "معرفناش نقرا الشيت. اتأكد إن فيه عمود للكود وعمود للاسم. " + errText(e))); }
      await loadCourse().catch(showErr);
    };
    fr.readAsArrayBuffer(file);
  }

        ${team.map(t => `<div class="li ${t.kind === "co" ? "man" : ""}"><span class="chip ${t.kind === "co" ? "man" : "none"}">${t.kind === "co" ? "محاضر مشارك" : "معيد"}</span><div class="who"><b>${esc(staffName(t.email))}</b><small class="mono">${esc(t.email)}</small></div><div class="acts">${mng ? `<button class="btn sm ghost" data-kind="${esc(t.email)}" data-to="${t.kind === "co" ? "ta" : "co"}">${t.kind === "co" ? "خليه معيد" : "خليه محاضر مشارك"}</button><button class="btn sm ghost danger" data-rmta="${esc(t.email)}">شيل</button>` : ""}</div></div>`).join("")}
      </div>
      ${mng ? (cands.length ? `<div class="settings"><label class="f"><span>ضيف للفريق</span><select id="taPick">${cands.map(u => `<option value="${esc(u.email)}">${esc(u.name)} (${ROLE[u.role]})</option>`).join("")}</select></label><label class="f"><span>بصفته</span><select id="taKind"><option value="co">محاضر مشارك</option><option value="ta" selected>معيد</option></select></label><button class="btn" id="taAdd">أضف</button></div>` : `<p class="muted small">مفيش حسابات تانية تضيفها. لو المحاضر أو المعيد مش موجود، اطلب من مسؤول القسم يضيفه.</p>`)
        + `<p class="muted small"><b>المحاضر المشارك</b> بيعمل كل اللي انت بتعمله في المحاضرات والطلبة والكشف (حتى تعديل المحاضرات المنتهية)، ماعدا مسح المادة وتعديل بياناتها والفريق. <b>المعيد</b> يبدأ المحاضرات ويوافق على الطلبات ويسجل يدوي ويضيف طالب، لكن مايرفعش شيت ولا يعدّل المحاضرات بعد ما تخلص.</p>` : ""}
      ${mng || me.role === "admin" ? `<div style="border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px">
        <h3>إعدادات المادة</h3>
        ${msgHtml("course")}
        ${mng ? `${c.level ? "" : `<div class="msg bad small">المادة دي لسه مش متصنفة. اختار العام والترم والمستوى واضغط حفظ.</div>`}
        <div class="settings"><label class="f"><span>اسم المادة</span><input type="text" id="cName" value="${esc(c.name)}"></label>${classFields("e", c)}<button class="btn" id="cRename">حفظ بيانات المادة</button></div>
        <div class="row"><button class="btn sm ghost" id="arch">${c.archived ? "رجّع المادة من الأرشيف" : "أرشف المادة (آخر الترم)"}</button><span class="muted small">الأرشفة بتخفي المادة عند الطلبة وبتحفظ الكشف.</span></div>` : ""}
        ${confirmKey === "delcourse" ? `<div class="msg bad" style="display:grid;gap:8px">
            <b>المسح نهائي ومفيش رجوع.</b>
            <span class="small">هيتمسح ${D.sessions.length} محاضرة وكل الحضور والإنذارات بتاعتها، وطلبة المادة. لو محتاج الكشف، صدّر شيت الإكسيل الأول. للتأكيد اكتب اسم المادة زي ما هو: <b>${esc(c.name)}</b></span>
            <input type="text" id="delName" autocomplete="off">
            <div class="row"><button class="btn sm danger" id="delGo">امسح المادة نهائي</button><button class="btn sm ghost" id="delCancel">إلغاء</button></div>
          </div>` : `<div class="row"><button class="btn sm ghost danger" id="delAsk">مسح المادة</button></div>`}
      </div>` : ""}`;
    el.querySelectorAll("[data-rmta]").forEach(b => b.onclick = () => act(() => rpc("remove_ta", { cid: c.id, p_email: b.dataset.rmta }), async () => { await loadBase(); await loadCourse(); }));
    const ta = $("#taAdd"); if (ta) ta.onclick = () => act(() => rpc("add_member", { cid: c.id, p_email: $("#taPick").value, p_kind: $("#taKind").value }), async () => { await loadBase(); await loadCourse(); });
    el.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => act(() => rpc("add_member", { cid: c.id, p_email: b.dataset.kind, p_kind: b.dataset.to }), async () => { await loadBase(); await loadCourse(); }));
    const ar = $("#arch"); if (ar) ar.onclick = () => act(() => rpc("set_course_archived", { cid: c.id, p_archived: !c.archived }), async () => { await loadBase(); await loadCourse(); });
    const rn = $("#cRename"); if (rn) rn.onclick = () => {
      const n = $("#cName").value.trim();
      if (!n) { say("course", "!اكتب اسم المادة."); return renderTeam(); }
      let cls; try { cls = readClass("e"); } catch (e) { say("course", "!" + e.message); return renderTeam(); }
      act(async () => {
        await rpc("update_course_info", { cid: c.id, p_name: n, ...cls });
        fYear = cls.p_year; fTerm = String(cls.p_term); store.set("cm_year", fYear); store.set("cm_term", fTerm);
        say("course", "اتحفظت بيانات المادة.");
      }, async () => { await loadBase(); await loadCourse(); });
    };
    wireClass("e");
    const da = $("#delAsk"); if (da) da.onclick = () => { confirmKey = "delcourse"; renderTeam(); const i = $("#delName"); if (i) i.focus(); };
    const dc = $("#delCancel"); if (dc) dc.onclick = () => { confirmKey = null; renderTeam(); };
    const dg = $("#delGo"); if (dg) dg.onclick = async () => {
      const typed = $("#delName").value.trim();
      if (typed !== c.name.trim()) { say("course", "!الاسم اللي كتبته مش مطابق لاسم المادة."); return renderTeam(); }
      try {
        await rpc("delete_course", { cid: c.id, p_confirm: typed });
        confirmKey = null; flash = {}; curId = null; store.del("cm_course");
        await loadBase(); await loadCourse();
        toast("اتمسحت المادة «" + c.name + "».");
      } catch (e) { say("course", "!" + errText(e)); renderTeam(); }
    };
  }

  function auditList(items, showCourse) {
    if (!items.length) return `<div class="empty">مفيش تعديلات لحد دلوقتي.</div>`;
    return `<div class="list">${items.map(a => { const c = courses.find(x => x.id === a.course_id);
      return `<div class="li"><span class="small muted mono">${CM.fmtD(a.at)} ${CM.fmtT(a.at)}</span><div class="who"><b>${esc(staffName(a.actor))}</b><small>${esc(a.action)}${showCourse && c ? " · " + esc(c.name) : ""}</small></div><span></span></div>`; }).join("")}</div>`;
  }
  function renderAudit() {
    $("#auditPanel").innerHTML = `<div class="panel-h"><div><div class="eyebrow">مين عمل إيه وإمتى</div><h2>سجل تعديلات المادة</h2></div></div>
      <p class="muted small">أي تسجيل يدوي، أو موافقة أو رفض، أو إلغاء حضور، أو فك ربط موبايل، أو نقل طالب بين المجموعات بيتسجل هنا، ومحدش يقدر يمسحه.</p>${auditList(D.audit, false)}`;
  }

  /* ======================= admin ======================= */
  async function renderAdmin() {
    const el = $("#adminArea");
    const au = await sb.from("audit").select("*").order("at", { ascending: false }).limit(40);
    el.innerHTML = `
      <section class="panel">
        <div class="panel-h"><div><div class="eyebrow">${staff.length} حساب</div><h2>المحاضرين والمعيدين</h2></div></div>
        ${msgHtml("admin")}
        <div class="tbl-wrap"><table><thead><tr><th>الاسم</th><th>الإيميل</th><th>الدور</th><th>المواد</th><th>الحالة</th><th></th></tr></thead><tbody>
        ${staff.map(u => { const o = courses.filter(c => c.owner_email === u.email).length, t = tasAll.filter(x => x.email === u.email).length;
          return `<tr><td>${esc(u.name)}</td><td class="mono small">${esc(u.email)}</td><td>${ROLE[u.role]}</td><td class="small">${o ? o + " مادة" : ""}${o && t ? " · " : ""}${t ? "معيد في " + t : ""}${!o && !t ? `<span class="muted">—</span>` : ""}</td>
          <td>${u.status === "active" ? `<span class="chip ok">مفعّل</span>` : u.status === "invited" ? `<span class="chip warn">مادخلش لسه</span>` : `<span class="chip bad">موقوف</span>`}</td>
          <td>${u.email === me.email ? `<span class="small muted">انت</span>` : `<button class="btn sm ghost ${u.status === "suspended" ? "" : "danger"}" data-sus="${esc(u.email)}" data-to="${u.status === "suspended" ? "active" : "suspended"}">${u.status === "suspended" ? "تفعيل" : "إيقاف"}</button>`}</td></tr>`; }).join("")}
        </tbody></table></div>
        <h3>إضافة محاضر أو معيد</h3>
        <div class="settings">
          <label class="f"><span>الاسم</span><input type="text" id="invName"></label>
          <label class="f"><span>إيميل الجامعة</span><input type="email" id="invEmail" dir="ltr" placeholder="name@${esc(settings.domain || "university.edu.eg")}"></label>
          <label class="f"><span>الدور</span><select id="invRole"><option value="lecturer">محاضر</option><option value="ta">معيد</option><option value="admin">مسؤول</option></select></label>
          <button class="btn primary" id="invBtn">أضف</button>
        </div>
        <p class="muted small">بعد ما تضيفه، ابعتله لينك صفحة المحاضرين. أول ما يدخل بإيميله والكود اللي هيوصله، حسابه بيتفعّل. الموقوف مايقدرش يدخل، ومواده وكشوفه بتفضل محفوظة.</p>
        <div class="settings"><label class="f"><span>دومين إيميل الجامعة (فاضي = أي دومين)</span><input type="text" id="domIn" dir="ltr" value="${esc(settings.domain || "")}"></label><button class="btn" id="domSave">حفظ الدومين</button></div>
      </section>
      <section class="panel">
        <div class="panel-h"><div><div class="eyebrow">كل مواد القسم · ${fYear === "all" ? "كل الأعوام" : esc(fYear)} · ${fTerm === "all" ? "كل الترمات" : TERMS[fTerm]}</div><h2>طلبة عندهم إنذار ثالث أو انسحاب</h2></div><button class="btn sm" id="repBtn">${report === "loading" ? `<span class="spinner"></span>` : report ? "تحديث" : "احسب التقرير"}</button></div>
        ${Array.isArray(report) ? (report.length ? `<div class="tbl-wrap"><table><thead><tr><th>الطالب</th><th>المادة</th><th>المحاضر</th><th class="c">الغياب</th><th>الحالة</th></tr></thead><tbody>
          ${report.map(x => `<tr><td>${esc(x.e.name)}<div class="mono muted small">${esc(x.e.student_code)}</div></td><td>${esc(x.c.name)}<div class="muted small">${esc(clsLabel(x.c))}</div></td><td>${esc(staffName(x.c.owner_email))}</td><td class="c mono">${x.ab}</td><td>${CM.warnChip(x.ab)}</td></tr>`).join("")}
          </tbody></table></div>` : `<div class="empty">مفيش طلبة عندهم إنذار ثالث أو انسحاب.</div>`) : `<p class="muted small">التقرير بيلف على كل المواد، فبيتحسب لما تطلبه.</p>`}
      </section>
      <section class="panel"><div class="panel-h"><div><div class="eyebrow">آخر التعديلات في كل المواد</div><h2>سجل التعديلات</h2></div></div>${auditList(au.data || [], true)}</section>`;
    el.querySelectorAll("[data-sus]").forEach(b => b.onclick = () => act(async () => { await rpc("admin_set_status", { p_email: b.dataset.sus, p_status: b.dataset.to }); say("admin", (b.dataset.to === "suspended" ? "اتوقف حساب " : "اتفعّل حساب ") + staffName(b.dataset.sus) + "."); }, async () => { await loadBase(); renderAdmin(); }));
    $("#invBtn").onclick = () => act(async () => {
      const n = $("#invName").value.trim(), e = $("#invEmail").value.trim().toLowerCase(), r = $("#invRole").value;
      await rpc("admin_save_staff", { p_email: e, p_name: n, p_role: r });
      say("admin", "اتضاف " + n + ". ابعتله لينك صفحة المحاضرين: " + location.href.split("#")[0]);
    }, async () => { await loadBase(); renderAdmin(); });
    $("#domSave").onclick = () => act(async () => { await rpc("admin_set_domain", { p_domain: $("#domIn").value }); say("admin", "اتحفظ الدومين."); }, async () => { await loadBase(); renderAdmin(); });
    $("#repBtn").onclick = async () => {
      report = "loading"; renderAdmin();
      try {
        const [en, se, at] = await Promise.all([
          CM.fetchAll(() => sb.from("enrollments").select("course_id,student_code,name,grp").order("course_id")),
          CM.fetchAll(() => sb.from("sessions").select("id,course_id,grp,ended").order("id")),
          CM.fetchAll(() => sb.from("attendance").select("session_id,student_code,status").neq("status", "pending").order("session_id"))
        ]);
        const att = new Set(at.map(a => a.session_id + "|" + a.student_code));
        const out = [];
        courses.filter(c => !c.archived && inFilter(c)).forEach(c => {
          const ss = se.filter(s => s.course_id === c.id);
          en.filter(e => e.course_id === c.id).forEach(e => {
            const own = s => !s.grp || s.grp === e.grp;
            const missed = ss.filter(s => s.ended && own(s) && !att.has(s.id + "|" + e.student_code)).length;
            const made = ss.filter(s => !own(s) && att.has(s.id + "|" + e.student_code)).length;
            const ab = Math.max(0, missed - made); if (ab >= 3) out.push({ c, e, ab });
          });
        });
        report = out.sort((a, b) => b.ab - a.ab);
      } catch (e) { report = null; showErr(e); }
      renderAdmin();
    };
  }

  /* ======================= start ======================= */
  sb.auth.onAuthStateChange((ev) => {
    if (ev === "SIGNED_OUT" && me) { me = null; renderLogin(); }
    if (ev === "SIGNED_IN" && !me && login.step === "code" && !login.busy) { login = { step: "email", email: "", err: "", busy: false }; afterLogin(); } // opened the email link in another tab
  });
  sb.auth.getSession().then(({ data }) => { if (data.session) afterLogin(); else renderLogin(); });
})();
</script>
</body>
</html>
