<body>
<div class="wrap" id="app"></div>
<div class="grov" id="grOv" hidden></div>
<div class="grov" id="phOv" hidden></div>
<div class="grov" id="vcOv" hidden></div>
<div class="overlay" id="overlay" hidden>
  <div class="inner">
    <h2 id="ovTitle"></h2>
    <div class="ovgrid">
      <div class="ovqr"><div class="qrimg" id="ovQr"></div><div class="qbar"><i id="ovQbar"></i></div><span class="lbl">امسح بكاميرا الهاتف · يتغيّر كل 15 ثانية</span></div>
      <div class="ovcode"><span class="lbl">أو اكتب الرمز في التطبيق</span><div class="code" id="ovCode"></div><div class="bar"><i id="ovBar"></i></div></div>
    </div>
    <div class="row" style="justify-content:center;gap:28px"><span class="lbl" id="ovLeft"></span><span class="lbl" id="ovCount"></span></div>
    <div><button class="btn" id="ovClose" style="background:transparent;color:var(--board-ink);border-color:var(--board-dim)">إغلاق العرض</button></div>
  </div>
</div>

<div class="scanov" id="scanOv" hidden>
  <video id="scanVid" playsinline muted autoplay></video>
  <div class="frame"><i></i></div>
  <div class="res info" id="scanRes"><b>وجّه الكاميرا نحو بطاقة الطالب</b><span>يفتح الطالب «بطاقة الحضور» على هاتفه.</span></div>
  <div class="foot"><span id="scanCount"></span><button class="btn" id="scanClose">إغلاق الكاميرا</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="drive.js"></script>
<script src="catalog.js"></script>
<script src="voice.js"></script>
<script>
(function () {
  const { $, esc, rpc, errText, store, sb } = CM;
  const app = $("#app");
  if (!CM.configured) { app.innerHTML = CM.setupNotice(); return; }

  const ROLE = { admin: "مسؤول", lecturer: "محاضر", ta: "معيد" };
  const REASON = { old_qr_code: "رمز QR قديم من الشاشة (غالبًا صورة أُرسلت إليه)", bad_qr_code: "رمز QR غير صحيح", wrong_code: "رمز خطأ", expired_code: "رمز منتهي الصلاحية (غالبًا أُرسل إليه)", device_used: "هاتف سُجِّل منه طالب آخر", other_group: "من مجموعة أخرى والتعويض غير متاح", rejected_by_staff: "رُفض طلبه", bad_qr: "بطاقة حضور غير صحيحة", old_qr: "بطاقة حضور قديمة (غالبًا صورة)" };
  const reasonText = r => r.startsWith("too_far:") ? "خارج نطاق القاعة (" + CM.dist(+r.split(":")[1]) + ")" : (REASON[r] || r);

  let me = null, staff = [], settings = { domain: "" }, courses = [], tasAll = [], curId = store.get("cm_course"), view = "course";
  let D = null; // current course data
  let flash = {}; // per-panel messages
  let liveTab = "all", regGroup = "all", delSess = null, pastMark = null, confirmKey = null, startState = null, report = null;
  let qrState = null, qrTimer = null, codeState = null, codeTimer = null, liveTimer = null, manFor = null, manDraft = "";
  let addOpen = false, addDraft = { code: "", name: "", grp: "", pin: "" };
  let grader = null, photo = null, gimp = null, voice = null;
  let ncManual = false;
  let tkSel = null, tkForm = null, tkFilter = "all", tkEdits = {}, tkQ = "", tkBusy = null, ncBylaw = null;
  let login = { step: "email", email: "", err: "", busy: false };

  /* ======================= auth ======================= */
  function renderLogin() {
    stopLoops();
    app.innerHTML = `<header class="top"><div class="brand">${CM.markHtml()}<div><h1 class="wm">hadro</h1><p class="muted small">دخول المحاضرين والمعيدين</p></div></div>${CM.themeBtn()}</header>
      <section class="panel" style="max-width:480px">
      ${login.step === "pass" ? `
        <h2>الدخول بكلمة السر</h2>
        <p class="muted small">تعمل إذا كنت قد عيّنت كلمة سر لحسابك من زر «كلمة السر» داخل البرنامج.</p>
        <label class="f"><span>البريد الجامعي</span><input type="email" id="lgEmail" dir="ltr" autocomplete="username" value="${esc(login.email)}"></label>
        <label class="f"><span>كلمة السر</span><input type="password" id="lgPass" autocomplete="current-password"></label>
        ${login.err ? `<div class="msg bad">${esc(login.err)}</div>` : ""}
        <div class="row"><button class="btn primary" id="lgPwGo" ${login.busy ? "disabled" : ""}>${login.busy ? `<span class="spinner"></span>` : "دخول"}</button><button class="btn ghost" id="lgBack">الدخول برمز على البريد</button></div>
      ` : login.step === "email" ? `
        <h2>الدخول بالبريد الجامعي</h2>
        <p class="muted small">لا حاجة إلى كلمة مرور؛ سيصلك رمز على بريدك لتدخل به. وإن لم يكن بريدك مسجَّلًا، فاطلب من مسؤول القسم إضافتك.</p>
        <label class="f"><span>البريد الجامعي</span><input type="email" id="lgEmail" dir="ltr" autocomplete="username" value="${esc(login.email)}"></label>
        ${login.err ? `<div class="msg bad">${esc(login.err)}</div>` : ""}
        <button class="btn primary" id="lgSend" ${login.busy ? "disabled" : ""}>${login.busy ? `<span class="spinner"></span>` : "إرسال رمز الدخول"}</button>
        <p class="small row" style="margin:0;gap:16px"><button class="linkish" id="lgHave">وصلتني رسالة دخول بالفعل</button><button class="linkish" id="lgPw">الدخول بكلمة السر</button></p>
      ` : `
        <div class="eyebrow mono" style="text-align:start">${esc(login.email)}</div>
        <h2>تحقّق من بريدك</h2>
        <p class="muted small">إذا احتوت الرسالة على رمز فاكتبه هنا، وإذا احتوت على رابط فافتحه <b>في هذا المتصفح نفسه</b> (لا في متصفح تطبيق البريد) لتدخل مباشرة. وإن لم تجدها فراجع مجلد Spam أو Junk.</p>
        <p class="muted small">استخدم <b>آخر</b> رسالة وصلتك؛ فكل طلب جديد يُبطل الرسالة التي قبله، وعدد الرسائل محدود في الساعة.</p>
        <label class="f"><span>رمز الدخول</span><input type="text" id="lgCode" class="codein" inputmode="numeric" maxlength="10" autocomplete="one-time-code"></label>
        ${login.err ? `<div class="msg bad">${esc(login.err)}</div>` : ""}
        <div class="row"><button class="btn primary" id="lgVerify" ${login.busy ? "disabled" : ""}>${login.busy ? `<span class="spinner"></span>` : "دخول"}</button><button class="btn ghost" id="lgBack">بريد آخر</button></div>
      `}</section>`;
    if (login.step === "pass") {
      const go = async () => {
        const email = $("#lgEmail").value.trim().toLowerCase(), password = $("#lgPass").value; login.email = email; login.err = "";
        if (!email || !password) { login.err = "اكتب البريد وكلمة السر."; return renderLogin(); }
        login.busy = true; renderLogin();
        try {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw /invalid login credentials/i.test(error.message) ? { message: "البريد أو كلمة السر غير صحيحة. إذا لم تعيّن كلمة سر بعد، فادخل برمز على البريد ثم عيّنها من زر «كلمة السر»." } : error;
          login = { step: "email", email: "", err: "", busy: false };
          await afterLogin(); return;
        } catch (e) { login.err = e.message && /[\u0600-\u06FF]/.test(e.message) ? e.message : errText(e); }
        login.busy = false; renderLogin();
      };
      $("#lgPwGo").onclick = go; $("#lgPass").onkeydown = e => { if (e.key === "Enter") go(); };
      $("#lgBack").onclick = () => { login.step = "email"; login.err = ""; renderLogin(); };
      return;
    }
    if (login.step === "email") {
      const send = async () => {
        const email = $("#lgEmail").value.trim().toLowerCase(); login.email = email; login.err = "";
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { login.err = "اكتب بريدًا إلكترونيًّا صحيحًا."; return renderLogin(); }
        login.busy = true; renderLogin();
        try {
          const allowed = await rpc("staff_can_login", { p_email: email });
          if (!allowed) throw { message: "هذا البريد غير مسجَّل أو موقوف. اطلب من مسؤول القسم إضافتك." };
          const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
          if (error) throw error;
          login.step = "code"; store.set("cm_otp", JSON.stringify({ email, at: Date.now() }));
        } catch (e) { login.err = e.message && e.message.startsWith("البريد الإلكتروني") ? e.message : errText(e); }
        login.busy = false; renderLogin();
      };
      $("#lgSend").onclick = send; $("#lgEmail").onkeydown = e => { if (e.key === "Enter") send(); };
      $("#lgPw").onclick = () => { login = { step: "pass", email: $("#lgEmail").value.trim().toLowerCase(), err: "", busy: false }; renderLogin(); };
      $("#lgHave").onclick = () => {
        const email = $("#lgEmail").value.trim().toLowerCase();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { login.err = "اكتب بريدك أولًا، ثم اضغط «وصلتني رسالة دخول بالفعل»."; return renderLogin(); }
        login = { step: "code", email, err: "", busy: false }; renderLogin();
      };
    } else {
      const verify = async () => {
        const token = $("#lgCode").value.trim(); login.err = "";
        if (!token) return;
        login.busy = true; renderLogin();
        try {
          const { error } = await sb.auth.verifyOtp({ email: login.email, token, type: "email" });
          if (error) throw error;
          login = { step: "email", email: "", err: "", busy: false }; store.set("cm_otp", "");
          await afterLogin();
          return;
        } catch (e) { login.err = errText(e); }
        login.busy = false; renderLogin();
      };
      $("#lgVerify").onclick = verify; $("#lgCode").onkeydown = e => { if (e.key === "Enter") verify(); };
      $("#lgBack").onclick = () => { login.step = "email"; login.err = ""; renderLogin(); };
    }
  }

  async function signOut(msg) {
    stopLoops(); closeScanner(); await sb.auth.signOut().catch(() => {});
    me = null; D = null; login = { step: "email", email: "", err: msg || "", busy: false }; renderLogin();
  }

  async function afterLogin() {
    app.innerHTML = `<div class="empty" style="margin-top:40px"><span class="spinner"></span></div>`;
    try {
      me = await rpc("staff_me");
      if (!me) return signOut("هذا البريد غير مسجَّل لمحاضر، أو أن حسابه موقوف. تواصل مع مسؤول القسم.");
      await loadBase();
      await loadCourse();
    } catch (e) { app.innerHTML = `<div class="msg bad">${esc(errText(e))}</div>`; }
  }

  async function loadBase() {
    const [st, se, co, ta] = await Promise.all([
      sb.from("staff").select("*").order("name"),
      sb.from("settings").select("*").single(),
      sb.from("courses").select("*").order("created_at"),
      sb.from("course_tas").select("*")
    ]);
    for (const r of [st, se, co, ta]) if (r.error) throw r.error;
    staff = st.data; settings = se.data; courses = co.data; tasAll = ta.data;
    const fl = filtered(); if (!fl.find(c => c.id === curId)) curId = (fl.find(c => role(c) !== "viewer" && !c.archived) || fl[0] || {}).id || null;
  }

  /* ======================= permissions & helpers ======================= */
  const staffName = e => (staff.find(s => s.email === e) || {}).name || e;

  /* ---------- course classification: academic year, term, level, track ---------- */
  const LEVELS = ["", "المستوى الأول", "المستوى الثاني", "المستوى الثالث", "المستوى الرابع", "المستوى الخامس"];
  const TERMS = { 1: "الفصل الدراسي الأول", 2: "الفصل الدراسي الثاني", 3: "الفصل الصيفي" };
  const TRACKS = ["عمارة داخلية", "سينوغرافيا"];
  // البرنامج العام: المستويات 1–5 (الشعبة من الثالث). البرنامج الخاص: عمارة داخلية فقط، المستويات 1–4
  const PROGRAMS = { "عام": "البرنامج العام", "خاص": "البرنامج الخاص" };
  // مقررات اللائحة (catalog.js)
  const CAT = window.CATALOG || [];
  const SEMS = s => s % 2 ? "الفصل الأول (الخريف)" : "الفصل الثاني (الربيع)";
  const catLabel = e => `${e.p ? e.p + " " : ""}${e.c} · ${e.n}${e.note ? " · " + e.note : ""}`;
  const catProg = e => e.pr === "خاص" ? "خاص" : "عام";
  const catGroup = e => (catProg(e) === "خاص" ? "البرنامج الخاص · " : "") + (e.l ? LEVELS[e.l] + " · " + SEMS(e.s) + (e.tr && catProg(e) === "عام" ? " · " + e.tr : "") : "مقررات اختيارية" + (e.el === "عام" ? " عامة" : " · " + e.el));
  // مقررات برنامج وفصل دراسي معيّنين (للمادة الجديدة)
  const catPick = (prog, term) => CAT.filter(e => catProg(e) === prog && (!e.l || term === 3 || !term || e.s % 2 === (term === 1 ? 1 : 0)));
  function catOptions(list, sel) {
    const groups = new Map();
    list.forEach(e => { const g = catGroup(e); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(e); });
    return `<option value="">— اختر مقررًا —</option>` + [...groups].map(([g, l]) => `<optgroup label="${esc(g)}">${l.map(e => { const i = CAT.indexOf(e); return `<option value="${i}" ${i === sel ? "selected" : ""}>${esc(catLabel(e))}</option>`; }).join("")}</optgroup>`).join("");
  }
  // المقررات المناسبة لمادة بحسب مستواها وشعبتها وفصلها
  function catFor(c) {
    if (!c) return CAT;
    const mine = CAT.filter(e => catProg(e) === progOf(c));
    if (!c.level) return mine;
    const m = mine.filter(e => (e.l === c.level && (!e.tr || e.tr === c.track) && (c.term === 3 || !c.term || e.s % 2 === (c.term === 1 ? 1 : 0))) || (!e.l && c.level >= 3 && (e.el === "عام" || e.el === c.track)));
    return m.length ? m : mine;
  }
  const bylawOf = e => ({ p_code: (e.p ? e.p + " " : "") + e.c, p_cw: e.cw ?? null, p_exam: e.ex ?? null, p_credits: e.cr ?? null });
  const progOf = c => c.program === "خاص" ? "خاص" : "عام";
  const levelsOf = prog => [1, 2, 3, 4, 5];
  const nowYear = () => { const d = new Date(), y = d.getFullYear(); return d.getMonth() >= 7 ? `${y}/${y + 1}` : `${y - 1}/${y}`; };
  const nowTerm = () => { const m = new Date().getMonth() + 1; return m >= 9 || m === 1 ? 1 : m <= 6 ? 2 : 3; };
  const yearList = () => { const b = +nowYear().split("/")[0], ys = new Set(); for (let y = b - 2; y <= b + 1; y++) ys.add(`${y}/${y + 1}`); courses.forEach(c => c.academic_year && ys.add(c.academic_year)); return [...ys].sort().reverse(); };
  const clsLabel = c => [progOf(c) === "خاص" ? PROGRAMS["خاص"] : "", LEVELS[c.level] || "", c.track || "", TERMS[c.term] || "", c.academic_year || ""].filter(Boolean).join(" · ") || "غير مصنَّفة";
  const groupLabel = c => c.level ? (progOf(c) === "خاص" || courses.some(x => progOf(x) === "خاص") ? PROGRAMS[progOf(c)] + " · " : "") + LEVELS[c.level] + (c.track ? " · " + c.track : (c.level <= 2 ? " · تخصص عام" : "")) : "غير مصنَّفة";
  let fYear = store.get("cm_year") || nowYear(), fTerm = store.get("cm_term") || String(nowTerm());
  const inFilter = c => (fYear === "all" || !c.academic_year || c.academic_year === fYear) && (fTerm === "all" || !c.term || String(c.term) === fTerm);
  const filtered = () => courses.filter(inFilter).sort((a, b) => (progOf(a) === "خاص") - (progOf(b) === "خاص") || (a.level || 9) - (b.level || 9) || (a.track || "").localeCompare(b.track || "", "ar") || a.name.localeCompare(b.name, "ar"));
  function levelOpts(prog, l) {
    return `<option value="">اختر المستوى</option>` + levelsOf(prog).map(n => `<option value="${n}" ${n === l ? "selected" : ""}>${LEVELS[n]}${prog === "عام" && n <= 2 ? " (تخصص عام)" : ""}</option>`).join("");
  }
  function trackOpts(prog, tr) {
    return prog === "خاص" ? `<option value="عمارة داخلية" selected>عمارة داخلية</option>`
      : `<option value="">اختر الشعبة</option>` + TRACKS.map(v => `<option value="${v}" ${v === tr ? "selected" : ""}>${v}</option>`).join("");
  }
  function classFields(p, c) {
    c = c || {};
    const y = c.academic_year || (fYear !== "all" ? fYear : nowYear()), t = String(c.term || (fTerm !== "all" ? fTerm : nowTerm())), l = c.level || "", prog = c.id ? progOf(c) : "عام";
    return `<label class="f"><span>القسم</span><select id="${p}Dept"><option value="الديكور" selected>الديكور</option></select></label>
      <label class="f"><span>البرنامج</span><select id="${p}Prog">${Object.entries(PROGRAMS).map(([k, v]) => `<option value="${k}" ${k === prog ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label class="f"><span>العام الدراسي</span><select id="${p}Year">${yearList().map(v => `<option value="${v}" ${v === y ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label class="f"><span>الفصل الدراسي</span><select id="${p}Term">${Object.entries(TERMS).map(([k, v]) => `<option value="${k}" ${k === t ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label class="f" id="${p}LevelBox" ${p === "nc" && !ncManual ? "hidden" : ""}><span>المستوى</span><select id="${p}Level">${levelOpts(prog, l)}</select></label>
      <label class="f" id="${p}TrackBox" ${(prog === "خاص" || l >= 3) && !(p === "nc" && !ncManual) ? "" : "hidden"}><span>الشعبة</span><select id="${p}Track">${trackOpts(prog, c.track)}</select></label>`;
  }
  function wireClass(p) {
    const l = $("#" + p + "Level"), g = $("#" + p + "Prog"), tb = $("#" + p + "TrackBox"), tr = $("#" + p + "Track");
    if (!l || !g) return;
    const sync = () => { tb.hidden = (p === "nc" && !ncManual) || !(g.value === "خاص" || +l.value >= 3); const lb = $("#" + p + "LevelBox"); if (lb) lb.hidden = p === "nc" && !ncManual; };
    l.onchange = sync;
    g.onchange = () => {
      const keep = +l.value && levelsOf(g.value).includes(+l.value) ? +l.value : "";
      l.innerHTML = levelOpts(g.value, keep); tr.innerHTML = trackOpts(g.value, tr.value); sync();
      if (p === "nc") ncRefresh();
    };
    const tm = $("#" + p + "Term"); if (tm && p === "nc") tm.onchange = () => ncRefresh();
  }
  function readClass(p) {
    const prog = ($("#" + p + "Prog") || {}).value || "عام", level = +$("#" + p + "Level").value || null;
    const track = prog === "خاص" ? "عمارة داخلية" : level >= 3 ? $("#" + p + "Track").value : "";
    if (!level) throw { message: "اختر المستوى." };
    if (level >= 3 && !track) throw { message: "المستوى " + LEVELS[level].replace("المستوى ", "") + " يلزم اختيار شعبة له: عمارة داخلية أو سينوغرافيا." };
    return { p_year: $("#" + p + "Year").value, p_term: +$("#" + p + "Term").value, p_level: level, p_track: track, p_program: prog };
  }
  function role(c) {
    if (!c || !me) return null;
    if (c.owner_email === me.email) return "owner";
    const t = tasAll.find(t => t.course_id === c.id && t.email === me.email);

  // رمز QR المتغيّر كل 15 ثانية
  const checkinUrl = (sid, tok) => new URL("./", location.href).href + "#qr=" + sid + "." + tok;
  function qrSvgStaff(text) {
    if (typeof window.qrcode !== "function") return "";
    const qr = window.qrcode(0, "M"); qr.addData(text); qr.make();
    const n = qr.getModuleCount(), m = 3, size = n + m * 2; let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
    return `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" role="img" aria-label="رمز QR للحضور"><rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  function paintQr() {
    if (!qrState) return;
    const svg = qrSvgStaff(qrState.url);

      qrState = { url: checkinUrl(s.id, r.token), until: Date.now() + Number(r.ms_left), step: Number(r.step_ms) || 15000 };
      paintQr();

  /* import: header row with a code column; every other column whose header is a date and that has ح / غ marks is one lecture */
  const AR_MONTHS = [["يناير", "jan"], ["فبراير", "feb"], ["مارس", "mar"], ["ابريل", "apr", "إبريل", "أبريل"], ["مايو", "may"], ["يونيو", "jun", "يونية"], ["يوليو", "jul", "يولية"], ["اغسطس", "aug", "أغسطس"], ["سبتمبر", "sep"], ["اكتوبر", "oct", "أكتوبر"], ["نوفمبر", "nov"], ["ديسمبر", "dec"]];
  const digits = s => String(s).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));

  function openFpop(btn, G = RG, pre = "") {

    const draw = () => {
      const st = G.st(), all = G.all(), cur = st.sort || (G.defSort && G.defSort()) || {};
      const vals = C.list ? [...new Set(all.map(C.v))].sort((a, b) => C.ord ? C.ord.indexOf(a) - C.ord.indexOf(b) : String(a).localeCompare(String(b), "ar")) : [];
      const sel = C.list ? (st.f[k] || new Set(vals)) : null, cntOf = v => all.filter(x => C.v(x) === v).length;
      p.innerHTML = `<div class="fp-h">${C.t}</div>
        <button class="fp-i ${cur.col === k && cur.dir > 0 ? "on" : ""}" data-s="1">▲ ترتيب: ${C.up}</button>

      p.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { st.sort = { col: k, dir: +b.dataset.s }; closeFpop(); G.redraw(); });
      const setF = s2 => { st.f[k] = s2.size === vals.length ? null : s2; G.redraw(); draw(); };
      const all2 = p.querySelector("[data-all]"); if (all2) all2.onchange = () => setF(all2.checked ? new Set(vals) : new Set());
      p.querySelectorAll("[data-v]").forEach(cb => cb.onchange = () => { const s2 = new Set(st.f[k] || vals); cb.checked ? s2.add(cb.dataset.v) : s2.delete(cb.dataset.v); setF(s2); });

  function importFile(file) {
    if (!file) return;
    const c = course(), fr = new FileReader();
    fr.onload = async ev => {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" }).filter(r => r.some(v => String(v).trim()));
        if (!rows.length) throw { message: "empty_roster" };
        let ci = -1, ni = -1, gi = -1, pi = -1, start = 0; const h = rows[0].map(v => String(v).trim());
        h.forEach((v, i) => {
          if (gi < 0 && /مجموع|group|سكشن|section|فوج/i.test(v)) gi = i;
          else if (pi < 0 && /رمز|تفعيل|pin|قومي/i.test(v)) pi = i;
          else if (ci < 0 && /كود|رقم|code|id/i.test(v)) ci = i;
          else if (ni < 0 && /اسم|name/i.test(v)) ni = i;
        });
        if (ci >= 0 && ni >= 0) start = 1;
        else { ci = 0; ni = 1; if (!/\d/.test(String(rows[0][0])) && /\d/.test(String(rows[0][1]))) { ci = 1; ni = 0; } if (!/\d/.test(String(rows[0][ci]))) start = 1; }
        const normG = v => { v = String(v ?? "").trim(); const m = { a: "أ", b: "ب", c: "ج", "1": "أ", "2": "ب", "3": "ج", "ا": "أ" }; return m[v.toLowerCase()] || v.slice(0, 10); };
        const list = rows.slice(start).map(r => ({ code: String(r[ci]).trim(), name: String(r[ni]).trim(), grp: gi >= 0 ? normG(r[gi]) : "", pin: pi >= 0 ? String(r[pi]).trim().slice(-4) : "" })).filter(r => r.code && r.name);
        if (!list.length) throw { message: "empty_roster" };
        const n = await rpc("replace_roster", { cid: c.id, rows: list, p_file: file.name });
        const gs = [...new Set(list.map(x => x.grp).filter(Boolean))].sort();
        say("roster", "أُضيف " + n + " طالب من «" + file.name + "»" + (gs.length > 1 ? "، موزّعين على " + gs.map(g => "مجموعة " + g + " (" + list.filter(x => x.grp === g).length + ")").join(" و") : "") + (list.some(x => x.pin) ? "، ومعهم رموز تفعيل" : "") + ".");
      } catch (e) { say("roster", "!" + (e.message === "empty_roster" ? errText(e) : "تعذّرت قراءة الملف. تأكّد من وجود عمود للكود وعمود للاسم. " + errText(e))); }
      await loadCourse().catch(showErr);
    };
    fr.readAsArrayBuffer(file);
  }

          <label class="f"><span>الاسم</span><input type="text" id="invName"></label>
          <label class="f"><span>البريد الجامعي</span><input type="email" id="invEmail" dir="ltr" placeholder="name@${esc(settings.domain || "university.edu.eg")}"></label>
          <label class="f"><span>الدور</span><select id="invRole"><option value="lecturer">محاضر</option><option value="ta">معيد</option><option value="admin">مسؤول</option></select></label>
          <button class="btn primary" id="invBtn">أضف</button>
        </div>
        <p class="muted small">بعد إضافته، أرسل إليه رابط صفحة المحاضرين. يُفعَّل حسابه بمجرد دخوله ببريده والرمز الذي سيصله. ولا يستطيع صاحب الحساب الموقوف الدخول، وتبقى مواده وكشوفه محفوظة.</p>
        <label class="row small" style="gap:8px"><input type="checkbox" id="taCreate" ${settings.ta_can_create ? "checked" : ""}> يمكن للمعيدين إنشاء مواد بأنفسهم (يصبح المعيد الذي ينشئ مادة صاحبَها، فيضيف طلبتها وفريقها ويدير كل شيء فيها)</label>
        <p class="muted small">يُطبَّق تغيير الدور من الجدول فورًا: يستطيع المحاضر إنشاء مواد، ولا يستطيع المعيد ذلك إلا إذا فعّلت هذا الخيار، ويطّلع المسؤول على جميع المواد ويدير الحسابات. أما صلاحيات الشخص داخل أي مادة فتحدّدها عضويته في فريق تلك المادة.</p>
        <div class="settings"><label class="f"><span>نطاق البريد الجامعي (فارغ = أي نطاق)</span><input type="text" id="domIn" dir="ltr" value="${esc(settings.domain || "")}"></label><button class="btn" id="domSave">حفظ النطاق</button></div>
      </section>
      <section class="panel" data-apane="report" ${atab === "report" ? "" : "hidden"}>
        <div class="panel-h"><div><div class="eyebrow">كل مواد القسم · ${fYear === "all" ? "كل الأعوام" : esc(fYear)} · ${fTerm === "all" ? "كل الفصول الدراسية" : TERMS[fTerm]}</div><h2>طلبة لديهم إنذار ثالث أو انسحاب</h2></div><button class="btn sm" id="repBtn">${report === "loading" ? `<span class="spinner"></span>` : report ? "تحديث" : "إعداد التقرير"}</button></div>
        ${Array.isArray(report) ? (report.length ? `<div class="tbl-wrap"><table><thead><tr><th>الطالب</th><th>المادة</th><th>المحاضر</th><th class="c">الغياب</th><th>الحالة</th></tr></thead><tbody>
          ${report.map(x => `<tr><td>${esc(x.e.name)}<div class="mono muted small">${esc(x.e.student_code)}</div></td><td>${esc(x.c.name)}<div class="muted small">${esc(clsLabel(x.c))}</div></td><td>${esc(staffName(x.c.owner_email))}</td><td class="c mono">${x.ab}</td><td>${CM.warnChip(x.ab)}</td></tr>`).join("")}
          </tbody></table></div>` : `<div class="empty">لا يوجد طلبة لديهم إنذار ثالث أو انسحاب.</div>`) : `<p class="muted small">يشمل التقرير جميع المواد، لذا يُحسب عند الطلب.</p>`}
      </section>
      <section class="panel" data-apane="log" ${atab === "log" ? "" : "hidden"}><div class="panel-h"><div><div class="eyebrow">آخر التعديلات في كل المواد</div><h2>سجل التعديلات</h2></div></div>${auditList(au.data || [], true)}</section>`;
    document.body.classList.add("has-ctabs");
    el.querySelectorAll("[data-at]").forEach(b => b.onclick = () => { atab = b.dataset.at; store.set("cm_atab", atab); el.querySelectorAll("[data-at]").forEach(x => x.setAttribute("aria-selected", x.dataset.at === atab)); el.querySelectorAll("[data-apane]").forEach(p => p.hidden = p.dataset.apane !== atab); });
    el.querySelectorAll("[data-sus]").forEach(b => b.onclick = () => act(async () => { await rpc("admin_set_status", { p_email: b.dataset.sus, p_status: b.dataset.to }); say("admin", (b.dataset.to === "suspended" ? "أُوقف حساب " : "فُعِّل حساب ") + staffName(b.dataset.sus) + "."); }, async () => { await loadBase(); renderAdmin(); }));
    $("#invBtn").onclick = () => act(async () => {
      const n = $("#invName").value.trim(), e = $("#invEmail").value.trim().toLowerCase(), r = $("#invRole").value;
      await rpc("admin_save_staff", { p_email: e, p_name: n, p_role: r });
      say("admin", "أُضيف " + n + ". أرسل إليه رابط صفحة المحاضرين: " + location.href.split("#")[0]);
    }, async () => { await loadBase(); renderAdmin(); });
    el.querySelectorAll("[data-role]").forEach(sel => sel.onchange = () => act(async () => { await rpc("admin_set_role", { p_email: sel.dataset.role, p_role: sel.value }); say("admin", "تغيّر دور " + staffName(sel.dataset.role) + " لـ" + ROLE[sel.value] + "."); }, async () => { await loadBase(); renderAdmin(); }));
    $("#taCreate").onchange = ev => act(async () => { await rpc("admin_set_ta_create", { p_on: ev.target.checked }); say("admin", ev.target.checked ? "أصبح بإمكان المعيدين إنشاء مواد." : "لن يتمكن المعيدون من إنشاء مواد."); }, async () => { await loadBase(); render(); });
    $("#domSave").onclick = () => act(async () => { await rpc("admin_set_domain", { p_domain: $("#domIn").value }); say("admin", "حُفظ النطاق."); }, async () => { await loadBase(); renderAdmin(); });
    $("#repBtn").onclick = async () => {
      report = "loading"; renderAdmin();
      try {
        const [en, se, at] = await Promise.all([
          CM.fetchAll(() => sb.from("enrollments").select("course_id,student_code,name,grp").order("course_id")),
          CM.fetchAll(() => sb.from("sessions").select("id,course_id,grp,ended").order("id")),
          CM.fetchAll(() => sb.from("attendance").select("session_id,student_code,status").neq("status", "pending").order("session_id"))
        ]);
        const att = new Set(at.map(a => a.session_id + "|" + a.student_code));
        const out = [];
        courses.filter(c => !c.archived && inFilter(c)).forEach(c => {
          const ss = se.filter(s => s.course_id === c.id);
          en.filter(e => e.course_id === c.id).forEach(e => {
            const own = s => !s.grp || s.grp === e.grp;
            const missed = ss.filter(s => s.ended && own(s) && !att.has(s.id + "|" + e.student_code)).length;
            const made = ss.filter(s => !own(s) && att.has(s.id + "|" + e.student_code)).length;
            const ab = Math.max(0, missed - made); if (CM.lvl(ab) >= 3) out.push({ c, e, ab });
          });
        });
        report = out.sort((a, b) => b.ab - a.ab);
      } catch (e) { report = null; showErr(e); }
      renderAdmin();
    };
  }

  /* ======================= start ======================= */
  sb.auth.onAuthStateChange((ev) => {
    if (ev === "SIGNED_OUT" && me) { me = null; renderLogin(); }
    if (ev === "SIGNED_IN" && !me && login.step === "code" && !login.busy) { login = { step: "email", email: "", err: "", busy: false }; afterLogin(); } // opened the email link in another tab
  });
  sb.auth.getSession().then(({ data }) => {
    if (data.session) return afterLogin();
    try { const o = JSON.parse(store.get("cm_otp") || "null"); if (o && o.email && Date.now() - o.at < 3600e3) login = { step: "code", email: o.email, err: "", busy: false }; } catch (e) {}
    renderLogin();
  });
})();
</script>
</body>
</html>
