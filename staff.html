<script>
(function () {
  const { $, esc, rpc, errText, store, sb } = CM;
  const app = $("#app");
  if (!CM.configured) { app.innerHTML = CM.setupNotice(); return; }

  const ROLE = { admin: "مسؤول", head: "رئيس القسم", lecturer: "محاضر", ta: "معيد" };
  const isDept = () => !!me && (me.role === "admin" || me.role === "head");   // المسؤول ورئيس القسم: متابعة القسم والجدول وكل المواد
  const REASON = { old_qr_code: "رمز QR قديم من الشاشة (غالبًا صورة أُرسلت إليه)", bad_qr_code: "رمز QR غير صحيح", wrong_code: "رمز خطأ", expired_code: "رمز منتهي الصلاحية (غالبًا أُرسل إليه)", device_used: "هاتف سُجِّل منه طالب آخر", other_group: "من مجموعة أخرى والتعويض غير متاح", rejected_by_staff: "رُفض طلبه", bad_qr: "بطاقة حضور غير صحيحة", old_qr: "بطاقة حضور قديمة (غالبًا صورة)" };
  const reasonText = r => r.startsWith("too_far:") ? "خارج نطاق القاعة (" + CM.dist(+r.split(":")[1]) + ")" : (REASON[r] || r);

  let me = null, staff = [], settings = { domain: "" }, courses = [], tasAll = [], curId = store.get("cm_course"), view = store.get("cm_view") === "course" ? "course" : "home";   // يفتح على الرئيسية
  let D = null; // current course data
  let flash = {}; // per-panel messages
  let walerts = null, walertsAt = 0; // تنبيهات الإنذارات في كل موادي
  let liveTab = "all", regGroup = "all", delSess = null, pastMark = null, confirmKey = null, startState = null, report = null;
  let qrState = null, qrTimer = null, codeState = null, codeTimer = null, liveTimer = null, manFor = null, manDraft = "";
  let addOpen = false, addDraft = { code: "", name: "", grp: "", pin: "" };
  let grader = null, photo = null, gimp = null, voice = null;
  let ncManual = false;
  let tkExtra = {}; // tid -> Set: طلبة من مجموعة أخرى أضافهم المحاضر لهذا التكليف استثناءً (قبل رصد درجتهم)
  let tkSel = null, tkForm = null, tkFilter = "all", tkEdits = {}, tkQ = "", tkBusy = null, ncBylaw = null;
  let login = { step: "pass", email: "", err: "", busy: false };

  /* ======================= auth ======================= */
  // الدخول: البريد + كلمة السر. أول مرة أو نسيت كلمة السر: يختار كلمة السر بنفسه، ويؤكد أن البريد بريده برمز يصله مرة واحدة
  let pendingPw = "";
  const PWK = "cm_pw_pending";
  const pwWanted = email => { try { const p = JSON.parse(store.get(PWK) || "null"); return p && p.email === email && Date.now() - p.at < 3600e3; } catch (e) { return false; } };
  const back = `<p class="small" style="margin:0"><a class="linkish" href="./">→ صفحة الدخول الرئيسية</a></p>`;
  /* ---------- طلب حساب جديد (معيد أو محاضر) ---------- */
  const SREQ = "cm_sreq";
  const sreqGet = () => { try { return JSON.parse(store.get(SREQ) || "null"); } catch (e) { return null; } };
  let req = { email: "", name: "", role: "ta", phone: "", note: "", sub: null, err: "", busy: false }, reqSt = null, reqTimer = null;
  function renderRequest() {
    const st = login.step, ps = CM.pushState();
    if (reqTimer && st !== "reqst") { clearInterval(reqTimer); reqTimer = null; }
    const pushBox = () => req.sub ? `<div class="msg ok small">✓ الإشعارات مفعّلة على هذا الجهاز. هيوصلك إشعار أول ما المسؤول يوافق.</div>`
      : ps === "ios-install" ? `<div class="push-req"><b>خطوة مطلوبة: أضف Hadro للشاشة الرئيسية</b><span class="small">على الآيفون الإشعارات بتشتغل من أيقونة الموقع بس. بعد الإضافة افتح الأيقونة ← «عضو هيئة التدريس» ← «اطلب حسابًا».</span>${CM.IOS_STEPS}</div>`
      : ps === "denied" ? `<div class="push-req"><b>الإشعارات مرفوضة على هذا المتصفح</b><span class="small">افتح إعدادات المتصفح ← إعدادات المواقع ← الإشعارات، واسمح لموقع Hadro، ثم أعد فتح الصفحة.</span></div>`
      : ps === "none" ? `<div class="msg warn small">المتصفح ده مابيدعمش الإشعارات. تقدر تبعت الطلب، وتابع حالته من نفس الصفحة («متابعة طلبك»).</div>`
      : `<div class="push-req"><b>فعّل الإشعارات (مطلوب)</b><span class="small">عشان يوصلك إشعار أول ما المسؤول يوافق على حسابك.</span><button class="btn primary" id="rqPush" ${req.busy ? "disabled" : ""}>تفعيل الإشعارات</button></div>`;
    const canSend = req.sub || ps === "none";
    let body;
    if (st === "req") body = `
        <h2>طلب حساب جديد</h2>
        <p class="muted small">املأ بياناتك وابعت الطلب. المسؤول هيراجعه، وأول ما يوافق هيوصلك إشعار، وبعدها تدخل ببريدك وتختار كلمة السر.</p>
        <label class="f"><span>البريد الجامعي</span><input type="email" id="rqEmail" dir="ltr" autocomplete="email" value="${esc(req.email)}" placeholder="name@university.edu.eg"></label>
        <label class="f"><span>الاسم ثلاثي أو رباعي</span><input type="text" id="rqName" autocomplete="name" value="${esc(req.name)}" placeholder="مثال: أحمد محمد علي حسن"></label>
        <div class="f"><span>الصفة</span><div class="cchips">${[["ta", "معيد"], ["lecturer", "محاضر / عضو هيئة تدريس"]].map(([k, l]) => `<button type="button" class="cchip" aria-pressed="${req.role === k}" data-rqr="${k}">${l}</button>`).join("")}</div></div>
        <label class="f"><span>رقم الموبايل (اختياري)</span><input type="tel" id="rqPhone" dir="ltr" inputmode="tel" value="${esc(req.phone)}"></label>
        <label class="f"><span>ملاحظة للمسؤول (اختياري)</span><input type="text" id="rqNote" maxlength="300" value="${esc(req.note)}" placeholder="مثلًا: الشعبة أو المواد اللي هتدرّسها"></label>
        ${pushBox()}
        ${req.err ? `<div class="msg bad">${esc(req.err)}</div>` : ""}
        <button class="btn primary block" id="rqSend" ${req.busy || !canSend ? "disabled" : ""}>${req.busy ? `<span class="spinner"></span>` : "إرسال الطلب"}</button>
        ${!canSend ? `<p class="small muted" style="text-align:center">فعّل الإشعارات الأول عشان تقدر تبعت الطلب.</p>` : ""}
        <button class="linkish" id="lgBack">رجوع إلى الدخول</button>`;
    else {
      const r = reqSt, sq = sreqGet();
      body = !sq ? `<p class="muted">لا يوجد طلب محفوظ على هذا الجهاز.</p><button class="linkish" id="lgBack">رجوع إلى الدخول</button>`
        : !r ? `<p class="muted small"><span class="spinner"></span> جارٍ التحميل…</p>`
        : `<div class="eyebrow mono" style="text-align:start">${esc(r.email)}</div>
        <h2>${r.status === "pending" ? "طلبك قيد المراجعة" : r.status === "approved" ? "تمت الموافقة على حسابك 🎉" : r.status === "rejected" ? "لم تتم الموافقة على طلبك" : "أُلغي هذا الطلب"}</h2>
        ${r.status === "pending" ? `<p class="muted small">قدّمت الطلب باسم <b>${esc(r.name)}</b> بصفة ${r.role === "ta" ? "معيد" : "محاضر"}. هيوصلك إشعار أول ما المسؤول يراجعه${r.push ? "" : "، أو ارجع للصفحة دي"}.</p>${r.push ? "" : pushBox()}`
          : r.status === "approved" ? `<p class="small">ادخل الآن ببريدك الجامعي واختر كلمة السر، وهيوصلك رمز تأكيد على البريد مرة واحدة.</p><button class="btn primary block" id="rqGo">اختر كلمة السر وادخل</button>`
          : r.status === "rejected" ? `${r.reply ? `<div class="msg warn">السبب: ${esc(r.reply)}</div>` : ""}<button class="btn block" id="rqNew">تقديم طلب جديد</button>` : `<button class="btn block" id="rqNew">تقديم طلب جديد</button>`}
        <button class="linkish" id="lgBack">رجوع إلى الدخول</button>`;
    }
    app.innerHTML = `<header class="top"><div class="brand">${CM.markHtml()}<div><h1 class="wm">hadro</h1><p class="muted small">طلب حساب لأعضاء هيئة التدريس والمعيدين</p></div></div>${CM.themeBtn()}</header>
      ${CM.hero({ small: true, eyebrow: "أعضاء هيئة التدريس والمعيدون", title: st === "req" ? "طلب حساب" : "حالة طلبك" })}
      <section class="panel over" style="max-width:480px;margin-inline:auto">${body}</section>`;
    const lb = $("#lgBack"); if (lb) lb.onclick = () => { login = { step: "pass", email: (reqSt && reqSt.email) || req.email || "", err: "", busy: false }; renderLogin(); };
    const keep = () => { const g = id => { const x = $(id); return x ? x.value : ""; }; if ($("#rqEmail")) Object.assign(req, { email: g("#rqEmail").trim().toLowerCase(), name: g("#rqName"), phone: g("#rqPhone"), note: g("#rqNote") }); };
    document.querySelectorAll("[data-rqr]").forEach(b => b.onclick = () => { keep(); req.role = b.dataset.rqr; renderRequest(); });
    const pb = $("#rqPush"); if (pb) pb.onclick = async () => {
      keep(); req.busy = true; req.err = ""; renderRequest();
      try { req.sub = await CM.pushSubscribe(); const sq = sreqGet(); if (st === "reqst" && sq) { await rpc("staff_request_push", { p_id: sq.id, p_token: sq.token, p_sub: req.sub }); reqSt = null; } }
      catch (e) { req.err = e.message && /[؀-ۿ]/.test(e.message) ? e.message : errText(e); }
      req.busy = false; if (st === "reqst") loadReqSt(); else renderRequest();
    };
    const sd = $("#rqSend"); if (sd) sd.onclick = async () => {
      keep(); req.err = "";
      const nm = req.name.trim().replace(/\s+/g, " ");
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(req.email)) req.err = "اكتب بريدك الجامعي صحيحًا.";
      else if (nm.split(" ").length < 3 || /[0-9@]/.test(nm)) req.err = "اكتب اسمك ثلاثيًا أو رباعيًا (3 كلمات على الأقل).";
      if (req.err) return renderRequest();
      req.busy = true; renderRequest();
      try {
        const r = await rpc("staff_request_create", { p_email: req.email, p_name: nm, p_role: req.role, p_phone: req.phone, p_note: req.note, p_sub: req.sub });
        store.set(SREQ, JSON.stringify({ id: r.id, token: r.token, email: req.email })); req.busy = false; login.step = "reqst"; reqSt = null; return renderLogin();
      } catch (e) { req.err = errText(e); }
      req.busy = false; renderRequest();
    };
    const go = $("#rqGo"); if (go) go.onclick = () => { const em = reqSt.email; store.del(SREQ); reqSt = null; login = { step: "setpw", email: em, err: "", busy: false, first: true }; renderLogin(); };
    const nw = $("#rqNew"); if (nw) nw.onclick = () => { const em = (reqSt && reqSt.email) || ""; store.del(SREQ); reqSt = null; req = { email: em, name: "", role: "ta", phone: "", note: "", sub: req.sub, err: "", busy: false }; login.step = "req"; renderLogin(); };
    if (st === "reqst" && !reqSt && sreqGet()) loadReqSt();
    if (st === "reqst" && !reqTimer) reqTimer = setInterval(() => { if (login.step === "reqst" && document.visibilityState === "visible") loadReqSt(); else if (login.step !== "reqst") { clearInterval(reqTimer); reqTimer = null; } }, 20000);
  }
  async function loadReqSt() {
    const sq = sreqGet(); if (!sq) return renderRequest();
    try { reqSt = await rpc("staff_request_status", { p_id: sq.id, p_token: sq.token }); if (!reqSt) { store.del(SREQ); } } catch (e) {}
    if (login.step === "reqst") renderRequest();
  }
  function renderLogin() {
    stopLoops();
    const st = login.step;
    if (st === "req" || st === "reqst") return renderRequest();
    app.innerHTML = `<header class="top"><div class="brand">${CM.markHtml()}<div><h1 class="wm">hadro</h1><p class="muted small">دخول أعضاء هيئة التدريس والمعيدين</p></div></div>${CM.themeBtn()}</header>
      ${CM.hero({ small: true, eyebrow: "أعضاء هيئة التدريس والمعيدون", title: st === "pass" ? "تسجيل الدخول" : st === "code" ? "تأكيد البريد" : "كلمة السر" })}
      <section class="panel over" style="max-width:480px;margin-inline:auto">
      ${st === "pass" ? `
        <h2>الدخول</h2>
        <label class="f"><span>البريد</span><input type="email" id="lgEmail" dir="ltr" autocomplete="username" value="${esc(login.email)}"></label>
        <label class="f"><span>كلمة السر</span><input type="password" id="lgPass" autocomplete="current-password"></label>
        ${login.err ? `<div class="msg bad">${esc(login.err)}</div>` : ""}
        <button class="btn primary block" id="lgPwGo" ${login.busy ? "disabled" : ""}>${login.busy ? `<span class="spinner"></span>` : "دخول"}</button>
        <div class="row" style="gap:16px"><button class="linkish" id="lgFirst">أول مرة؟ اختر كلمة السر</button><button class="linkish" id="lgForgot">نسيت كلمة السر</button></div>
        <div class="lg-req">${sreqGet() ? `<span>قدّمت طلب حساب من هذا الجهاز.</span><button class="btn sm primary" id="lgReqSt">متابعة طلبك</button>` : `<span>معيد أو محاضر جديد وليس لك حساب؟</span><button class="btn sm" id="lgReq">اطلب حسابًا</button>`}</div>
        <p class="small" style="text-align:center;margin:6px 0 0"><button class="linkish" id="lgHelp">عندك مشكلة؟ اسأل مساعد Hadro</button></p>
        ${back}
      ` : st === "setpw" ? `
        <h2>${login.first ? "اختر كلمة السر لحسابك" : "كلمة سر جديدة"}</h2>
        <p class="muted small">اكتب بريدك الذي أضافه مسؤول القسم، واختر كلمة السر التي ستدخل بها بعد ذلك. سيصلك رمز على بريدك <b>مرة واحدة</b> لتأكيد أنه بريدك.</p>
        <label class="f"><span>البريد</span><input type="email" id="lgEmail" dir="ltr" autocomplete="username" value="${esc(login.email)}"></label>
        <label class="f"><span>كلمة السر (8 خانات على الأقل)</span><input type="password" id="lgNew" autocomplete="new-password"></label>
        <label class="f"><span>أعد كتابة كلمة السر</span><input type="password" id="lgNew2" autocomplete="new-password"></label>
        ${login.err ? `<div class="msg bad">${esc(login.err)}</div>` : ""}
        <button class="btn primary block" id="lgSend" ${login.busy ? "disabled" : ""}>${login.busy ? `<span class="spinner"></span>` : "متابعة"}</button>
        <button class="linkish" id="lgBack">رجوع إلى الدخول</button>
      ` : st === "code" ? `
        <div class="eyebrow mono" style="text-align:start">${esc(login.email)}</div>
        <h2>اكتب رمز التأكيد</h2>
        <p class="muted small">أرسلنا إلى بريدك رسالة عنوانها «رمز Hadro» فيها رمز من أرقام. اكتبه هنا. وإن لم تجدها خلال دقيقة فراجع Spam، واستخدم آخر رسالة وصلتك.</p>
        <label class="f"><span>رمز التأكيد</span><input type="text" id="lgCode" class="codein" inputmode="numeric" maxlength="10" autocomplete="one-time-code"></label>
        ${login.err ? `<div class="msg bad">${esc(login.err)}</div>` : ""}
        <button class="btn primary block" id="lgVerify" ${login.busy ? "disabled" : ""}>${login.busy ? `<span class="spinner"></span>` : "تأكيد والدخول"}</button>
        <button class="linkish" id="lgBack">رجوع</button>
      ` : `
        <h2>اختر كلمة السر</h2>
        <p class="muted small">${login.temp ? "دخلت بكلمة سر مؤقتة من مسؤول القسم. اختر الآن كلمة السر الخاصة بك، وستدخل بها من الآن." : "تأكّدنا من بريدك. اختر كلمة السر التي ستدخل بها من الآن."}</p>
        <label class="f"><span>كلمة السر (8 خانات على الأقل)</span><input type="password" id="lgNew" autocomplete="new-password"></label>
        <label class="f"><span>أعد كتابة كلمة السر</span><input type="password" id="lgNew2" autocomplete="new-password"></label>
        ${login.err ? `<div class="msg bad">${esc(login.err)}</div>` : ""}

        <p class="muted small">بعد إضافته، أرسل إليه رابط صفحة المحاضرين. يُفعَّل حسابه بمجرد دخوله ببريده والرمز الذي سيصله. ولا يستطيع صاحب الحساب الموقوف الدخول، وتبقى مواده وكشوفه محفوظة.</p>
        <label class="row small" style="gap:8px"><input type="checkbox" id="taCreate" ${settings.ta_can_create ? "checked" : ""}> يمكن للمعيدين إنشاء مواد بأنفسهم (يصبح المعيد الذي ينشئ مادة صاحبَها، فيضيف طلبتها وفريقها ويدير كل شيء فيها)</label>
        <p class="muted small">يُطبَّق تغيير الدور من الجدول فورًا: يستطيع المحاضر إنشاء مواد، ولا يستطيع المعيد ذلك إلا إذا فعّلت هذا الخيار، ويطّلع المسؤول على جميع المواد ويدير الحسابات. أما صلاحيات الشخص داخل أي مادة فتحدّدها عضويته في فريق تلك المادة.</p>
        <div class="settings"><label class="f"><span>نطاق البريد الجامعي (فارغ = أي نطاق)</span><input type="text" id="domIn" dir="ltr" value="${esc(settings.domain || "")}"></label><button class="btn" id="domSave">حفظ النطاق</button></div>
      </section>
      <section class="panel" data-apane="courses" ${atab === "courses" ? "" : "hidden"}><div class="panel-h"><div><div class="eyebrow">كل مواد القسم · ${fYear === "all" ? "كل الأعوام" : esc(fYear)} · ${fTerm === "all" ? "كل الفصول الدراسية" : TERMS[fTerm]}</div><h2>متابعة المواد</h2></div><button class="btn sm ghost" id="dovRef">تحديث</button></div>${deptCoursesHtml()}</section>
      <section class="panel" data-apane="report" ${atab === "report" ? "" : "hidden"}>
        <div class="panel-h"><div><div class="eyebrow">كل مواد القسم · ${fYear === "all" ? "كل الأعوام" : esc(fYear)} · ${fTerm === "all" ? "كل الفصول الدراسية" : TERMS[fTerm]}</div><h2>طلبة لديهم إنذار ثالث أو انسحاب</h2></div><button class="btn sm" id="repBtn">${report === "loading" ? `<span class="spinner"></span>` : report ? "تحديث" : "إعداد التقرير"}</button></div>
        ${Array.isArray(report) ? (report.length ? `<div class="tbl-wrap"><table><thead><tr><th>الطالب</th><th>المادة</th><th>المحاضر</th><th class="c">الغياب</th><th>الحالة</th></tr></thead><tbody>
          ${report.map(x => `<tr><td class="nm">${esc(x.e.name)}<div class="mono muted small">${esc(x.e.student_code)}</div></td><td>${esc(x.c.name)}<div class="muted small">${esc(clsLabel(x.c))}</div></td><td>${esc(staffName(x.c.owner_email))}</td><td class="c mono">${x.ab}</td><td>${CM.warnChip(x.ab)}</td></tr>`).join("")}
          </tbody></table></div>` : `<div class="empty">لا يوجد طلبة لديهم إنذار ثالث أو انسحاب.</div>`) : `<p class="muted small">يشمل التقرير جميع المواد، لذا يُحسب عند الطلب.</p>`}
      </section>
      <section class="panel" data-apane="log" ${atab === "log" ? "" : "hidden"}><div class="panel-h"><div><div class="eyebrow">آخر التعديلات في كل المواد</div><h2>سجل التعديلات</h2></div></div>${auditList(au.data || [], true)}</section>`;
    document.body.classList.add("has-ctabs");
    wireAdminReq(el); wireAdminInbox(el);
    el.querySelectorAll("[data-autoc]").forEach(b => b.onclick = () => { curId = b.dataset.autoc; store.set("cm_course", curId); fYear = "all"; fTerm = "all"; ctab = "team"; store.set("cm_tab", ctab); view = "course"; flash = {}; loadCourse().catch(showErr); });
    el.querySelectorAll("[data-at]").forEach(b => b.onclick = () => { atab = b.dataset.at; store.set("cm_atab", atab); el.querySelectorAll("[data-at]").forEach(x => x.setAttribute("aria-selected", x.dataset.at === atab)); el.querySelectorAll("[data-apane]").forEach(p => p.hidden = p.dataset.apane !== atab); if ((atab === "inbox" && !faqStats) || (atab === "courses" && !deptOv)) renderAdmin(); });
    el.querySelectorAll("[data-sus]").forEach(b => b.onclick = () => act(async () => { await rpc("admin_set_status", { p_email: b.dataset.sus, p_status: b.dataset.to }); say("admin", (b.dataset.to === "suspended" ? "أُوقف حساب " : "فُعِّل حساب ") + staffName(b.dataset.sus) + "."); }, async () => { await loadBase(); renderAdmin(); }));
    el.querySelectorAll("[data-tpw]").forEach(b => b.onclick = () => act(async () => {
      if (!confirm("إعطاء " + staffName(b.dataset.tpw) + " كلمة سر مؤقتة؟ ستتوقف كلمة سره الحالية إن كانت له واحدة.")) return;
      const { data, error } = await sb.functions.invoke("staffpass", { body: { email: b.dataset.tpw } });
      if (error || !data || !data.password) { let k = ""; try { k = (await error.context.json()).error; } catch (e) {} throw { message: ({ not_admin: "هذه الخاصية للمسؤول فقط.", suspended: "الحساب موقوف، فعّله أولًا.", self: "لا يمكنك إعطاء نفسك كلمة سر مؤقتة؛ غيّر كلمة سرك من «كلمة السر» في الأعلى." })[k] || "تعذّر إنشاء كلمة السر المؤقتة. حاول مرة أخرى." }; }
      tmpPw = data;
    }, async () => { await loadBase(); renderAdmin(); }));
    const tpwMsg = () => tmpPw ? `أهلًا ${tmpPw.name}،\nادخل على Hadro من هذا الرابط:\n${location.href.split("#")[0]}\nالبريد: ${tmpPw.email}\nكلمة السر المؤقتة: ${tmpPw.password}\nبعد الدخول سيطلب منك الموقع اختيار كلمة سر جديدة.` : "";
    if ($("#tpwCopy")) $("#tpwCopy").onclick = async () => { try { await navigator.clipboard.writeText(tpwMsg()); $("#tpwCopy").textContent = "نُسخت ✓"; } catch (e) { prompt("انسخ الرسالة:", tpwMsg()); } };
    if ($("#tpwShare")) $("#tpwShare").onclick = async () => { if (navigator.share) { try { await navigator.share({ text: tpwMsg() }); } catch (e) {} } else location.href = "https://wa.me/?text=" + encodeURIComponent(tpwMsg()); };
    if ($("#tpwClose")) $("#tpwClose").onclick = () => { tmpPw = null; renderAdmin(); };
    $("#invBtn").onclick = () => act(async () => {
      const n = $("#invName").value.trim(), e = $("#invEmail").value.trim().toLowerCase(), r = $("#invRole").value;
      await rpc("admin_save_staff", { p_email: e, p_name: n, p_role: r });
      say("admin", "أُضيف " + n + ". أرسل إليه رابط صفحة المحاضرين: " + location.href.split("#")[0]);
    }, async () => { await loadBase(); renderAdmin(); });
    el.querySelectorAll("[data-role]").forEach(sel => sel.onchange = () => act(async () => { await rpc("admin_set_role", { p_email: sel.dataset.role, p_role: sel.value }); say("admin", "تغيّر دور " + staffName(sel.dataset.role) + " لـ" + ROLE[sel.value] + "."); }, async () => { await loadBase(); renderAdmin(); }));
    el.querySelectorAll("[data-dopen]").forEach(b => b.onclick = () => { curId = b.dataset.dopen; store.set("cm_course", curId); ctab = "reg"; store.set("cm_tab", ctab); view = "course"; flash = {}; loadCourse().catch(showErr); });
    const dr = $("#dovRef"); if (dr) dr.onclick = () => { deptOv = null; renderAdmin(); };
    if ($("#taCreate")) $("#taCreate").onchange = ev => act(async () => { await rpc("admin_set_ta_create", { p_on: ev.target.checked }); say("admin", ev.target.checked ? "أصبح بإمكان المعيدين إنشاء مواد." : "لن يتمكن المعيدون من إنشاء مواد."); }, async () => { await loadBase(); render(); });
    if ($("#domSave")) $("#domSave").onclick = () => act(async () => { await rpc("admin_set_domain", { p_domain: $("#domIn").value }); say("admin", "حُفظ النطاق."); }, async () => { await loadBase(); renderAdmin(); });
    $("#repBtn").onclick = async () => {
      report = "loading"; renderAdmin();
      try {
        const [en, se, at] = await Promise.all([
          CM.fetchAll(() => sb.from("enrollments").select("course_id,student_code,name,grp").order("course_id")),
          CM.fetchAll(() => sb.from("sessions").select("id,course_id,grp,ended").order("id")),
          CM.fetchAll(() => sb.from("attendance").select("session_id,student_code,status").neq("status", "pending").order("session_id"))
        ]);
        const att = new Set(at.map(a => a.session_id + "|" + a.student_code));
        const out = [];
        courses.filter(c => !c.archived && inFilter(c)).forEach(c => {
          const ss = se.filter(s => s.course_id === c.id);
          en.filter(e => e.course_id === c.id).forEach(e => {
            const own = s => !s.grp || s.grp === e.grp;
            const missed = ss.filter(s => s.ended && own(s) && !att.has(s.id + "|" + e.student_code)).length;
            const made = ss.filter(s => !own(s) && att.has(s.id + "|" + e.student_code)).length;
            const ab = Math.max(0, missed - made); if (CM.lvl(ab) >= 3) out.push({ c, e, ab });
          });
        });
        report = out.sort((a, b) => b.ab - a.ab);
      } catch (e) { report = null; showErr(e); }
      renderAdmin();
    };
  }

  /* ======================= start ======================= */
  // دخل بالرابط الذي في البريد (في هذا التبويب أو غيره): إن كان يختار كلمة سر، فتُحفظ أولًا
  async function viaEmail(session) {
    const email = ((session && session.user && session.user.email) || "").toLowerCase();
    if (pendingPw && pwWanted(email)) {
      const r = await sb.auth.updateUser({ password: pendingPw });
      pendingPw = ""; if (!r.error) store.del(PWK);
      login = { step: "pass", email: "", err: "", busy: false }; return afterLogin();
    }
    if (pwWanted(email)) { login = { step: "newpw", email, err: "", busy: false }; return renderLogin(); }
    login = { step: "pass", email: "", err: "", busy: false }; return afterLogin();
  }
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === "SIGNED_OUT" && me) { me = null; renderLogin(); }
    if (ev === "SIGNED_IN" && !me && login.step === "code" && !login.busy) setTimeout(() => viaEmail(session), 0); // فتح رابط البريد في تبويب آخر
  });
  sb.auth.getSession().then(({ data }) => {
    if (data.session) return viaEmail(data.session);
    renderLogin();
  });
})();
</script>
</body>
</html>
