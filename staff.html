<html lang="ar" dir="rtl">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="Classmate: نظام تسجيل الحضور الإلكتروني. تصميم وتطوير أحمد محمد راشد حامد.">
<script>try{var t=localStorage.getItem("cm_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<title>Classmate · المحاضرين</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<div class="overlay" id="overlay" hidden>
  <div class="inner">
    <h2 id="ovTitle"></h2>
    <div class="code" id="ovCode"></div>
    <div class="bar"><i id="ovBar"></i></div>
    <div class="row" style="justify-content:center;gap:28px"><span class="lbl" id="ovLeft"></span><span class="lbl" id="ovCount"></span></div>
    <div><button class="btn" id="ovClose" style="background:transparent;color:var(--board-ink);border-color:var(--board-dim)">إغلاق العرض</button></div>
  </div>
</div>

<div class="scanov" id="scanOv" hidden>
  <video id="scanVid" playsinline muted autoplay></video>
  <div class="frame"><i></i></div>
  <div class="res info" id="scanRes"><b>وجّه الكاميرا نحو بطاقة الطالب</b><span>يفتح الطالب «بطاقة الحضور» على هاتفه.</span></div>
  <div class="foot"><span id="scanCount"></span><button class="btn" id="scanClose">إغلاق الكاميرا</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const { $, esc, rpc, errText, store, sb } = CM;
  const app = $("#app");
  if (!CM.configured) { app.innerHTML = CM.setupNotice(); return; }

  const ROLE = { admin: "مسؤول", lecturer: "محاضر", ta: "معيد" };
  const REASON = { wrong_code: "رمز خطأ", expired_code: "رمز منتهي الصلاحية (غالبًا أُرسل إليه)", device_used: "هاتف سُجِّل منه طالب آخر", other_group: "من مجموعة أخرى والتعويض غير متاح", rejected_by_staff: "رُفض طلبه", bad_qr: "بطاقة حضور غير صحيحة", old_qr: "بطاقة حضور قديمة (غالبًا صورة)" };
  const reasonText = r => r.startsWith("too_far:") ? "خارج نطاق القاعة (" + CM.dist(+r.split(":")[1]) + ")" : (REASON[r] || r);

  let me = null, staff = [], settings = { domain: "" }, courses = [], tasAll = [], curId = store.get("cm_course"), view = "course";
  let D = null; // current course data
  let flash = {}; // per-panel messages
  let liveTab = "all", regGroup = "all", delSess = null, confirmKey = null, startState = null, report = null;
  let codeState = null, codeTimer = null, liveTimer = null, manFor = null, manDraft = "";
  let addOpen = false, addDraft = { code: "", name: "", grp: "", pin: "" };
  let login = { step: "email", email: "", err: "", busy: false };

  /* ======================= auth ======================= */
  function renderLogin() {
    stopLoops();
    app.innerHTML = `<header class="top"><div class="brand"><div class="mark">C</div><div><h1>Classmate</h1><p class="muted small">دخول المحاضرين والمعيدين</p></div></div>${CM.themeBtn()}</header>
      <section class="panel" style="max-width:480px">
      ${login.step === "email" ? `
        <h2>الدخول بالبريد الجامعي</h2>
        <p class="muted small">لا حاجة إلى كلمة مرور؛ سيصلك رمز على بريدك لتدخل به. وإن لم يكن بريدك مسجَّلًا، فاطلب من مسؤول القسم إضافتك.</p>
        <label class="f"><span>البريد الجامعي</span><input type="email" id="lgEmail" dir="ltr" autocomplete="username" value="${esc(login.email)}"></label>
        ${login.err ? `<div class="msg bad">${esc(login.err)}</div>` : ""}
        <button class="btn primary" id="lgSend" ${login.busy ? "disabled" : ""}>${login.busy ? `<span class="spinner"></span>` : "إرسال رمز الدخول"}</button>
      ` : `
        <div class="eyebrow mono" style="text-align:start">${esc(login.email)}</div>
        <h2>تحقّق من بريدك</h2>
        <p class="muted small">إذا احتوت الرسالة على رمز فاكتبه هنا، وإذا احتوت على رابط فافتحه من الجهاز نفسه لتدخل مباشرة. وإن لم تجدها فراجع مجلد Spam أو Junk.</p>
        <label class="f"><span>رمز الدخول</span><input type="text" id="lgCode" class="codein" inputmode="numeric" maxlength="10" autocomplete="one-time-code"></label>
        ${login.err ? `<div class="msg bad">${esc(login.err)}</div>` : ""}
        <div class="row"><button class="btn primary" id="lgVerify" ${login.busy ? "disabled" : ""}>${login.busy ? `<span class="spinner"></span>` : "دخول"}</button><button class="btn ghost" id="lgBack">بريد آخر</button></div>
      `}</section>`;
    if (login.step === "email") {
      const send = async () => {
        const email = $("#lgEmail").value.trim().toLowerCase(); login.email = email; login.err = "";
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { login.err = "اكتب بريدًا إلكترونيًّا صحيحًا."; return renderLogin(); }
        login.busy = true; renderLogin();
        try {
          const allowed = await rpc("staff_can_login", { p_email: email });
          if (!allowed) throw { message: "هذا البريد غير مسجَّل أو موقوف. اطلب من مسؤول القسم إضافتك." };
          const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
          if (error) throw error;
          login.step = "code";
        } catch (e) { login.err = e.message && e.message.startsWith("البريد الإلكتروني") ? e.message : errText(e); }
        login.busy = false; renderLogin();
      };
      $("#lgSend").onclick = send; $("#lgEmail").onkeydown = e => { if (e.key === "Enter") send(); };
    } else {
      const verify = async () => {
        const token = $("#lgCode").value.trim(); login.err = "";
        if (!token) return;
        login.busy = true; renderLogin();
        try {
          const { error } = await sb.auth.verifyOtp({ email: login.email, token, type: "email" });
          if (error) throw error;
          login = { step: "email", email: "", err: "", busy: false };
          await afterLogin();
          return;
        } catch (e) { login.err = errText(e); }
        login.busy = false; renderLogin();
      };
      $("#lgVerify").onclick = verify; $("#lgCode").onkeydown = e => { if (e.key === "Enter") verify(); };
      $("#lgBack").onclick = () => { login.step = "email"; login.err = ""; renderLogin(); };
    }
  }

  async function signOut(msg) {
    stopLoops(); closeScanner(); await sb.auth.signOut().catch(() => {});
    me = null; D = null; login = { step: "email", email: "", err: msg || "", busy: false }; renderLogin();
  }

  async function afterLogin() {
    app.innerHTML = `<div class="empty" style="margin-top:40px"><span class="spinner"></span></div>`;
    try {
      me = await rpc("staff_me");
      if (!me) return signOut("هذا البريد غير مسجَّل لمحاضر، أو أن حسابه موقوف. تواصل مع مسؤول القسم.");
      await loadBase();
      await loadCourse();
    } catch (e) { app.innerHTML = `<div class="msg bad">${esc(errText(e))}</div>`; }
  }

  async function loadBase() {
    const [st, se, co, ta] = await Promise.all([
      sb.from("staff").select("*").order("name"),
      sb.from("settings").select("*").single(),
      sb.from("courses").select("*").order("created_at"),
      sb.from("course_tas").select("*")
    ]);
    for (const r of [st, se, co, ta]) if (r.error) throw r.error;
    staff = st.data; settings = se.data; courses = co.data; tasAll = ta.data;
    const fl = filtered(); if (!fl.find(c => c.id === curId)) curId = (fl.find(c => role(c) !== "viewer" && !c.archived) || fl[0] || {}).id || null;
  }

  /* ======================= permissions & helpers ======================= */
  const staffName = e => (staff.find(s => s.email === e) || {}).name || e;

  /* ---------- course classification: academic year, term, level, track ---------- */
  const LEVELS = ["", "المستوى الأول", "المستوى الثاني", "المستوى الثالث", "المستوى الرابع", "المستوى الخامس"];
  const TERMS = { 1: "الفصل الدراسي الأول", 2: "الفصل الدراسي الثاني", 3: "الفصل الصيفي" };
  const TRACKS = ["عمارة داخلية", "سينوغرافيا"];
  const nowYear = () => { const d = new Date(), y = d.getFullYear(); return d.getMonth() >= 7 ? `${y}/${y + 1}` : `${y - 1}/${y}`; };
  const nowTerm = () => { const m = new Date().getMonth() + 1; return m >= 9 || m === 1 ? 1 : m <= 6 ? 2 : 3; };
  const yearList = () => { const b = +nowYear().split("/")[0], ys = new Set(); for (let y = b - 2; y <= b + 1; y++) ys.add(`${y}/${y + 1}`); courses.forEach(c => c.academic_year && ys.add(c.academic_year)); return [...ys].sort().reverse(); };
  const clsLabel = c => [LEVELS[c.level] || "", c.track || "", TERMS[c.term] || "", c.academic_year || ""].filter(Boolean).join(" · ") || "غير مصنَّفة";
  const groupLabel = c => c.level ? LEVELS[c.level] + (c.track ? " · " + c.track : (c.level <= 2 ? " · تخصص عام" : "")) : "غير مصنَّفة";
  let fYear = store.get("cm_year") || nowYear(), fTerm = store.get("cm_term") || String(nowTerm());
  const inFilter = c => (fYear === "all" || !c.academic_year || c.academic_year === fYear) && (fTerm === "all" || !c.term || String(c.term) === fTerm);
  const filtered = () => courses.filter(inFilter).sort((a, b) => (a.level || 9) - (b.level || 9) || (a.track || "").localeCompare(b.track || "", "ar") || a.name.localeCompare(b.name, "ar"));
  function classFields(p, c) {
    c = c || {};
    const y = c.academic_year || (fYear !== "all" ? fYear : nowYear()), t = String(c.term || (fTerm !== "all" ? fTerm : nowTerm())), l = c.level || "";
    return `<label class="f"><span>العام الدراسي</span><select id="${p}Year">${yearList().map(v => `<option value="${v}" ${v === y ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label class="f"><span>الفصل الدراسي</span><select id="${p}Term">${Object.entries(TERMS).map(([k, v]) => `<option value="${k}" ${k === t ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label class="f"><span>المستوى</span><select id="${p}Level"><option value="">اختر المستوى</option>${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${n === l ? "selected" : ""}>${LEVELS[n]}${n <= 2 ? " (تخصص عام)" : ""}</option>`).join("")}</select></label>
      <label class="f" id="${p}TrackBox" ${l >= 3 ? "" : "hidden"}><span>الشعبة</span><select id="${p}Track"><option value="">اختر الشعبة</option>${TRACKS.map(v => `<option value="${v}" ${v === c.track ? "selected" : ""}>${v}</option>`).join("")}</select></label>`;
  }
  function wireClass(p) { const l = $("#" + p + "Level"); if (l) l.onchange = () => { $("#" + p + "TrackBox").hidden = !(+l.value >= 3); }; }
  function readClass(p) {
    const level = +$("#" + p + "Level").value || null, track = level >= 3 ? $("#" + p + "Track").value : "";
    if (!level) throw { message: "اختر المستوى." };
    if (level >= 3 && !track) throw { message: "المستوى " + LEVELS[level].replace("المستوى ", "") + " يلزم اختيار شعبة له: عمارة داخلية أو سينوغرافيا." };
    return { p_year: $("#" + p + "Year").value, p_term: +$("#" + p + "Term").value, p_level: level, p_track: track };
  }
  function role(c) {
    if (!c || !me) return null;
    if (c.owner_email === me.email) return "owner";
    const t = tasAll.find(t => t.course_id === c.id && t.email === me.email);
    if (t) return t.kind === "co" ? "co" : "ta";
    return me.role === "admin" ? "viewer" : null;
  }
  const course = () => courses.find(c => c.id === curId) || null;
  const canRun = c => ["owner", "co", "ta"].includes(role(c));
  const canManage = c => ["owner", "co"].includes(role(c)); // students, roster, ended lectures
  const isOwner = c => role(c) === "owner";
  const canCreate = () => me && (me.role !== "ta" || !!settings.ta_can_create);                 // team, course settings, delete
  const isOwn = (s, e) => !s.grp || (e && s.grp === e.grp);
  const counted = r => r && r.status !== "pending";
  const groupsOf = () => [...new Set(D.enroll.map(e => e.grp).filter(Boolean))].sort();
  const running = () => D && D.sessions.find(s => !s.ended);
  const isOpen = s => s && !s.ended && !s.closed_at && new Date(s.ends_at) > new Date();
  const nameOf = code => (D.enroll.find(e => e.student_code === code) || {}).name || code;
  // المحاضرة بتتحسب في الغياب أول ما التسجيل فيها يتقفل (أو تنتهي)
  const regDone = s => !!(s.ended || s.closed_at || Date.now() >= new Date(s.ends_at).getTime());
  function absences(e) {
    const missed = D.sessions.filter(s => regDone(s) && isOwn(s, e) && !counted((D.att[s.id] || {})[e.student_code])).length;
    const made = D.sessions.filter(s => !isOwn(s, e) && counted((D.att[s.id] || {})[e.student_code])).length;
    return Math.max(0, missed - made);
  }
  function attendance(e) {
    const own = D.sessions.filter(s => isOwn(s, e)).length, att = D.sessions.filter(s => counted((D.att[s.id] || {})[e.student_code])).length;
    return { own, att, pct: own ? Math.min(100, Math.round(att / own * 100)) : 0 };
  }
  const say = (k, text) => { flash[k] = text; };
  const msgHtml = k => flash[k] ? `<div class="msg ${flash[k].startsWith("!") ? "bad" : "ok"}">${esc(flash[k].replace(/^!/, ""))}</div>` : "";

  /* ======================= data ======================= */
  async function loadCourse() {
    stopLoops();
    const c = course();
    if (!c) { D = null; return render(); }
    store.set("cm_course", c.id);
    const [en, se, ta, au] = await Promise.all([
      CM.fetchAll(() => sb.from("enrollments").select("*").eq("course_id", c.id).order("student_code")),
      sb.from("sessions").select("*").eq("course_id", c.id).order("n"),
      sb.from("course_tas").select("*").eq("course_id", c.id),
      sb.from("audit").select("*").eq("course_id", c.id).order("at", { ascending: false }).limit(60)
    ]);
    for (const r of [se, ta, au]) if (r.error) throw r.error;
    const sessions = se.data, ids = sessions.map(s => s.id);
    const att = {};
    if (ids.length) {
      const rows = await CM.fetchAll(() => sb.from("attendance").select("*").in("session_id", ids).order("at"));
      rows.forEach(r => { (att[r.session_id] = att[r.session_id] || {})[r.student_code] = r; });
    }
    const focus = sessions.find(s => !s.ended) || sessions[sessions.length - 1];
    let attempts = [];
    if (focus) { const r = await sb.from("attempts").select("*").eq("session_id", focus.id).order("at", { ascending: false }).limit(300); if (r.error) throw r.error; attempts = r.data; }
    let bindings = {};
    try { (await rpc("course_bindings", { cid: c.id })).forEach(b => bindings[b.student_code] = b); } catch (e) {}
    D = { cid: c.id, enroll: en, sessions, tas: ta.data, audit: au.data, att, attempts, bindings };
    if (scan && !sessions.some(x => x.id === scan.sid && !x.ended)) closeScanner();
    render();
    startLoops();
  }

  async function refreshLive() {
    const s = D && running(); if (!s) return;
    const [a, t, ss, au] = await Promise.all([
      sb.from("attendance").select("*").eq("session_id", s.id),
      sb.from("attempts").select("*").eq("session_id", s.id).order("at", { ascending: false }).limit(300),
      sb.from("sessions").select("*").eq("id", s.id).single(),
      sb.from("audit").select("*").eq("course_id", s.course_id).order("at", { ascending: false }).limit(60)
    ]);
    if (a.error || t.error || ss.error || !D || D.cid !== s.course_id) return;
    D.att[s.id] = {}; a.data.forEach(r => D.att[s.id][r.student_code] = r);
    D.attempts = t.data;
    if (!au.error && (au.data[0] || {}).id !== (D.audit[0] || {}).id) { D.audit = au.data; renderAudit(); }
    const i = D.sessions.findIndex(x => x.id === s.id), wasOpen = isOpen(s);
    if (i >= 0) D.sessions[i] = ss.data;
    if (!manFor) renderLive();
    renderRegister();
    if (ctab === "report" && !(document.activeElement && document.activeElement.id === "rpQ")) keepScroll("#reportPanel", renderReport);
    tabBadges();
    if (!rosterMan && !fpopCol && !(document.activeElement && document.activeElement.closest && document.activeElement.closest("#rsTbl"))) keepScroll("#rosterPanel", renderRosterTable);
    scanCount();
    if (wasOpen !== isOpen(ss.data)) renderSession();
  }

  /* ======================= loops (code + live list) ======================= */
  function stopLoops() { manFor = null; rosterMan = null; clearTimeout(codeTimer); clearInterval(liveTimer); codeTimer = null; liveTimer = null; codeState = null; $("#overlay").hidden = true; }
  function startLoops() {
    const c = course(), s = running();
    if (!s) return;
    liveTimer = setInterval(() => { if (document.visibilityState === "visible") refreshLive().catch(() => {}); }, 5000);
    if (canRun(c) && isOpen(s)) fetchCode();
  }
  async function fetchCode() {
    const s = running(); if (!s) return;
    try {
      const r = await rpc("current_code", { sid: s.id });
      if (!r.open) { codeState = null; await loadCourse(); return; }
      codeState = { code: r.code, until: Date.now() + Number(r.ms_left), step: Number(r.step_ms) || 30000, ends: Date.now() + Number(r.ends_in_ms) };
      tick();
      codeTimer = setTimeout(fetchCode, Math.max(500, Number(r.ms_left) + 300));
    } catch (e) { codeTimer = setTimeout(fetchCode, 3000); }
  }
  function tick() {
    if (!codeState) return;
    const left = codeState.until - Date.now(), pct = Math.max(0, Math.min(100, left / codeState.step * 100)), code = codeState.code.slice(0, 3) + " " + codeState.code.slice(3);
    const s = running(), c = course(), exp = s ? D.enroll.filter(e => isOwn(s, e)) : [], pres = s ? exp.filter(e => counted((D.att[s.id] || {})[e.student_code])).length : 0;
    const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
    set("#bCode", code); set("#ovCode", code);
    const bar = $("#bBar"); if (bar) bar.style.width = pct + "%";
    $("#ovBar").style.width = pct + "%";
    set("#bNext", "الرمز التالي بعد " + (left >= 60000 ? CM.mmss(left) : Math.max(0, Math.ceil(left / 1000)) + " ثانية"));
    set("#bLeft", "يُغلق التسجيل بعد " + CM.mmss(codeState.ends - Date.now()));
    set("#ovLeft", "يُغلق التسجيل بعد " + CM.mmss(codeState.ends - Date.now()));
    set("#ovCount", "حضر " + pres + " من " + exp.length);
    if (s && c) set("#ovTitle", c.name + " · المحاضرة " + s.n + (s.kind === "outdoor" ? " (خارجية)" : "") + " · " + (s.grp ? "مجموعة " + s.grp : "الدفعة كاملة"));
    if (codeState.ends <= Date.now()) { codeState = null; clearTimeout(codeTimer); loadCourse(); }
  }
  setInterval(tick, 1000);
  $("#ovClose").onclick = () => { $("#overlay").hidden = true; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); };

  /* ======================= render ======================= */
  const ICO = d => `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const CTABS = [
    ["live", "المحاضرة", ICO('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>')],
    ["students", "الطلبة", ICO('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>')],
    ["reg", "الكشف", ICO('<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>')],
    ["report", "التقرير", ICO('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>')],
    ["team", "الفريق", ICO('<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/><path d="M19 3.5v3M20.5 5h-3"/>')],
    ["log", "السجل", ICO('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>')]
  ];
  let ctab = ["live", "students", "reg", "report", "team", "log"].includes(store.get("cm_tab")) ? store.get("cm_tab") : "live";
  function showTab(k) {
    ctab = k; store.set("cm_tab", k); closeFpop();

        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" }).filter(r => r.some(v => String(v).trim()));
        if (!rows.length) throw { message: "empty_roster" };
        let ci = -1, ni = -1, gi = -1, pi = -1, start = 0; const h = rows[0].map(v => String(v).trim());
        h.forEach((v, i) => {
          if (gi < 0 && /مجموع|group|سكشن|section|فوج/i.test(v)) gi = i;
          else if (pi < 0 && /رمز|تفعيل|pin|قومي/i.test(v)) pi = i;
          else if (ci < 0 && /كود|رقم|code|id/i.test(v)) ci = i;
          else if (ni < 0 && /اسم|name/i.test(v)) ni = i;
        });
        if (ci >= 0 && ni >= 0) start = 1;
        else { ci = 0; ni = 1; if (!/\d/.test(String(rows[0][0])) && /\d/.test(String(rows[0][1]))) { ci = 1; ni = 0; } if (!/\d/.test(String(rows[0][ci]))) start = 1; }
        const normG = v => { v = String(v ?? "").trim(); const m = { a: "أ", b: "ب", c: "ج", "1": "أ", "2": "ب", "3": "ج", "ا": "أ" }; return m[v.toLowerCase()] || v.slice(0, 10); };
        const list = rows.slice(start).map(r => ({ code: String(r[ci]).trim(), name: String(r[ni]).trim(), grp: gi >= 0 ? normG(r[gi]) : "", pin: pi >= 0 ? String(r[pi]).trim().slice(-4) : "" })).filter(r => r.code && r.name);
        if (!list.length) throw { message: "empty_roster" };
        const n = await rpc("replace_roster", { cid: c.id, rows: list, p_file: file.name });
        const gs = [...new Set(list.map(x => x.grp).filter(Boolean))].sort();
        say("roster", "أُضيف " + n + " طالب من «" + file.name + "»" + (gs.length > 1 ? "، موزّعين على " + gs.map(g => "مجموعة " + g + " (" + list.filter(x => x.grp === g).length + ")").join(" و") : "") + (list.some(x => x.pin) ? "، ومعهم رموز تفعيل" : "") + ".");
      } catch (e) { say("roster", "!" + (e.message === "empty_roster" ? errText(e) : "تعذّرت قراءة الملف. تأكّد من وجود عمود للكود وعمود للاسم. " + errText(e))); }
      await loadCourse().catch(showErr);
    };
    fr.readAsArrayBuffer(file);
  }

  /* ---------- team + course settings ---------- */
  function renderTeam() {
    const c = course(), el = $("#teamPanel"), mng = isOwner(c);
    const cands = staff.filter(u => u.status !== "suspended" && u.email !== c.owner_email && !D.tas.some(t => t.email === u.email));
    const team = [...D.tas].sort((a, b) => (a.kind === "co" ? 0 : 1) - (b.kind === "co" ? 0 : 1));
    el.innerHTML = `<div class="panel-h"><div><div class="eyebrow">القائمون على المادة</div><h2>فريق المادة</h2></div></div>
      ${msgHtml("team")}
      <div class="list" style="max-height:none">
        <div class="li man"><span class="chip man">صاحب المادة</span><div class="who"><b>${esc(staffName(c.owner_email))}</b><small class="mono">${esc(c.owner_email)}</small></div><span></span></div>
        ${team.map(t => `<div class="li ${t.kind === "co" ? "man" : ""}"><span class="chip ${t.kind === "co" ? "man" : "none"}">${t.kind === "co" ? "محاضر مشارك" : "معيد"}</span><div class="who"><b>${esc(staffName(t.email))}</b><small class="mono">${esc(t.email)}</small></div><div class="acts">${mng ? `<button class="btn sm ghost" data-kind="${esc(t.email)}" data-to="${t.kind === "co" ? "ta" : "co"}">${t.kind === "co" ? "تحويله إلى معيد" : "تحويله إلى محاضر مشارك"}</button><button class="btn sm ghost danger" data-rmta="${esc(t.email)}">إزالة</button>` : ""}</div></div>`).join("")}
      </div>
      ${mng ? (cands.length ? `<div class="settings"><label class="f"><span>إضافة إلى الفريق</span><select id="taPick">${cands.map(u => `<option value="${esc(u.email)}">${esc(u.name)} (${ROLE[u.role]})</option>`).join("")}</select></label><label class="f"><span>بصفته</span><select id="taKind"><option value="co">محاضر مشارك</option><option value="ta" selected>معيد</option></select></label><button class="btn" id="taAdd">أضف</button></div>` : `<p class="muted small">لا توجد حسابات أخرى لإضافتها. إن لم يكن المحاضر أو المعيد موجودًا، فاطلب من مسؤول القسم إضافته.</p>`)
        + `<p class="muted small"><b>المحاضر المشارك</b> يقوم بكل ما تقوم به في المحاضرات والطلبة والكشف (ومنه تعديل المحاضرات المنتهية)، باستثناء حذف المادة وتعديل بياناتها وإدارة الفريق. <b>المعيد</b> يبدأ المحاضرات، ويوافق على الطلبات، ويسجّل يدويًّا، ويضيف طالبًا، لكنه لا يرفع ملف الطلبة ولا يعدّل المحاضرات بعد انتهائها.</p>` : ""}
      ${mng || me.role === "admin" ? `<div style="border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px">
        <h3>إعدادات المادة</h3>
        ${msgHtml("course")}
        ${mng ? `${c.level ? "" : `<div class="msg bad small">هذه المادة غير مصنَّفة بعد. اختر العام والفصل الدراسي والمستوى، ثم اضغط «حفظ».</div>`}
        <div class="settings"><label class="f"><span>اسم المادة</span><input type="text" id="cName" value="${esc(c.name)}"></label>${classFields("e", c)}<button class="btn" id="cRename">حفظ بيانات المادة</button></div>
        <div class="row"><button class="btn sm ghost" id="arch">${c.archived ? "إعادة المادة من الأرشيف" : "أرشفة المادة (نهاية الفصل الدراسي)"}</button><span class="muted small">الأرشفة تُخفي المادة عن الطلبة وتحتفظ بالكشف.</span></div>` : ""}
        ${confirmKey === "delcourse" ? `<div class="msg bad" style="display:grid;gap:8px">
            <b>الحذف نهائي ولا يمكن التراجع عنه.</b>
            <span class="small">سيُحذف ${D.sessions.length} محاضرة بما فيها من حضور وإنذارات، وطلبة المادة. إذا احتجت الكشف فصدّره إلى إكسل أولًا. للتأكيد اكتب اسم المادة كما هو: <b>${esc(c.name)}</b></span>
            <input type="text" id="delName" autocomplete="off">
            <div class="row"><button class="btn sm danger" id="delGo">حذف المادة نهائيًّا</button><button class="btn sm ghost" id="delCancel">إلغاء</button></div>
          </div>` : `<div class="row"><button class="btn sm ghost danger" id="delAsk">حذف المادة</button></div>`}
      </div>` : ""}`;
    el.querySelectorAll("[data-rmta]").forEach(b => b.onclick = () => act(() => rpc("remove_ta", { cid: c.id, p_email: b.dataset.rmta }), async () => { await loadBase(); await loadCourse(); }));
    const ta = $("#taAdd"); if (ta) ta.onclick = () => act(() => rpc("add_member", { cid: c.id, p_email: $("#taPick").value, p_kind: $("#taKind").value }), async () => { await loadBase(); await loadCourse(); });
    el.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => act(() => rpc("add_member", { cid: c.id, p_email: b.dataset.kind, p_kind: b.dataset.to }), async () => { await loadBase(); await loadCourse(); }));
    const ar = $("#arch"); if (ar) ar.onclick = () => act(() => rpc("set_course_archived", { cid: c.id, p_archived: !c.archived }), async () => { await loadBase(); await loadCourse(); });
    const rn = $("#cRename"); if (rn) rn.onclick = () => {
      const n = $("#cName").value.trim();
      if (!n) { say("course", "!اكتب اسم المادة."); return renderTeam(); }
      let cls; try { cls = readClass("e"); } catch (e) { say("course", "!" + e.message); return renderTeam(); }
      act(async () => {
        await rpc("update_course_info", { cid: c.id, p_name: n, ...cls });
        fYear = cls.p_year; fTerm = String(cls.p_term); store.set("cm_year", fYear); store.set("cm_term", fTerm);
        say("course", "حُفظت بيانات المادة.");
      }, async () => { await loadBase(); await loadCourse(); });
    };
    wireClass("e");
    const da = $("#delAsk"); if (da) da.onclick = () => { confirmKey = "delcourse"; renderTeam(); const i = $("#delName"); if (i) i.focus(); };
    const dc = $("#delCancel"); if (dc) dc.onclick = () => { confirmKey = null; renderTeam(); };
    const dg = $("#delGo"); if (dg) dg.onclick = async () => {
      const typed = $("#delName").value.trim();
      if (typed !== c.name.trim()) { say("course", "!الاسم المكتوب لا يطابق اسم المادة."); return renderTeam(); }
      try {
        await rpc("delete_course", { cid: c.id, p_confirm: typed });
        confirmKey = null; flash = {}; curId = null; store.del("cm_course");
        await loadBase(); await loadCourse();
        toast("حُذفت المادة «" + c.name + "».");
      } catch (e) { say("course", "!" + errText(e)); renderTeam(); }
    };
  }

  function auditList(items, showCourse) {
    if (!items.length) return `<div class="empty">لا توجد تعديلات حتى الآن.</div>`;
    return `<div class="list">${items.map(a => { const c = courses.find(x => x.id === a.course_id);
      return `<div class="li"><span class="small muted mono">${CM.fmtD(a.at)} ${CM.fmtT(a.at)}</span><div class="who"><b>${esc(staffName(a.actor))}</b><small>${esc(a.action)}${showCourse && c ? " · " + esc(c.name) : ""}</small></div><span></span></div>`; }).join("")}</div>`;
  }
  function renderAudit() {
    $("#auditPanel").innerHTML = `<div class="panel-h"><div><div class="eyebrow">من فعل ماذا ومتى</div><h2>سجل تعديلات المادة</h2></div></div>
      <p class="muted small">يُسجَّل هنا كل تسجيل يدوي، وكل موافقة أو رفض، وكل إلغاء حضور أو فك ربط هاتف أو نقل طالب بين المجموعات، ولا يمكن لأحد حذفه.</p>${auditList(D.audit, false)}`;
  }

  /* ======================= admin ======================= */
  let atab = ["staff", "report", "log"].includes(store.get("cm_atab")) ? store.get("cm_atab") : "staff";
  async function renderAdmin() {
    const el = $("#adminArea");
    const au = await sb.from("audit").select("*").order("at", { ascending: false }).limit(40);
    const AT = [["staff", "الحسابات", CTABS[4][2]], ["report", "تقرير الإنذارات", CTABS[3][2]], ["log", "السجل", CTABS[5][2]]];
    el.innerHTML = `<nav class="ctabs admin" role="tablist" aria-label="لوحة المسؤول">${AT.map(([k, t, ic]) => `<button role="tab" data-at="${k}" aria-selected="${atab === k}">${ic}<span class="l">${t}</span></button>`).join("")}</nav>
      <section class="panel" data-apane="staff" ${atab === "staff" ? "" : "hidden"}>
        <div class="panel-h"><div><div class="eyebrow">${staff.length} حساب</div><h2>المحاضرين والمعيدين</h2></div></div>
        ${msgHtml("admin")}
        <div class="tbl-wrap"><table><thead><tr><th>الاسم</th><th>البريد الإلكتروني</th><th>الدور</th><th>المواد</th><th>الحالة</th><th></th></tr></thead><tbody>
        ${staff.map(u => { const o = courses.filter(c => c.owner_email === u.email).length, t = tasAll.filter(x => x.email === u.email).length;
          return `<tr><td>${esc(u.name)}</td><td class="mono small">${esc(u.email)}</td><td>${u.email === me.email ? ROLE[u.role] : `<select data-role="${esc(u.email)}" style="width:auto;padding:3px 6px">${["ta", "lecturer", "admin"].map(r => `<option value="${r}" ${u.role === r ? "selected" : ""}>${ROLE[r]}</option>`).join("")}</select>`}</td><td class="small">${o ? o + " مادة" : ""}${o && t ? " · " : ""}${t ? "معيد في " + t : ""}${!o && !t ? `<span class="muted">—</span>` : ""}</td>
          <td>${u.status === "active" ? `<span class="chip ok">مفعّل</span>` : u.status === "invited" ? `<span class="chip warn">لم يدخل بعد</span>` : `<span class="chip bad">موقوف</span>`}</td>
          <td>${u.email === me.email ? `<span class="small muted">أنت</span>` : `<button class="btn sm ghost ${u.status === "suspended" ? "" : "danger"}" data-sus="${esc(u.email)}" data-to="${u.status === "suspended" ? "active" : "suspended"}">${u.status === "suspended" ? "تفعيل" : "إيقاف"}</button>`}</td></tr>`; }).join("")}
        </tbody></table></div>
        <h3>إضافة محاضر أو معيد</h3>
        <div class="settings">
          <label class="f"><span>الاسم</span><input type="text" id="invName"></label>
          <label class="f"><span>البريد الجامعي</span><input type="email" id="invEmail" dir="ltr" placeholder="name@${esc(settings.domain || "university.edu.eg")}"></label>
          <label class="f"><span>الدور</span><select id="invRole"><option value="lecturer">محاضر</option><option value="ta">معيد</option><option value="admin">مسؤول</option></select></label>
          <button class="btn primary" id="invBtn">أضف</button>
        </div>
        <p class="muted small">بعد إضافته، أرسل إليه رابط صفحة المحاضرين. يُفعَّل حسابه بمجرد دخوله ببريده والرمز الذي سيصله. ولا يستطيع صاحب الحساب الموقوف الدخول، وتبقى مواده وكشوفه محفوظة.</p>
        <label class="row small" style="gap:8px"><input type="checkbox" id="taCreate" ${settings.ta_can_create ? "checked" : ""}> يمكن للمعيدين إنشاء مواد بأنفسهم (يصبح المعيد الذي ينشئ مادة صاحبَها، فيضيف طلبتها وفريقها ويدير كل شيء فيها)</label>
        <p class="muted small">يُطبَّق تغيير الدور من الجدول فورًا: يستطيع المحاضر إنشاء مواد، ولا يستطيع المعيد ذلك إلا إذا فعّلت هذا الخيار، ويطّلع المسؤول على جميع المواد ويدير الحسابات. أما صلاحيات الشخص داخل أي مادة فتحدّدها عضويته في فريق تلك المادة.</p>
        <div class="settings"><label class="f"><span>نطاق البريد الجامعي (فارغ = أي نطاق)</span><input type="text" id="domIn" dir="ltr" value="${esc(settings.domain || "")}"></label><button class="btn" id="domSave">حفظ النطاق</button></div>
      </section>
      <section class="panel" data-apane="report" ${atab === "report" ? "" : "hidden"}>
        <div class="panel-h"><div><div class="eyebrow">كل مواد القسم · ${fYear === "all" ? "كل الأعوام" : esc(fYear)} · ${fTerm === "all" ? "كل الفصول الدراسية" : TERMS[fTerm]}</div><h2>طلبة لديهم إنذار ثالث أو انسحاب</h2></div><button class="btn sm" id="repBtn">${report === "loading" ? `<span class="spinner"></span>` : report ? "تحديث" : "إعداد التقرير"}</button></div>
        ${Array.isArray(report) ? (report.length ? `<div class="tbl-wrap"><table><thead><tr><th>الطالب</th><th>المادة</th><th>المحاضر</th><th class="c">الغياب</th><th>الحالة</th></tr></thead><tbody>
          ${report.map(x => `<tr><td>${esc(x.e.name)}<div class="mono muted small">${esc(x.e.student_code)}</div></td><td>${esc(x.c.name)}<div class="muted small">${esc(clsLabel(x.c))}</div></td><td>${esc(staffName(x.c.owner_email))}</td><td class="c mono">${x.ab}</td><td>${CM.warnChip(x.ab)}</td></tr>`).join("")}
          </tbody></table></div>` : `<div class="empty">لا يوجد طلبة لديهم إنذار ثالث أو انسحاب.</div>`) : `<p class="muted small">يشمل التقرير جميع المواد، لذا يُحسب عند الطلب.</p>`}
      </section>
      <section class="panel" data-apane="log" ${atab === "log" ? "" : "hidden"}><div class="panel-h"><div><div class="eyebrow">آخر التعديلات في كل المواد</div><h2>سجل التعديلات</h2></div></div>${auditList(au.data || [], true)}</section>`;
    document.body.classList.add("has-ctabs");
    el.querySelectorAll("[data-at]").forEach(b => b.onclick = () => { atab = b.dataset.at; store.set("cm_atab", atab); el.querySelectorAll("[data-at]").forEach(x => x.setAttribute("aria-selected", x.dataset.at === atab)); el.querySelectorAll("[data-apane]").forEach(p => p.hidden = p.dataset.apane !== atab); });
    el.querySelectorAll("[data-sus]").forEach(b => b.onclick = () => act(async () => { await rpc("admin_set_status", { p_email: b.dataset.sus, p_status: b.dataset.to }); say("admin", (b.dataset.to === "suspended" ? "أُوقف حساب " : "فُعِّل حساب ") + staffName(b.dataset.sus) + "."); }, async () => { await loadBase(); renderAdmin(); }));
    $("#invBtn").onclick = () => act(async () => {
      const n = $("#invName").value.trim(), e = $("#invEmail").value.trim().toLowerCase(), r = $("#invRole").value;
      await rpc("admin_save_staff", { p_email: e, p_name: n, p_role: r });
      say("admin", "أُضيف " + n + ". أرسل إليه رابط صفحة المحاضرين: " + location.href.split("#")[0]);
    }, async () => { await loadBase(); renderAdmin(); });
    el.querySelectorAll("[data-role]").forEach(sel => sel.onchange = () => act(async () => { await rpc("admin_set_role", { p_email: sel.dataset.role, p_role: sel.value }); say("admin", "تغيّر دور " + staffName(sel.dataset.role) + " لـ" + ROLE[sel.value] + "."); }, async () => { await loadBase(); renderAdmin(); }));
    $("#taCreate").onchange = ev => act(async () => { await rpc("admin_set_ta_create", { p_on: ev.target.checked }); say("admin", ev.target.checked ? "أصبح بإمكان المعيدين إنشاء مواد." : "لن يتمكن المعيدون من إنشاء مواد."); }, async () => { await loadBase(); render(); });
    $("#domSave").onclick = () => act(async () => { await rpc("admin_set_domain", { p_domain: $("#domIn").value }); say("admin", "حُفظ النطاق."); }, async () => { await loadBase(); renderAdmin(); });
    $("#repBtn").onclick = async () => {
      report = "loading"; renderAdmin();
      try {
        const [en, se, at] = await Promise.all([
          CM.fetchAll(() => sb.from("enrollments").select("course_id,student_code,name,grp").order("course_id")),
          CM.fetchAll(() => sb.from("sessions").select("id,course_id,grp,ended").order("id")),
          CM.fetchAll(() => sb.from("attendance").select("session_id,student_code,status").neq("status", "pending").order("session_id"))
        ]);
        const att = new Set(at.map(a => a.session_id + "|" + a.student_code));
        const out = [];
        courses.filter(c => !c.archived && inFilter(c)).forEach(c => {
          const ss = se.filter(s => s.course_id === c.id);
          en.filter(e => e.course_id === c.id).forEach(e => {
            const own = s => !s.grp || s.grp === e.grp;
            const missed = ss.filter(s => s.ended && own(s) && !att.has(s.id + "|" + e.student_code)).length;
            const made = ss.filter(s => !own(s) && att.has(s.id + "|" + e.student_code)).length;
            const ab = Math.max(0, missed - made); if (ab >= 3) out.push({ c, e, ab });
          });
        });
        report = out.sort((a, b) => b.ab - a.ab);
      } catch (e) { report = null; showErr(e); }
      renderAdmin();
    };
  }

  /* ======================= start ======================= */
  sb.auth.onAuthStateChange((ev) => {
    if (ev === "SIGNED_OUT" && me) { me = null; renderLogin(); }
    if (ev === "SIGNED_IN" && !me && login.step === "code" && !login.busy) { login = { step: "email", email: "", err: "", busy: false }; afterLogin(); } // opened the email link in another tab
  });
  sb.auth.getSession().then(({ data }) => { if (data.session) afterLogin(); else renderLogin(); });
})();
</script>
