<body>
<div class="wrap narrow" id="app"><div class="hd-loader" role="status" aria-live="polite"><div class="hd-lmark"><svg viewBox="0 0 200 200" aria-hidden="true"><g transform="translate(-14 -6)"><path class="l1" pathLength="1" d="M92 172V130L76 34" fill="none" stroke="currentColor" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path class="l2" pathLength="1" d="M92 128Q92 98 121 98Q150 98 150 128V172" fill="none" stroke="currentColor" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><circle class="ld" cx="122" cy="60" r="17"/></g></svg></div><span class="hd-ltext">جارٍ التحميل…</span></div></div>
<div class="qrov" id="qrOv" hidden><div class="in" id="qrIn"></div></div>
<div class="stscan" id="stScan" hidden><video id="stVid" playsinline muted autoplay></video><div class="frame"><i></i></div><div class="foot"><b id="stMsg">وجّه الكاميرا نحو رمز QR على الشاشة</b><button class="btn" id="stClose">إغلاق الكاميرا</button></div></div>
<div class="sheet-ov" id="tkOv" hidden><div class="sheet" id="tkIn" role="dialog" aria-modal="true" aria-labelledby="tkTitle"></div></div>

<script src="vendor/qrcode.js"></script>

<script src="common.js"></script>
<script src="drive.js"></script>
<script src="catalog.js"></script>
<script src="regform.js"></script>
<script>
(function () {
  const { $, esc, rpc, errText, store } = CM;
  const app = $("#app");
  if (!CM.configured) { app.innerHTML = CM.setupNotice(); return; }

  // device id: generated once on this phone and kept in the browser
  // نحفظه في التخزين المحلي وفي ملف تعريف (cookie) معًا، فلو مُسح أحدهما نسترجعه من الآخر
  const ck = { get: k => { const m = document.cookie.match(new RegExp("(?:^|; )" + k + "=([^;]*)")); return m ? decodeURIComponent(m[1]) : null; },
    set: (k, v) => { try { document.cookie = k + "=" + encodeURIComponent(v) + "; max-age=34560000; path=/; SameSite=Lax; Secure"; } catch (e) {} } };
  let device = store.get("cm_device") || ck.get("cm_device");
  if (!device) device = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2));
  store.set("cm_device", device); ck.set("cm_device", device);
  if (store.get("cm_device") !== device && ck.get("cm_device") !== device) device = ""; // storage blocked (private mode)

  // اسم المتصفح والهاتف، ليعرف الطالب من أين يدخل لو ظهر له أن الحساب مرتبط بهاتف آخر
  const UA = navigator.userAgent || "";
  const inApp = /FBAN|FBAV|FB_IAB|Messenger|Instagram|WhatsApp|Snapchat|TikTok|musical_ly|Line\/|Telegram|; wv\)/i.test(UA)
    ? (/Messenger/i.test(UA) ? "ماسنجر" : /FBAN|FBAV|FB_IAB/i.test(UA) ? "فيسبوك" : /Instagram/i.test(UA) ? "إنستجرام" : /WhatsApp/i.test(UA) ? "واتساب" : /Telegram/i.test(UA) ? "تيليجرام" : /TikTok|musical_ly/i.test(UA) ? "تيك توك" : "تطبيق آخر") : "";
  const standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  const devLabel = (() => {
    const os = /iPhone/.test(UA) ? "iPhone" : /iPad/.test(UA) ? "iPad" : /Android/.test(UA) ? "Android" : /Windows/.test(UA) ? "Windows" : /Mac OS X/.test(UA) ? "Mac" : "";
    const br = inApp ? "داخل " + inApp : standalone ? "أيقونة الشاشة الرئيسية" : /SamsungBrowser/.test(UA) ? "Samsung Internet" : /EdgA?\//.test(UA) ? "Edge"
      : /OPR\/|Opera/.test(UA) ? "Opera" : /Firefox|FxiOS/.test(UA) ? "Firefox" : /CriOS/.test(UA) ? "Chrome" : /Chrome\//.test(UA) ? "Chrome" : /Safari/.test(UA) ? "Safari" : "متصفح";
    return os ? br + " · " + os : br;
  })();
  const inAppWarn = () => inApp ? `<div class="msg warn">أنت تفتح الموقع من داخل ${esc(inApp)}. افتحه من متصفح الهاتف نفسه (${/iPhone|iPad/.test(UA) ? "Safari" : "Chrome"}): اضغط النقاط الثلاث ثم «فتح في المتصفح»، وادخل دائمًا من المتصفح نفسه؛ لأن الحساب يرتبط بالمتصفح الذي أنشأته منه.</div>` : "";

  /* ---------- آيفون: Safari يمسح بيانات المواقع بعد أيام دون استخدام ---------- */
  const isIOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  const iosTip = () => isIOS && !standalone && !inApp ? `<div class="msg warn small ios-tip"><b>على آيفون:</b> قد يمسح Safari بيانات الموقع إذا لم تفتحه بضعة أيام، فيظهر لك أن الحساب «مرتبط بهاتف آخر». لتجنّب ذلك أضف الموقع إلى الشاشة الرئيسية: اضغط زر المشاركة <b>⬆︎</b> ثم «إضافة إلى الشاشة الرئيسية»، وافتحه دائمًا من الأيقونة.${pk.ok ? " وفعّل «الدخول ببصمة الوجه» لتعود إلى حسابك بلمسة في أي وقت." : ""}</div>` : "";

  /* ---------- الدخول ببصمة الوجه أو الإصبع (مفتاح مرور) ---------- */
  const b64u = { dec: s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); },
    enc: b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") };
  const pk = { ok: !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext), count: null };
  async function pkCall(body) {
    const cfg = window.CLASSMATE || {};
    let r; try { r = await fetch(cfg.SUPABASE_URL.replace(/\/$/, "") + "/functions/v1/passkey", { method: "POST", headers: { "Content-Type": "application/json", apikey: cfg.SUPABASE_ANON_KEY, Authorization: "Bearer " + cfg.SUPABASE_ANON_KEY }, body: JSON.stringify(body) }); }
    catch (e) { throw { message: "Failed to fetch" }; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.error) throw { message: j.error || "passkey_failed" };
    return j;
  }
  const pkErr = e => e && (e.name === "NotAllowedError" || e.name === "AbortError") ? "لم يكتمل الدخول بالبصمة: أُلغيت العملية، أو لم تفعّل البصمة لحسابك من قبل (فعّلها من صفحتك بعد الدخول بكلمة السر)." : e && e.name === "InvalidStateError" ? "البصمة مفعّلة لهذا الحساب على هذا الهاتف من قبل." : errText(e);
  async function pkRegister() {
    const ch = await rpc("passkey_begin", { p_token: token });
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: b64u.dec(ch.challenge), rp: { id: location.hostname, name: "Hadro" },
      user: { id: new TextEncoder().encode(ch.code), name: ch.code, displayName: ch.name + " · " + ch.code },
      pubKeyCredParams: [{ type: "public-key", alg: -7 }], timeout: 90000, attestation: "none",
      authenticatorSelection: { residentKey: "required", requireResidentKey: true, userVerification: "required" },
      excludeCredentials: (ch.exclude || []).map(id => ({ type: "public-key", id: b64u.dec(id) })) } });
    await pkCall({ action: "register", challenge_id: ch.id, id: cred.id, clientDataJSON: b64u.enc(cred.response.clientDataJSON), attestationObject: b64u.enc(cred.response.attestationObject), label: devLabel });
    pk.count = (pk.count || 0) + 1;
  }
  async function pkLogin() {
    const ch = await rpc("passkey_begin", {});
    const a = await navigator.credentials.get({ publicKey: { challenge: b64u.dec(ch.challenge), rpId: location.hostname, userVerification: "required", timeout: 90000 } });
    const r = await pkCall({ action: "login", challenge_id: ch.id, id: a.id, clientDataJSON: b64u.enc(a.response.clientDataJSON), authenticatorData: b64u.enc(a.response.authenticatorData), signature: b64u.enc(a.response.signature), device, label: devLabel });
    token = r.token; store.set("cm_token", token); setLim(false); if (r.code) store.set("cm_last_code", r.code);
  }
  async function pkLoginUI() {
    if (busy) return; busy = true; authMsg = ""; move ? renderMove() : renderAuth();
    try { await pkLogin(); busy = false; move = null; await loadHome(); }
    catch (e) { busy = false; authMsg = pkErr(e); move ? renderMove() : renderAuth(); }
  }
  const pkBtn = id => pk.ok ? `<button class="btn block pk-btn" id="${id}" ${busy ? "disabled" : ""}><span aria-hidden="true">◉</span> الدخول ببصمة الوجه أو الإصبع</button>` : "";

  let token = store.get("cm_token");
  let pkMsg = "";
  let rf = null;   // التسجيل باستمارة التسجيل: {mode: "reg"|"sync", stage, data, items, pct, note, result}
  let move = null; // {code, pass, info} عند ظهور «مرتبط بهاتف آخر»
  // جلسة «تسليم التكليفات فقط» من جهاز غير الهاتف المرتبط (لا حضور ولا بطاقة حضور ولا بصمة)
  let limited = store.get("cm_limited") ? JSON.parse(store.get("cm_limited")) : null;
  function setLim(v) { limited = v || null; if (v) store.set("cm_limited", JSON.stringify(v)); else store.del("cm_limited"); }
  let home = null, authTab = "login", authMsg = "", busy = false, results = {}, drafts = {}, pwOpen = false, pwMsg = "";

  function header(extra) {
    return `<header class="top"><div class="brand">${CM.markHtml()}<div><h1 class="wm">hadro</h1><p class="muted small">${esc((window.CLASSMATE || {}).UNIVERSITY_NAME || "")}</p></div></div><div class="row">${CM.themeBtn()}${extra || ""}</div></header>`;
  }

  /* ---------------- sign in / first time ---------------- */
  /* ---------------- التسجيل باستمارة التسجيل (ابن الهيثم) ---------------- */
  const LVN = ["", "الأول", "الثاني", "الثالث", "الرابع", "الخامس"];
  const RFST = { added: ["ok", "أُضفت إليها"], created: ["ok", "أُضفت إليها (مادة جديدة على التطبيق، وسيعيّن المسؤول فريقها)"], already: ["", "مسجَّل فيها من قبل"],
    blocked: ["bad", "أزالك المحاضر من هذه المادة من قبل، فراجِعه"], unknown: ["bad", "لم تُعرف في لائحة القسم، فاطلب من المحاضر إضافتك"] };
  function openForm(mode) { rf = { mode, stage: "pick", pct: 0, note: "", msg: "" }; renderForm(); }
  function closeForm() { const m = rf && rf.mode; rf = null; if (m === "sync" || token) loadHome(); else renderAuth(); }
  async function readForm(file) {
    rf.stage = "reading"; rf.pct = 0; rf.msg = ""; renderForm();
    try {
      const text = await HR.read(file, (p, t) => { if (!rf) return; rf.pct = p; rf.note = t; const b = $("#rfBar"), n = $("#rfNote"); if (b) b.style.width = Math.round(p * 100) + "%"; if (n) n.textContent = t; });
      if (!rf) return;
      const d = HR.parse(text);
      if (!d.code && !d.items.length) { rf.stage = "pick"; rf.msg = "لم أستطع قراءة الاستمارة. ارفع ملف PDF الذي نزّلته من نظام ابن الهيثم، أو صورة واضحة للاستمارة كاملة."; return renderForm(); }
      if (rf.mode === "sync" && home && home.code) d.code = d.code || home.code;
      rf.data = d; rf.items = HR.match(d.items, d.level).map(x => ({ ...x, on: x.bid != null })); rf.stage = "review"; renderForm();
    } catch (e) { if (!rf) return; rf.stage = "pick"; rf.msg = /load_failed/.test(e.message || "") ? "تعذّر تحميل أداة القراءة. تأكّد من اتصالك بالإنترنت وحاول مرة أخرى." : "تعذّرت قراءة الملف. جرّب ملف PDF أو صورة أوضح."; renderForm(); }
  }
  function renderForm() {
    const d = rf.data || {}, reg = rf.mode === "reg";
    let body = "";
    if (rf.stage === "pick") body = `
      <p>نزّل «استمارة التسجيل» من نظام ابن الهيثم لشئون الطلاب (ملف PDF أو صورة لها)، ثم اخترها هنا. يقرأ التطبيق منها كودك واسمك ومستواك والمقررات المسجلة، ويضيفك إلى موادها.</p>
      <p class="small muted">تُقرأ الاستمارة على هاتفك فقط ولا تُرفع إلى أي مكان. ويظهر للمحاضر أنك سجّلت بالاستمارة ليراجعها.</p>
      ${rf.msg ? `<div class="msg bad">${esc(rf.msg)}</div>` : ""}
      <label class="btn primary block rf-pick">اختر الاستمارة (PDF أو صورة)<input type="file" id="rfFile" accept="application/pdf,.pdf,image/*" hidden></label>`;
    else if (rf.stage === "reading") body = `<p>جارٍ قراءة الاستمارة… قد يستغرق ذلك دقيقة في أول مرة.</p>
      <div class="qbar"><i id="rfBar" style="width:${Math.round(rf.pct * 100)}%"></i></div><p class="small muted" id="rfNote">${esc(rf.note || "")}</p>`;
    else if (rf.stage === "review") {
      const n = rf.items.filter(x => x.on).length;
      body = `<p class="small muted">راجِع البيانات وصحّح أي خطأ في القراءة. يجب أن تطابق استمارتك.</p>
        <div class="settings">
          <label class="f"><span>كود الطالب</span><input type="text" id="rfCode" inputmode="numeric" class="mono" style="text-align:start" value="${esc(d.code || "")}" ${!reg ? "readonly" : ""}></label>
          <label class="f"><span>المستوى</span><select id="rfLevel">${[1, 2, 3, 4, 5].map(l => `<option value="${l}" ${d.level === l ? "selected" : ""}>${LVN[l]}</option>`).join("")}</select></label>
          <label class="f" style="grid-column:1/-1"><span>الاسم كما في الاستمارة</span><input type="text" id="rfName" value="${esc(d.name || "")}"></label>
        </div>
        <h3 style="margin-top:6px">المقررات (${n})</h3>
        <div class="rf-list">${rf.items.map((x, i) => `<label class="rf-it ${x.bid == null ? "off" : ""}"><input type="checkbox" data-rfi="${i}" ${x.on ? "checked" : ""} ${x.bid == null ? "disabled" : ""}>
          <span><b>${esc(x.cat ? x.cat.n.replace(/\*$/, "") : x.name)}</b><small class="muted mono">${esc((x.prefix ? x.prefix + " " : "") + x.code)}</small>${x.bid == null ? `<small class="bad-t">ليس في لائحة القسم؛ اطلب من المحاضر إضافتك</small>` : ""}</span></label>`).join("")}</div>
        ${reg ? `<label class="f"><span>كلمة سر لحسابك (6 أحرف على الأقل)</span><input type="password" id="rfPass" autocomplete="new-password"></label>
          <label class="f"><span>أعد كتابة كلمة السر</span><input type="password" id="rfPass2" autocomplete="new-password"></label>
          <label class="f"><span>رمز التفعيل (إن أعطاكم المحاضر رمزًا)</span><input type="text" id="rfPin" inputmode="numeric" class="mono" style="text-align:start"></label>
          <p class="small muted">سيرتبط الحساب بهذا الهاتف وهذا المتصفح.</p>` : ""}
        ${rf.msg ? `<div class="msg bad">${esc(rf.msg)}</div>` : ""}
        <button class="btn primary block" id="rfGo" ${busy || !n ? "disabled" : ""}>${busy ? `<span class="spinner"></span>` : reg ? "إنشاء الحساب والتسجيل في المواد" : "إضافتي إلى هذه المواد"}</button>
        <button class="btn block" id="rfAgain">اختيار ملف آخر</button>`;
    } else if (rf.stage === "done") {
      const r = rf.result || {}, its = r.items || [];
      body = `<div class="msg ${its.some(x => x.status === "added" || x.status === "created") ? "ok" : "warn"}">${its.filter(x => x.status === "added" || x.status === "created").length ? "تمت إضافتك إلى موادك." : "لم تُضف إلى مواد جديدة."}</div>
        <div class="rf-list">${its.map(x => { const st = RFST[x.status] || ["", x.status]; return `<div class="rf-it"><span><b>${esc(x.name || "")}</b><small class="muted mono">${esc(x.code || "")}</small><small class="${st[0] === "bad" ? "bad-t" : st[0] === "ok" ? "ok-t" : "muted"}">${esc(st[1])}</small></span></div>`; }).join("")}</div>
        <button class="btn primary block" id="rfDone">متابعة</button>`;
    }
    app.innerHTML = header() + `<section class="panel col"><h2>${rf.mode === "reg" ? "التسجيل باستمارة التسجيل" : "إضافة موادي من استمارة التسجيل"}</h2>${body}
      ${rf.stage !== "done" && rf.stage !== "reading" ? `<button class="btn ghost block" id="rfBack">رجوع</button>` : ""}</section>`;
    const fi = $("#rfFile"); if (fi) fi.onchange = () => { const f = fi.files && fi.files[0]; if (f) readForm(f); };
    const bk = $("#rfBack"); if (bk) bk.onclick = closeForm;
    const ag = $("#rfAgain"); if (ag) ag.onclick = () => { rf.stage = "pick"; rf.msg = ""; renderForm(); };
    const dn = $("#rfDone"); if (dn) dn.onclick = () => { rf = null; loadHome(); };
    app.querySelectorAll("[data-rfi]").forEach(c => c.onchange = () => { rf.items[+c.dataset.rfi].on = c.checked; const keep = { code: $("#rfCode").value, name: $("#rfName").value, level: +$("#rfLevel").value }; Object.assign(rf.data, keep); renderForm(); });
    const go = $("#rfGo"); if (go) go.onclick = submitForm;
  }
  async function submitForm() {
    if (busy) return;
    const code = $("#rfCode").value.replace(/\D/g, ""), name = $("#rfName").value.trim(), level = +$("#rfLevel").value;
    Object.assign(rf.data, { code, name, level });
    const items = rf.items.filter(x => x.on).map(x => ({ code: x.code, prefix: x.prefix, name: x.name, bid: x.bid }));
    rf.msg = "";
    if (!/^\d{6,12}$/.test(code)) { rf.msg = "اكتب كود الطالب كما في الاستمارة."; return renderForm(); }
    if (name.length < 3) { rf.msg = "اكتب اسمك كما في الاستمارة."; return renderForm(); }
    let pass = "", pin = "";
    if (rf.mode === "reg") {
      pass = $("#rfPass").value; pin = $("#rfPin").value.trim();
      if (pass.length < 6) { rf.msg = "يجب ألا تقل كلمة السر عن 6 أحرف."; return renderForm(); }
      if (pass !== $("#rfPass2").value) { rf.msg = "كلمتا السر غير متطابقتين."; return renderForm(); }
      if (!device) { rf.msg = "هذا المتصفح لا يحفظ البيانات. افتح الموقع في متصفح عادي."; return renderForm(); }
    }
    busy = true; renderForm();
    try {
      if (rf.mode === "reg") {
        const r = await rpc("student_form_register", { p_code: code, p_name: name, p_level: level, p_items: items, p_password: pass, p_pin: pin, p_device: device, p_label: devLabel });
        token = r.token; store.set("cm_token", token); setLim(false); store.set("cm_last_code", code);
        rf.result = r.enroll;
      } else rf.result = await rpc("student_form_sync", { p_token: token, p_code: code, p_name: name, p_level: level, p_items: items });
      busy = false; rf.stage = "done"; renderForm();
    } catch (e) {
      busy = false;
      const m = String(e.message || "");
      rf.msg = m.includes("already_registered") ? "لك حساب بالفعل بهذا الكود. ادخل بكودك وكلمة السر، ثم استخدم «إضافة موادي من الاستمارة» من صفحتك."
        : m.includes("no_course_matched") ? "لم نتعرّف على أي مقرر من مقررات الاستمارة في لائحة القسم. تواصل مع المحاضر."
        : m.includes("code_mismatch") ? "الكود في الاستمارة لا يطابق كود حسابك."
        : m.includes("too_many_tries") ? "حاولت مرات كثيرة اليوم. حاول غدًا أو تواصل مع المحاضر." : errText(e);
      renderForm();
    }
  }

  function renderMove() {
    const i = move.info || {}, when = d => d ? CM.fmtD(d) : "";
    const can = !i.next_at;
    app.innerHTML = header() + `<section class="panel col">
      <h2>الحساب مرتبط بمتصفح آخر</h2>
      <p>حسابك مرتبط الآن بـ <b>${esc(i.label || "هاتف آخر")}</b>${i.bound_at ? ` منذ ${esc(when(i.bound_at))}` : ""}، وأنت تفتح الآن من <b>${esc(devLabel)}</b>.</p>
      ${inAppWarn()}
      <div class="msg"><b>إذا كان هذا هاتفك نفسه:</b> فغالبًا فتحت الموقع من متصفح مختلف (مثل فتحه من رابط في واتساب أو من كاميرا الهاتف). ارجع وافتحه من ${esc(i.label || "المتصفح الذي أنشأت منه الحساب")} وسيعمل مباشرة.</div>
      <div class="msg"><b>إذا غيّرت هاتفك أو مسحت بيانات المتصفح:</b> انقل حسابك إلى هنا بنفسك. سيتوقف الحساب على المتصفح القديم، ويظهر النقل للمحاضر، ويحتاج حضورك خلال 12 ساعة بعد النقل إلى موافقته. يمكنك النقل مرة كل 3 أيام.</div>
      ${can ? "" : `<div class="msg warn">نقلت حسابك مؤخرًا، ويمكنك نقله مرة أخرى يوم ${esc(when(i.next_at))}. وإن احتجت قبل ذلك فاطلب من المحاضر فك ربط الهاتف.</div>`}
      ${authMsg ? `<div class="msg bad">${esc(authMsg)}</div>` : ""}
      ${pk.ok ? `<div class="msg ok"><b>فعّلت الدخول ببصمة الوجه أو الإصبع من قبل؟</b> ادخل بها الآن، فينتقل حسابك إلى هنا فورًا دون انتظار ودون موافقة المحاضر.</div>${pkBtn("pkMv")}` : ""}
      ${can ? `<button class="btn primary block" id="mvGo" ${busy ? "disabled" : ""}>${busy ? `<span class="spinner"></span>` : "انقل حسابي إلى هذا المتصفح"}</button>` : ""}
      <div class="msg"><b>تريد فقط تسليم تكليف أو متابعة درجاتك من هذا الجهاز؟</b> ادخل دون نقل الحساب. يبقى حسابك مرتبطًا بهاتفك، وتسجّل حضورك منه كالمعتاد.</div>
      <button class="btn ${can ? "" : "primary "}block" id="mvWeb" ${busy ? "disabled" : ""}>ادخل لتسليم التكليفات فقط</button>
      ${iosTip()}
      <button class="btn block" id="mvBack">رجوع</button></section>`;
    const pm = $("#pkMv"); if (pm) pm.onclick = pkLoginUI;
    $("#mvWeb").onclick = async () => {
      if (busy) return; busy = true; authMsg = ""; renderMove();
      try {
        const r = await rpc("student_login_web", { p_code: move.code, p_password: move.pass, p_label: devLabel });
        if (r.error) throw { message: r.error };
        token = r.token; store.set("cm_token", token); setLim({ label: r.bound_label || (move.info || {}).label || "" }); store.set("cm_last_code", move.code); move = null; busy = false; await loadHome();
      } catch (e) { busy = false; authMsg = errText(e); renderMove(); }
    };
    $("#mvBack").onclick = () => { move = null; authMsg = ""; renderAuth(); };
    if ($("#mvGo")) $("#mvGo").onclick = async () => {
      if (busy) return; busy = true; authMsg = ""; renderMove();
      try {
        const r = await rpc("student_move_device", { p_code: move.code, p_password: move.pass, p_device: device, p_label: devLabel, p_confirm: true });
        token = r.token; store.set("cm_token", token); setLim(false); store.set("cm_last_code", move.code); move = null; busy = false; await loadHome();
      } catch (e) { busy = false; authMsg = errText(e); renderMove(); }
    };
  }

  /* ---------------- نسيت كلمة السر ---------------- */
  let rs = null;   // {stage: "form"|"wait"|"finish", msg, req: {id, secret, code, name}}
  try { const p = JSON.parse(store.get("cm_reset") || "null"); if (p && p.id) rs = { stage: "wait", msg: "", req: p }; } catch (e) {}
  let rsTimer = null;
  const rsCheck = id => String(id || "").replace(/-/g, "").slice(0, 4).toUpperCase();
  function rsVals() {
    const code = ($("#rsCode") || {}).value, p1 = ($("#rsPass") || {}).value || "", p2 = ($("#rsPass2") || {}).value || "";
    if (!code || !code.trim()) throw "اكتب كود الطالب.";
    if (p1.length < 6) throw "يجب ألا تقل كلمة السر الجديدة عن 6 أحرف.";
    if (p1 !== p2) throw "كلمتا السر غير متطابقتين.";
    return { code: code.trim(), pass: p1 };
  }
  async function rsDone(r) { token = r.token; store.set("cm_token", token); setLim(false); if (r.code) store.set("cm_last_code", r.code); store.del("cm_reset"); rs = null; clearInterval(rsTimer); busy = false; await loadHome(); }
  // من نفس المتصفح المرتبط بالحساب: لا يحتاج إلى أي تأكيد آخر
  async function rsTryDevice(v) {
    if (!device || store.get("cm_last_code") !== v.code) return false;
    try { const r = await rpc("student_reset_on_device", { p_code: v.code, p_device: device, p_new: v.pass }); await rsDone(r); return true; } catch (e) { return false; }
  }
  function renderReset() {
    const st = rs.stage, last = store.get("cm_last_code") || "";
    let body = "";
    if (st === "form") body = `
      <p>اكتب كودك وكلمة سر جديدة، ثم أكّد أنك صاحب الحساب بإحدى الطرق التالية:</p>
      <label class="f"><span>كود الطالب</span><input type="text" id="rsCode" inputmode="numeric" class="mono" style="text-align:start" value="${esc(last)}"></label>
      <label class="f"><span>كلمة السر الجديدة (6 أحرف على الأقل)</span><input type="password" id="rsPass" autocomplete="new-password"></label>
      <label class="f"><span>أعد كتابة كلمة السر الجديدة</span><input type="password" id="rsPass2" autocomplete="new-password"></label>
      ${rs.msg ? `<div class="msg bad">${esc(rs.msg)}</div>` : ""}
      ${pk.ok ? `<button class="btn primary block" id="rsPk" ${busy ? "disabled" : ""}>تأكيد ببصمة الوجه أو الإصبع</button><p class="small muted">إن كنت فعّلت الدخول بالبصمة من قبل.</p>` : ""}
      ${HD.ready ? `<button class="btn block" id="rsG" ${busy ? "disabled" : ""}>تأكيد بحساب Google الذي سلّمت منه تكليفاتك</button><p class="small muted">إن كنت سلّمت تكليفًا على Google Drive من هذا التطبيق، أو ربطت حساب Google من صفحتك.</p>` : ""}
      <button class="btn block" id="rsReq" ${busy ? "disabled" : ""}>اطلب موافقة المحاضر أو المعيد</button>
      <p class="small muted">يظهر طلبك لفريق المادة في صفحتهم، فيوافق عليه بلمسة بعد أن يتأكد منك، ثم تكمل من هاتفك.</p>`;
    else if (st === "wait") body = `
      <div class="rs-wait"><span class="small muted">رقم التحقق</span><b class="mono">${esc(rsCheck(rs.req.id))}</b><span>${esc(rs.req.name || "")} · <span class="mono">${esc(rs.req.code)}</span></span></div>
      <p>اعرض هذه الشاشة على المحاضر أو المعيد، ليوافق على طلبك من صفحة المادة عنده. وحين يوافق تنتقل هذه الصفحة وحدها لتكتب كلمة السر الجديدة.</p>
      <div class="live"><span class="dot"></span><span>في انتظار الموافقة…</span></div>
      ${rs.msg ? `<div class="msg bad">${esc(rs.msg)}</div>` : ""}`;
    else if (st === "finish") body = `
      <div class="msg ok">وافق فريق المادة على طلبك. اكتب كلمة السر الجديدة.</div>
      <input type="hidden" id="rsCode" value="${esc(rs.req.code)}">
      <label class="f"><span>كلمة السر الجديدة (6 أحرف على الأقل)</span><input type="password" id="rsPass" autocomplete="new-password"></label>
      <label class="f"><span>أعد كتابة كلمة السر الجديدة</span><input type="password" id="rsPass2" autocomplete="new-password"></label>
      ${rs.msg ? `<div class="msg bad">${esc(rs.msg)}</div>` : ""}
      <button class="btn primary block" id="rsFin" ${busy ? "disabled" : ""}>${busy ? `<span class="spinner"></span>` : "حفظ كلمة السر والدخول"}</button>`;
    app.innerHTML = header() + `<section class="panel col"><h2>استعادة كلمة السر</h2>${body}<button class="btn ghost block" id="rsBack">${st === "wait" ? "إلغاء الطلب والرجوع" : "رجوع"}</button></section>`;
    $("#rsBack").onclick = () => { if (st === "wait") store.del("cm_reset"); clearInterval(rsTimer); rs = null; busy = false; renderAuth(); };
    const run = async fn => { if (busy) return; let v; try { v = rsVals(); } catch (m) { rs.msg = m; return renderReset(); } rs.msg = ""; busy = true; renderReset();
      try { if (await rsTryDevice(v)) return; await fn(v); } catch (e) { busy = false; rs.msg = typeof e === "string" ? e : pkErr(e); renderReset(); } };
    const bp = $("#rsPk"); if (bp) bp.onclick = () => run(async v => {
      await pkLogin(); const r = await rpc("student_set_password", { p_token: token, p_device: device, p_new: v.pass }); await rsDone(r); });
    const bg = $("#rsG"); if (bg) bg.onclick = () => { const auth = HD.authorize(); run(async v => {
      const at = await auth; const r = await pkCall({ action: "google_reset", access_token: at, code: v.code, password: v.pass, device, label: devLabel }); await rsDone(r); }); };
    const bq = $("#rsReq"); if (bq) bq.onclick = () => { const code = (($("#rsCode") || {}).value || "").trim(); if (!code) { rs.msg = "اكتب كود الطالب."; return renderReset(); }
      busy = true; renderReset();
      rpc("student_reset_request", { p_code: code, p_device: device || "", p_label: devLabel }).then(r => { busy = false; rs = { stage: "wait", msg: "", req: { id: r.id, secret: r.secret, code, name: r.name } }; store.set("cm_reset", JSON.stringify(rs.req)); renderReset(); rsPoll(); })
        .catch(e => { busy = false; rs.msg = errText(e); renderReset(); }); };
    const bf = $("#rsFin"); if (bf) bf.onclick = async () => { if (busy) return; let v; try { v = rsVals(); } catch (m) { rs.msg = m; return renderReset(); }
      if (!device) { rs.msg = "هذا المتصفح لا يحفظ البيانات. افتح الموقع في متصفح عادي."; return renderReset(); }
      busy = true; renderReset();
      try { const r = await rpc("student_reset_finish", { p_id: rs.req.id, p_secret: rs.req.secret, p_new: v.pass, p_device: device, p_label: devLabel }); await rsDone(r); }
      catch (e) { busy = false; rs.msg = errText(e); renderReset(); } };
    if (st === "wait") rsPoll();
  }
  function rsPoll() {
    clearInterval(rsTimer);
    rsTimer = setInterval(async () => {
      if (!rs || rs.stage !== "wait") return clearInterval(rsTimer);
      try { const s2 = await rpc("student_reset_status", { p_id: rs.req.id, p_secret: rs.req.secret });
        if (s2 === "approved") { clearInterval(rsTimer); rs.stage = "finish"; renderReset(); }
        else if (s2 === "rejected" || s2 === "expired" || s2 === "used" || s2 == null) { clearInterval(rsTimer); store.del("cm_reset"); rs = { stage: "form", msg: s2 === "rejected" ? "رُفض طلبك. تواصل مع المحاضر." : "انتهت صلاحية الطلب. اطلب من جديد.", req: null }; renderReset(); }
      } catch (e) {}
    }, 4000);
  }

  /* ---------------- الصفحة الموحدة: اختيار نوع الدخول ---------------- */
  const ICO = {
    ug: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/><path d="M22 9v5"/></svg>`,
    pg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/><path d="M8 13h8M8 17h5"/></svg>`,
    st: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="M7 9l3 3 6-5"/></svg>`
  };
  function renderChoose() {
    closeQr && closeQr();
    app.innerHTML = header() + `
      ${CM.hero({ eyebrow: esc((window.CLASSMATE || {}).UNIVERSITY_NAME || ""), title: "أهلًا بك في Hadro", sub: "الحضور والتكليفات والدرجات والتسجيل الأكاديمي في مكان واحد. اختر طريقة الدخول." })}
      <div class="choose over">
        <button type="button" class="tile big" id="chUg">${ICO.ug}<b>طالب مرحلة البكالوريوس</b><span class="muted small">تسجيل الحضور، والتكليفات، والدرجات</span></button>
        <a class="tile big" href="pg.html" data-role="pg">${ICO.pg}<b>طالب الدراسات العليا</b><span class="muted small">الدبلوم والماجستير والدكتوراه · تسجيل المقررات</span></a>
        <a class="tile big" href="staff.html" data-role="staff">${ICO.st}<b>عضو هيئة التدريس أو معيد</b><span class="muted small">المحاضرات، والكشوف، والتكليفات</span></a>
      </div>`;
    CM.rise(app);
    $("#chUg").onclick = () => { chosen = true; authMsg = ""; try { history.pushState({ auth: 1 }, ""); } catch (e) {} renderAuth(); };
    // الانتقال بلا ترك الصفحة الموحدة في سجل الرجوع: «رجوع» من صفحة المحاضر لا يعيد إلى هنا
    app.querySelectorAll("[data-role]").forEach(a => a.onclick = ev => { ev.preventDefault(); store.set("cm_role", a.dataset.role); location.replace(a.getAttribute("href")); });
  }
  // من اختار قبل ذلك ودخوله ما زال قائمًا: إلى صفحته مباشرة
  function autoRole() {
    const r = store.get("cm_role"); let keys = [];
    try { keys = Object.keys(localStorage); } catch (e) {}
    if (r === "staff" && keys.some(k => /^sb-.*-auth-token$/.test(k))) { location.replace("staff.html"); return true; }
    if (r === "pg" && keys.includes("hadro-pg-auth")) { location.replace("pg.html"); return true; }
    return false;
  }
  let chosen = false;
  window.addEventListener("popstate", e => {
    const st = e.state || {};
    if (tkId && !st.tk) { if (up) { try { history.pushState({ tk: tkId }, ""); } catch (x) {} return; } tkId = null; $("#tkOv").hidden = true; renderHome(); return; }
    if (!token && chosen && !st.auth && !rf && !rs && !move && !busy) { chosen = false; authMsg = ""; renderChoose(); }
  });
  document.addEventListener("hadro:home", e => {
    e.preventDefault();
    if (up) return;
    if (token) { if (tkId) closeTask(); else loadHome(); }
    else { rf = null; move = null; chosen = false; renderChoose(); }
    window.scrollTo({ top: 0 });
  });

  function renderAuth() {
    if (!chosen && !rf && !rs && !move && !sstore.get("cm_pending_qr")) return renderChoose();
    if (rf) return renderForm();
    if (rs) return renderReset();
    if (move) return renderMove();
    app.innerHTML = header() + CM.hero({ small: true, eyebrow: "مرحلة البكالوريوس", title: authTab === "login" ? "دخول الطلبة" : "حساب جديد" }) + `
      <section class="panel over">
        <div class="tabs" role="group"><button id="tLogin" aria-pressed="${authTab === "login"}">دخول</button><button id="tReg" aria-pressed="${authTab === "reg"}">إنشاء حساب</button></div>
        ${authTab === "login" ? `
          <h2>الدخول بكود الطالب</h2>
          <label class="f"><span>كود الطالب</span><input type="text" id="code" inputmode="numeric" autocomplete="username" class="mono" style="text-align:start" value="${esc(store.get("cm_last_code") || "")}"></label>
          <label class="f"><span>كلمة السر</span><input type="password" id="pass" autocomplete="current-password"></label>
        ` : `
          <h2>أنشئ حسابك</h2>
          <p class="muted small">سيرتبط الحساب بهذا الهاتف، ولن تتمكن من تسجيل الحضور من هاتف آخر. لا تستخدم وضع التصفح الخفي.</p>
          <label class="f"><span>كود الطالب</span><input type="text" id="code" inputmode="numeric" autocomplete="username" class="mono" style="text-align:start"></label>
          <label class="f"><span>كلمة السر (6 أحرف على الأقل)</span><input type="password" id="pass" autocomplete="new-password"></label>
          <label class="f"><span>أعد كتابة كلمة السر</span><input type="password" id="pass2" autocomplete="new-password"></label>
          <label class="f"><span>رمز التفعيل (إن أعطاكم المحاضر رمزًا، مثل آخر 4 أرقام من الرقم القومي)</span><input type="text" id="pin" inputmode="numeric" class="mono" style="text-align:start"></label>
        `}
        ${authTab === "reg" ? `<div class="msg"><b>اسمك غير موجود في كشوف المحاضرين؟</b> سجّل باستمارة التسجيل التي نزّلتها من نظام ابن الهيثم، فتُضاف تلقائيًّا إلى موادك.<div style="margin-top:8px"><button class="btn sm" id="rfOpen">التسجيل باستمارة التسجيل</button></div></div>` : ""}
        ${sstore.get("cm_pending_qr") ? `<div class="msg">سجّل الدخول أولًا، وبعدها يُسجَّل حضورك بالرمز الذي مسحته. وإن انتهت صلاحيته فامسحه من الشاشة مرة أخرى.</div>` : ""}
        ${inAppWarn()}
        ${authMsg ? `<div class="msg bad">${esc(authMsg)}</div>` : ""}
        ${!device ? `<div class="msg warn">هذا المتصفح لا يحفظ البيانات (غالبًا بسبب وضع التصفح الخفي). افتح الموقع في متصفح عادي.</div>` : ""}
        <button class="btn primary block" id="go" ${busy || !device ? "disabled" : ""}>${busy ? `<span class="spinner"></span>` : authTab === "login" ? "دخول" : "إنشاء الحساب"}</button>
        ${authTab === "login" && device ? pkBtn("pkIn") : ""}
        ${iosTip()}
      </section>
      <p class="small" style="margin-top:14px;text-align:center"><button type="button" class="linkish" id="chBack">→ صفحة الدخول الرئيسية</button></p>
      <p class="muted small" style="margin-top:6px;text-align:center">غيّرت هاتفك؟ ادخل بكودك وكلمة السر، وسيظهر لك زر لنقل الحساب. <button type="button" class="linkish" id="rsOpen">نسيت كلمة السر؟</button></p>
      <p class="small" style="text-align:center;margin-top:10px"><button type="button" class="linkish" id="helpOut">عندك مشكلة؟ اسأل مساعد Hadro</button></p>`;
    $("#chBack").onclick = () => { chosen = false; authMsg = ""; renderChoose(); };
    $("#tLogin").onclick = () => { authTab = "login"; authMsg = ""; renderAuth(); };
    $("#tReg").onclick = () => { authTab = "reg"; authMsg = ""; renderAuth(); };
    $("#go").onclick = submitAuth;
    const ro = $("#rfOpen"); if (ro) ro.onclick = () => openForm("reg");
    const pi = $("#pkIn"); if (pi) pi.onclick = pkLoginUI;
    const ho = $("#helpOut"); if (ho) ho.onclick = () => openHelp("ask");
    const ro2 = $("#rsOpen"); if (ro2) ro2.onclick = () => { if (HD.ready) HD.loadGis().catch(() => {}); authMsg = ""; rs = { stage: "form", msg: "", req: null }; renderReset(); };
    app.querySelectorAll("input").forEach(i => i.onkeydown = e => { if (e.key === "Enter") submitAuth(); });
  }

  async function submitAuth() {
    if (busy) return;
    // read every field before re-rendering (re-render clears the inputs)
    const code = $("#code").value.trim(), pass = $("#pass").value, pass2 = $("#pass2") ? $("#pass2").value : "", pin = $("#pin") ? $("#pin").value.trim() : "";
    authMsg = "";
    if (!code || !pass) { authMsg = "اكتب كود الطالب وكلمة السر."; return renderAuth(); }
    if (authTab === "reg") {
      if (pass.length < 6) { authMsg = "يجب ألا تقل كلمة السر عن 6 أحرف."; return renderAuth(); }
      if (pass !== pass2) { authMsg = "كلمتا السر غير متطابقتين."; return renderAuth(); }
    }
    busy = true; renderAuth();
    try {
      const r = authTab === "login"
        ? await rpc("student_login", { p_code: code, p_password: pass, p_device: device, p_label: devLabel })
        : await rpc("student_register", { p_code: code, p_password: pass, p_pin: pin, p_device: device, p_label: devLabel });
      token = r.token; store.set("cm_token", token); setLim(false); store.set("cm_last_code", code);
      busy = false; await loadHome();
    } catch (e) {
      if (authTab === "login" && String(e.message || "").includes("device_mismatch")) {
        // كلمة السر صحيحة لكن الحساب على متصفح آخر: نعرض للطالب أين، ونتيح له النقل
        try { const info = await rpc("student_move_device", { p_code: code, p_password: pass, p_device: device, p_label: devLabel, p_confirm: false });
          if (info.token) { token = info.token; store.set("cm_token", token); setLim(false); busy = false; return loadHome(); }
          move = { code, pass, info }; busy = false; authMsg = ""; return renderMove();
        } catch (e2) { busy = false; authMsg = errText(e2); return renderAuth(); }
      }
      busy = false; authMsg = errText(e); renderAuth();
    }
  }

  /* ---------------- home ---------------- */
  async function loadHome(silent) {
    if (!silent && !home && !rf) CM.loader(app, "جارٍ تجهيز صفحتك…");
    try {
      home = await rpc("student_home", { p_token: token });
      if (!limited && pk.ok && pk.count == null) rpc("student_passkey_count", { p_token: token }).then(n => { pk.count = Number(n) || 0; if (home && !rf && !tkId) renderHome(); }).catch(() => {});
      const q = qrGet();
      if (limited) {} else if (!silent || !q || q.code !== home.code) await refreshQrKey();
      else if (home.now_ms) { q.off = Number(home.now_ms) - Date.now(); store.set("cm_qr", JSON.stringify(q)); }
      renderHome();
      loadTasks(!silent);
      if (sstore.get("cm_pending_qr")) takePendingQr();
      if (store.get("cm_gdrive")) takePendingDrive();
    } catch (e) {
      const m = String(e.message || "");
      if (m.includes("not_signed_in")) { signOut(); return; }
      if (m.includes("device_mismatch")) { signOut(); authMsg = errText(e); renderAuth(); return; }
      if (silent && home) return;
      const net = /Failed to fetch|NetworkError|network|Load failed|aborted/i.test(m);
      if (net) { clearTimeout(netRetry); netRetry = setTimeout(() => loadHome(), 5000); }
      app.innerHTML = header() + `<section class="col">
        <div class="msg ${net ? "warn" : "bad"}">${net ? "تعذّر الاتصال بالخادم الآن. سنحاول مرة أخرى تلقائيًّا خلال ثوانٍ… وإن تكرر ذلك فجرّب شبكة أخرى (واي فاي أو بيانات الهاتف)." : esc(errText(e))}</div>
        ${qrCta()}
        <p><button class="btn" id="retry">أعد المحاولة</button></p></section>`;
      $("#retry").onclick = () => loadHome();
      wireQrCta();
    }
  }

  /* ---------------- personal QR: works with no internet ---------------- */
  const qrGet = () => { try { return JSON.parse(store.get("cm_qr") || "null"); } catch (e) { return null; } };
  async function refreshQrKey() {
    try {
      const r = await rpc("student_qr_key", { p_token: token, p_device: device });
      store.set("cm_qr", JSON.stringify({ code: r.code, name: r.name, key: r.key, off: Number(r.now_ms) - Date.now() }));
    } catch (e) {}
  }
  const qrCta = () => `<div class="qrcta"><div><b>لا يوجد إنترنت أو إشارة GPS؟</b><span class="small muted">اعرض بطاقة حضورك على المحاضر أو المعيد ليمسحها من هاتفه، وهي تعمل دون إنترنت.</span></div><button class="btn primary" id="qrBtn">بطاقة الحضور</button></div>`;
  const wireQrCta = () => { const b = $("#qrBtn"); if (b) b.onclick = openQr; };
  let qrTimer = null, qrStep = null, wake = null;
  function qrMsg(title, body) {
    $("#qrIn").innerHTML = `<h2>${esc(title)}</h2><p class="hint">${esc(body)}</p><button class="btn" id="qrClose">رجوع</button>`;
    $("#qrClose").onclick = closeQr;
  }
  function openQr() {
    const q = qrGet();
    $("#qrOv").hidden = false;
    if (!q || !q.key) return qrMsg("بطاقة الحضور ليست جاهزة بعد", "افتح التطبيق مرة واحدة وأنت متصل بالإنترنت، وبعدها تعمل البطاقة حتى دون إنترنت.");
    if (typeof window.qrcode !== "function") return qrMsg("تعذّر عرض البطاقة", "افتح التطبيق مرة واحدة وأنت متصل بالإنترنت ليُحمَّل، وبعدها يعمل دون إنترنت.");
    $("#qrIn").innerHTML = `<div><div class="hint mono">${esc(q.code)}</div><h2>${esc(q.name || "")}</h2></div>
      <div class="qrbox" id="qrBox"></div>
      <div class="live"><span class="dot"></span><span id="qrClock"></span></div>
      <div class="qbar"><i id="qrBar"></i></div>
      <p class="hint">اعرض هذه الشاشة على المحاضر أو المعيد ليمسحها. تتغيّر البطاقة كل 15 ثانية، لذا لا تصلح صورة الشاشة. وإذا تعذّر المسح فارفع سطوع الشاشة.</p>
      <button class="btn" id="qrClose">رجوع</button>`;
    $("#qrClose").onclick = closeQr;
    qrStep = null; clearInterval(qrTimer); qrTick(); qrTimer = setInterval(qrTick, 500);
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(w => { wake = w; }).catch(() => {}); } catch (e) {}
  }
  function closeQr() {
    clearInterval(qrTimer); qrTimer = null; $("#qrOv").hidden = true;
    if (wake) { wake.release().catch(() => {}); wake = null; }
  }
  async function qrTick() {
    const q = qrGet(); if (!q || $("#qrOv").hidden) return;
    const now = Date.now() + (Number(q.off) || 0), step = Math.floor(now / CM.QR_STEP);
    const clk = $("#qrClock"); if (clk) clk.textContent = new Date(now).toLocaleTimeString("en-GB");
    const bar = $("#qrBar"); if (bar) bar.style.width = (100 - (now % CM.QR_STEP) / CM.QR_STEP * 100) + "%";
    if (step === qrStep) return;
    qrStep = step;
    try {
      const p = await CM.qrPayload(q.code, q.key, step);
      const box = $("#qrBox"); if (!box || step !== qrStep) return;
      box.dataset.p = p; box.innerHTML = qrSvg(p);
    } catch (e) { qrMsg("تعذّر على هذا الهاتف إنشاء البطاقة", "اطلب من المحاضر تسجيلك يدويًّا، وجرّب تحديث المتصفح."); clearInterval(qrTimer); }
  }
  function qrSvg(text) {
    const qr = window.qrcode(0, "M"); qr.addData(text); qr.make();
    const n = qr.getModuleCount(), m = 4, size = n + m * 2; let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
    return `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" role="img" aria-label="بطاقة الحضور"><rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }

  function signOut() {
    if (token) rpc("student_logout", { p_token: token }).catch(() => {});
    clearInterval(ntTimer); ntTimer = null; nt = { items: null, unread: 0, open: false, msg: "", sub: null, busy: false };
    closeQr(); token = null; home = null; results = {}; tasks = null; tasksAt = 0; tkId = null; $("#tkOv").hidden = true; store.del("cm_token"); store.del("cm_qr"); setLim(false); authTab = "login"; renderAuth();
  }

  // أعلى الصفحة: أي محاضرة جارية الآن مع خانة الرمز وزر المسح مباشرة (لا يحتاج الطالب إلى النزول بحثًا عنها)
  function nowHtml() {
    if (!home) return "";
    const live = home.courses.filter(c => c.session && !limited);
    if (!live.length) return limited ? "" : `<div class="now-idle"><span class="small muted">لا توجد محاضرة جارية الآن. عندما يبدأ المحاضر تظهر هنا خانة الرمز مباشرة.</span><button class="btn sm" id="qrBtn2">بطاقة الحضور</button></div>`;
    return `<section class="now" id="now">${live.map(c => { const done = c.session.mine && c.session.mine.status !== "pending";
      return `<article class="now-c ${done ? "done" : ""}" data-course="${c.id}"><div class="now-h">${done ? "" : `<span class="pulse" aria-hidden="true"></span>`}<b>${done ? "سُجِّل حضورك" : "محاضرة جارية الآن"}</b><span class="now-n">${esc(c.name)}</span></div>${sessionBlock(c)}</article>`; }).join("")}</section>`;
  }
  function sessionBlock(c) {
    const s = c.session, res = results[c.id];
    if (limited) return s ? `<div class="msg small">محاضرة جارية الآن. سجّل حضورك من هاتفك المرتبط بالحساب.</div>` : "";
    if (!s) return `<p class="muted small">لا توجد محاضرة جارية الآن. عندما يبدأ المحاضر، ستظهر هنا خانة الرمز.</p>`;
    const mine = s.mine;
    let body = "";
    if (mine && mine.status !== "pending") body = `<div class="result ok"><b>${mine.makeup ? "سُجِّل حضورك التعويضي" : "سُجِّل حضورك"}</b><span class="small">المحاضرة ${s.n} · ${CM.fmtT(mine.at)}${mine.status === "manual" ? " · سجّلك المحاضر يدويًّا" : mine.via === "scan" ? " · بمسح بطاقة الحضور" : mine.via === "qr" ? " · بمسح رمز QR" : ""}</span></div>`;
    else if (mine) body = `<div class="result warn"><b>طلبك بانتظار موافقة المحاضر</b><span class="small">${esc(mine.reason)}</span></div>`;
    else if (!s.open) body = `<div class="result bad"><b>أُغلق التسجيل بالرمز</b><span class="small">إذا كنت موجودًا فعلًا، فاعرض «بطاقة الحضور» على المحاضر أو المعيد ليمسحها.</span></div>`;
    else if (!s.own && !s.allow_makeup) body = `<div class="result warn"><b>محاضرة اليوم للمجموعة ${esc(s.grp)}</b><span class="small">أنت في ${c.grp ? "مجموعة " + esc(c.grp) : "مجموعة أخرى"}، ومحاضرتك في موعدها الخاص. إذا احتجت إلى التعويض، فاطلب من المحاضر إتاحة الحضور التعويضي.</span></div>`;
    else if (s.tries_left <= 0) body = `<div class="result bad"><b>استُنفدت محاولاتك في هذه المحاضرة</b><span class="small">أدخلت الرمز خطأً 5 مرات. تواصل مع المحاضر.</span></div>`;
    else body = `
      ${!s.own ? `<div class="msg">هذه محاضرة المجموعة ${esc(s.grp)}، وسيُسجَّل حضورك تعويضيًّا.</div>` : ""}
      ${s.kind === "outdoor" ? `<div class="msg">محاضرة خارجية: يظهر الرمز على هاتف المحاضر أو المعيد. إذا تعذّر عليك الوصول إليه أو لم يتوفر لديك إنترنت، فاعرض عليه «بطاقة الحضور» ليمسحها.</div>` : ""}
      <button class="btn primary block" data-qrscan="${c.id}" ${busy ? "disabled" : ""}>امسح رمز QR من الشاشة</button>
      <label class="f"><span>${s.kind === "outdoor" ? "أو اكتب الرمز الظاهر على هاتف المحاضر" : "أو اكتب الرمز الظاهر على الشاشة"}</span><input type="text" class="codein" id="ci-${c.id}" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000" value="${esc(drafts[c.id] || "")}"></label>
      <button class="btn block" data-ci="${c.id}" ${busy ? "disabled" : ""}>${busy === c.id ? `<span class="spinner"></span> جارٍ تحديد موقعك…` : "سجّل حضوري بالرمز"}</button>
      <p class="muted small">سيطلب التطبيق إذن الوصول إلى الموقع للتأكد من أنك ${s.kind === "outdoor" ? "في مكان المحاضرة" : "في القاعة"}.${s.tries_left < 5 ? ` متبقٍّ لك ${s.tries_left} محاولات.` : ""}</p>`;
    return `<div class="row between"><span class="eyebrow">المحاضرة ${s.n} · ${s.grp ? "مجموعة " + esc(s.grp) : "الدفعة كاملة"}</span>${s.open ? `<span class="chip ok">التسجيل مفتوح</span>` : ""}</div>${body}
      ${res ? `<div class="result ${res.k}"><b>${esc(res.title)}</b>${res.checks.length ? `<ul class="checks">${res.checks.map(ch => `<li class="${ch[0]}">${esc(ch[1])}</li>`).join("")}</ul>` : ""}</div>` : ""}`;
  }

  /* ---------------- إشعار الإنذار ---------------- */
  const missedTxt = c => (c.missed || []).length ? "، في " + (c.missed.length > 1 ? "المحاضرات " : "المحاضرة ") + c.missed.map(m => m.n + " (" + CM.fmtD(m.at) + ")").join("، ") : "";
  function afterTxt(ab) {
    const l = CM.lvl(ab);
    if (l >= 4) return "بلغت حد الانسحاب الإجباري؛ راجع المحاضر أو شؤون الطلاب.";
    if (l === 3) return "هذا إنذار نهائي، وأي غياب آخر يعني انسحابًا إجباريًّا من المادة.";
    return "الغياب مرة أخرى يعني " + CM.WARN[l + 1].t + ".";
  }
  function noticeHtml(c) {
    const l = c.level, w = CM.WARN[l];
    return `<div class="notice lv${l}" role="alert">
      <div class="eyebrow">إشعار بإنذار غياب</div>
      <h3>${w.t} · ${esc(c.name)}</h3>
      <p>بلغ عدد مرات غيابك في هذه المادة ${CM.times(c.absences)}، ولذلك صدر لك ${w.t}. ${afterTxt(c.absences)}</p>
      ${(c.missed || []).length ? `<p class="small">المحاضرات التي غبت عنها: ${c.missed.map(m => `${m.n} (${CM.fmtD(m.at)})`).join("، ")}.</p>` : ""}
      <p class="small">إذا كنت حاضرًا في إحدى هذه المحاضرات وسُجّلت غائبًا، فراجع المحاضر لتصحيح الكشف.</p>
      ${ackErr[c.id] ? `<div class="msg bad">${esc(ackErr[c.id])}</div>` : ""}
      <button class="btn primary" data-ack="${c.id}">اطّلعت على الإنذار</button>
      <p class="small muted">يُسجَّل اطّلاعك على الإنذار ويظهر لفريق المادة.</p>
    </div>`;
  }
  const ackErr = {};
  async function ackWarning(cid, btn) {
    const c = home.courses.find(x => x.id === cid); if (!c) return;
    btn.disabled = true; ackErr[cid] = "";
    try { c.seen = await rpc("student_ack_warning", { p_token: token, cid }); }
    catch (e) { ackErr[cid] = errText(e); }
    renderHome();
  }

  /* ---------- التنبيهات: الجرس + إشعارات الهاتف ---------- */
  const BELL = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
  const VAPID = (window.CLASSMATE || {}).VAPID_PUBLIC_KEY || "";
  let nt = { items: null, unread: 0, open: false, msg: "", sub: null, busy: false }, ntTimer = null;
  const pushOk = () => !!VAPID && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  async function loadNotifs() {
    if (!token) return;
    try { const r = await rpc("student_notifications", { p_token: token }); const ch = r.unread !== nt.unread || !nt.items; nt.items = r.items; nt.unread = r.unread; if (ch && home && !tkId && !rf) renderHome(); } catch (e) {}
  }
  async function checkSub() {
    if (!pushOk()) return;
    try { const reg = await navigator.serviceWorker.getRegistration(); const s = reg && await reg.pushManager.getSubscription(); const was = nt.sub; nt.sub = s ? "on" : (Notification.permission === "denied" ? "denied" : "off"); if (was !== nt.sub && home) renderHome(); } catch (e) {}
  }
  const ago = t => { const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 1 ? "الآن" : m < 60 ? "منذ " + m + " دقيقة" : m < 1440 ? "منذ " + Math.round(m / 60) + " ساعة" : new Date(t).toLocaleDateString("ar-EG", { day: "numeric", month: "short" }); };
  function ntPanel() {
    return `<div class="panel nt-panel"><div class="row between"><h3>التنبيهات</h3><button class="btn xs ghost" id="ntClose">إغلاق</button></div>
      ${nt.items && nt.items.length ? `<ul class="nt-list">${nt.items.map(n => `<li class="${n.read_at ? "" : "new"}"><b>${esc(n.title)}</b>${n.body ? `<span>${esc(n.body)}</span>` : ""}<small>${esc(ago(n.created_at))}</small></li>`).join("")}</ul>` : `<p class="muted small">لا توجد تنبيهات بعد. ستصلك هنا تنبيهات بدء المحاضرات والتكليفات الجديدة وإعلان الدرجات.</p>`}
      ${pushOk() && nt.sub !== "on" ? `<button class="btn sm" id="ntPush">فعّل الإشعارات على هذا الجهاز</button>` : nt.sub === "on" ? `<p class="small ok-t">الإشعارات مفعّلة على هذا الجهاز.</p>` : ""}</div>`;
  }
  // حالة إشعارات هذا الجهاز: on / off (يمكن التفعيل) / denied / install (آيفون من Safari: لازم الشاشة الرئيسية) / none
  function pushNeed() {
    if (limited || inApp) return "none";
    if (isIOS && !standalone) return "install";
    if (!pushOk()) return "none";
    return nt.sub === "off" || nt.sub === "denied" ? nt.sub : "none";
  }
  const PUSH_WHY = "إشعار لحظة بدء المحاضرة لتسجّل حضورك في وقته، وإنذارات الغياب، وإعلان الدرجات وقرار التظلم، حتى والموقع مغلق.";
  const iosSteps = `<ol class="pg-steps"><li>اضغط زر المشاركة <b>⬆︎</b> أسفل Safari.</li><li>اختر <b>«إضافة إلى الشاشة الرئيسية»</b> ثم «إضافة».</li><li>افتح <b>Hadro</b> من الأيقونة الجديدة، ثم اضغط «تفعيل الإشعارات».</li></ol>`;
  function pushCta() {
    const k = pushNeed(); if (k === "none") return "";
    const body = k === "install" ? `<span class="small">على الآيفون تعمل الإشعارات من أيقونة الشاشة الرئيسية فقط:</span>${iosSteps}`
      : k === "denied" ? `<span class="small">الإشعارات مرفوضة لهذا الموقع. افتح إعدادات المتصفح ← إعدادات المواقع ← الإشعارات، واسمح لموقع Hadro، ثم أعد فتح الصفحة.</span>`
      : `<span class="small muted">${PUSH_WHY}</span>${nt.msg ? `<span class="small bad-t">${esc(nt.msg)}</span>` : ""}`;
    return `<div class="pk-cta push-must"><div><b>${k === "install" ? "أضف Hadro إلى الشاشة الرئيسية لتصلك الإشعارات" : k === "denied" ? "الإشعارات متوقفة على هذا الهاتف" : "فعّل الإشعارات (مطلوب)"}</b>${body}</div>${k === "off" ? `<div class="row"><button class="btn primary" id="pushOn" ${nt.busy ? "disabled" : ""}>تفعيل الإشعارات</button></div>` : ""}</div>`;
  }
  // نافذة تظهر مرة في كل فتح للموقع حتى تُفعَّل الإشعارات (ولا تظهر أثناء محاضرة جارية حتى لا تؤخر تسجيل الحضور)
  let pgateShown = false;
  function pushGate() {
    const k = pushNeed(); if (k === "none" || pgateShown || tkId) return "";
    try { if (sessionStorage.getItem("cm_pgate")) return ""; } catch (e) {}
    if (home && home.courses.some(c => c.session)) return "";
    if (k === "off" && nt.sub === null) return "";
    return `<div class="pgate" id="pgate" role="dialog" aria-modal="true" aria-labelledby="pgT"><div class="pgate-c">
      <div class="pgate-ic">${BELL}</div>
      <h2 id="pgT">${k === "install" ? "خطوة واحدة لتصلك الإشعارات" : k === "denied" ? "الإشعارات متوقفة" : "فعّل الإشعارات"}</h2>
      <p>${PUSH_WHY}</p>
      ${k === "install" ? iosSteps : k === "denied" ? `<p class="small">افتح إعدادات المتصفح ← إعدادات المواقع ← الإشعارات، واسمح لموقع Hadro، ثم أعد فتح الصفحة.</p>` : ""}
      ${nt.msg ? `<p class="small bad-t">${esc(nt.msg)}</p>` : ""}
      <div class="pgate-a">${k === "off" ? `<button class="btn primary block" id="pgOn" ${nt.busy ? "disabled" : ""}>تفعيل الإشعارات</button>` : ""}<button class="btn ghost block" id="pgLater" disabled>لاحقًا (<span id="pgN">5</span>)</button></div>
    </div></div>`;
  }
  let pgStart = 0, pgTick = null;
  function wireGate() {
    const g = $("#pgate"); if (!g) return;
    const on = $("#pgOn"); if (on) on.onclick = async () => { await enablePush(); };
    if (!pgStart) pgStart = Date.now();
    const upd = () => { const later = $("#pgLater"); if (!later) { clearInterval(pgTick); pgTick = null; return; } const n = 5 - Math.floor((Date.now() - pgStart) / 1000); if (n > 0) { const x = $("#pgN"); if (x) x.textContent = n; } else if (later.disabled) { later.disabled = false; later.textContent = "لاحقًا"; } };
    upd(); if (!pgTick) pgTick = setInterval(upd, 400);
    const later = $("#pgLater"); if (later) later.onclick = () => { pgateShown = true; try { sessionStorage.setItem("cm_pgate", "1"); } catch (e) {} const x = $("#pgate"); if (x) x.remove(); };
  }
  // مركز المساعدة للطالب
  let hcUnread = 0;
  function openHelp(tab) {
    if (!token) return CM.helpCenter({ who: "student", api: null, loginHint: "ادخل بكودك الأول عشان تقدر تراسل الإدارة." });
    CM.helpCenter({ who: "student", tab, courses: (home && home.courses || []).map(c => ({ id: c.id, name: c.name })),

  /* ---------------- الحضور بمسح رمز QR من شاشة المحاضرة ---------------- */
  const QR_RE = /#qr=([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\.([0-9a-f]{12})/i;
  const sstore = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }, del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
  (function grabHash() {
    const m = QR_RE.exec(location.hash || "");
    if (!m) return;
    sstore.set("cm_pending_qr", JSON.stringify({ sid: m[1].toLowerCase(), tok: m[2].toLowerCase(), at: Date.now() }));
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  })();
  let qrFlash = null;
  function takePendingQr() {
    let p = null; try { p = JSON.parse(sstore.get("cm_pending_qr") || "null"); } catch (e) {}
    sstore.del("cm_pending_qr");
    if (!p || Date.now() - p.at > 5 * 60000 || !home) return;
    checkInQr(p.sid, p.tok);
  }
  async function checkInQr(sid, tok) {
    if (busy) return;
    qrFlash = null;
    const c = home.courses.find(x => x.session && x.session.id === sid);
    if (!c) { qrFlash = { k: "bad", t: "هذا الرمز لمحاضرة لست مسجَّلًا فيها، أو انتهت المحاضرة." }; renderHome(); return; }
    busy = c.id; results[c.id] = null; renderHome();
    const card = document.querySelector(`[data-course="${c.id}"]`); if (card) card.scrollIntoView({ block: "start", behavior: "smooth" });
    const pos = await CM.getPosition();
    try {
      const r = await rpc("student_check_in_qr", { p_token: token, sid, p_qr: tok, p_lat: pos.lat ?? null, p_lng: pos.lng ?? null, p_acc: pos.acc ?? null, p_device: device });
      results[c.id] = describe(r, pos, c.session.kind);
    } catch (e) {
      if (String(e.message || "").includes("not_signed_in")) { busy = false; return signOut(); }
      results[c.id] = { k: "bad", title: "تعذّر التسجيل", checks: [["x", errText(e)]] };
    }
    busy = false; await loadHome(true);
  }
  let stStream = null, stTimer = null, stDet = null, stBusy = false;
  const loadJsQR = () => window.jsQR ? Promise.resolve() : new Promise((ok, bad) => { const sc = document.createElement("script"); sc.src = "vendor/jsQR.js"; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc); });
  async function openStScan() {
    const ov = $("#stScan"), msg = $("#stMsg");
    ov.hidden = false; msg.textContent = "جارٍ فتح الكاميرا…";
    try {
      stStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
      const v = $("#stVid"); v.srcObject = stStream; await v.play().catch(() => {});
      try { if ("BarcodeDetector" in window && (await BarcodeDetector.getSupportedFormats()).includes("qr_code")) stDet = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { stDet = null; }
      if (!stDet) await loadJsQR();
      msg.textContent = "وجّه الكاميرا نحو رمز QR على الشاشة";
      stTimer = setInterval(stFrame, 250);
    } catch (e) {
      msg.textContent = e && e.name === "NotAllowedError" ? "رُفض إذن الكاميرا. اسمح للمتصفح باستخدامها، أو افتح كاميرا الهاتف وامسح الرمز منها، أو اكتب الرمز الرقمي." : "تعذّر فتح الكاميرا. افتح كاميرا الهاتف وامسح الرمز منها، أو اكتب الرمز الرقمي.";
    }
  }
  function closeStScan() {
    clearInterval(stTimer); stTimer = null;
    if (stStream) stStream.getTracks().forEach(t => t.stop()); stStream = null;
    $("#stScan").hidden = true;
  }
  async function stFrame() {
    const v = $("#stVid"); if (stBusy || !v.videoWidth) return;
    stBusy = true;
    try {
      let text = null;
      if (stDet) { const r = await stDet.detect(v); text = r[0] && r[0].rawValue; }
      else if (window.jsQR) {
        const w = Math.min(640, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth), cv = stFrame.cv || (stFrame.cv = document.createElement("canvas"));
        cv.width = w; cv.height = h; const x = cv.getContext("2d", { willReadFrequently: true }); x.drawImage(v, 0, 0, w, h);
        const r = jsQR(x.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" }); text = r && r.data;
      }
      if (text) {
        const m = QR_RE.exec(text);
        if (!m) { $("#stMsg").textContent = "هذا ليس رمز حضور Hadro. امسح الرمز الظاهر على شاشة المحاضرة."; }
        else { closeStScan(); await checkInQr(m[1].toLowerCase(), m[2].toLowerCase()); }
      }
    } catch (e) {}
    stBusy = false;
  }
  $("#stClose").onclick = closeStScan;

  /* ---------------- check in ---------------- */
  async function checkIn(cid) {
    if (busy) return;
    const c = home.courses.find(x => x.id === cid); if (!c || !c.session) return;
    const code = (drafts[cid] || "").trim();
    if (code.length !== 6) { results[cid] = { k: "bad", title: "الرمز من 6 أرقام", checks: [["x", "اكتب الرمز كاملًا كما يظهر على الشاشة"]] }; return renderHome(); }
    busy = cid; results[cid] = null; renderHome();
    const pos = await CM.getPosition();
    try {
      const r = await rpc("student_check_in", { p_token: token, sid: c.session.id, p_code: code,
        p_lat: pos.lat ?? null, p_lng: pos.lng ?? null, p_acc: pos.acc ?? null, p_device: device });
      results[cid] = describe(r, pos, c.session.kind);
      if (r.result === "present" || r.result === "pending" || r.result === "already") drafts[cid] = "";
      else if (r.reason === "wrong_code" || r.reason === "expired_code") drafts[cid] = "";
    } catch (e) {
      if (String(e.message || "").includes("not_signed_in")) { busy = false; return signOut(); }
      results[cid] = { k: "bad", title: "تعذّر التسجيل", checks: [["x", errText(e)]] };
    }
    busy = false; await loadHome(true);
  }

  function describe(r, pos, kind) {
    const QR = ["q", "إذا كنت موجودًا فعلًا، فاعرض «بطاقة الحضور» على المحاضر أو المعيد ليمسحها"];
    const ch = [];
    switch (r.result) {
      case "present":
        ch.push(["", "الحساب مرتبط بهذا الهاتف"], ["", "الرمز صحيح وفي وقته"]);
        if (r.no_geo) ch.push(["q", "بدأ المحاضر المحاضرة دون التحقق من الموقع"]); else ch.push(["", (kind === "outdoor" ? "في نطاق مكان المحاضرة (" : "في نطاق القاعة (") + CM.dist(r.dist) + ")"]);
        return { k: "ok", title: r.makeup ? "تم تسجيل حضورك التعويضي" : "تم تسجيل حضورك", checks: ch };
      case "already": return { k: "ok", title: "سُجِّل حضورك من قبل", checks: [] };
      case "pending":
        if (r.reason === "new_device") ch.push(["q", "نقلت حسابك إلى هذا الهاتف اليوم، لذا يحتاج حضورك إلى موافقة المحاضر هذه المرة فقط"]);
        else if (r.reason === "no_location") ch.push(["q", pos.error === "denied" ? "رفضتَ إذن الموقع. فعّله للمتصفح من إعدادات الهاتف في المرة القادمة" : "تعذّر على الهاتف تحديد موقعك"]);
        else ch.push(["q", "دقة الموقع " + r.acc + " م، وهي أضعف من المسموح به. جرّب بالقرب من نافذة في المرة القادمة"]);
        ch.push(["q", "لتسجيل حضورك فورًا، اعرض «بطاقة الحضور» على المحاضر أو المعيد ليمسحها"]);
        return { k: "warn", title: "الرمز صحيح، وأُرسل طلبك إلى المحاضر للموافقة", checks: ch };
      case "locked": return { k: "bad", title: "استُنفدت محاولاتك في هذه المحاضرة", checks: [["x", "تواصل مع المحاضر"]] };
      case "closed": return { k: "bad", title: "أُغلق التسجيل", checks: [] };
      default: {
        const left = r.tries_left != null ? (r.tries_left > 0 ? [["q", "متبقٍّ لك " + r.tries_left + " محاولات"]] : [["x", "استُنفدت محاولاتك"]]) : [];
        const m = {
          wrong_code: ["الرمز غير صحيح", [["x", "اكتب الرمز الظاهر على الشاشة كما هو"], ...left]],
          expired_code: ["انتهت صلاحية هذا الرمز", [["x", "يتغيّر الرمز كل 3 دقائق. اكتب الرمز الظاهر على الشاشة الآن"], ...left]],
          too_far: [kind === "outdoor" ? "أنت بعيد عن مكان المحاضرة" : "أنت لست في القاعة", [["x", "تبعد مسافة " + CM.dist(r.dist) + (kind === "outdoor" ? " عن المحاضر" : " عن القاعة") + "، والمسموح به " + r.radius + " م"], QR]],
          device_used: ["لا يمكنك التسجيل من هذا الهاتف", [["x", "سُجِّل من هذا الهاتف حضور طالب آخر في هذه المحاضرة"]]],
          other_group: ["ليست محاضرة مجموعتك", [["x", "هذه المحاضرة للمجموعة " + r.session_grp]]],
          not_enrolled: ["أنت غير مسجَّل في ملف هذه المادة", []],
          expired_qr: ["انتهت صلاحية رمز QR", [["x", "يتغيّر الرمز على الشاشة كل 15 ثانية، فامسحه من الشاشة مباشرة لا من صورة"]]],
          bad_qr: ["رمز QR غير صحيح", [["x", "امسح الرمز الظاهر على شاشة المحاضرة، أو اكتب الرمز المكوّن من 6 أرقام"]]]
        }[r.reason] || ["تعذّر التسجيل", []];
        return { k: "bad", title: m[0], checks: m[1] };
      }
    }
  }

  // refresh while open: picks up a lecture that just started
  setInterval(() => { if (token && home && !busy && !up && document.visibilityState === "visible" && !(document.activeElement && document.activeElement.tagName === "INPUT")) loadHome(true); }, 15000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && token && !busy) loadHome(true); });

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  if (token) loadHome(); else if (!autoRole()) renderAuth();
})();
</script>
</body>
</html>
