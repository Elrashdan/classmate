<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d6b58">
<meta name="author" content="أحمد محمد راشد حامد">

<meta name="description" content="Hadro: نظام إدارة الحضور. تصميم وتطوير أحمد محمد راشد حامد.">
<script>try{var t=localStorage.getItem("cm_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<title>Hadro</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap narrow" id="app"></div>
<div class="qrov" id="qrOv" hidden><div class="in" id="qrIn"></div></div>
<div class="sheet-ov" id="tkOv" hidden><div class="sheet" id="tkIn" role="dialog" aria-modal="true" aria-labelledby="tkTitle"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="drive.js"></script>
<script>
(function () {
  const { $, esc, rpc, errText, store } = CM;
  const app = $("#app");
  if (!CM.configured) { app.innerHTML = CM.setupNotice(); return; }

  // device id: generated once on this phone and kept in the browser
  let device = store.get("cm_device");
  if (!device) { device = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)); store.set("cm_device", device); }
  if (store.get("cm_device") !== device) device = ""; // storage blocked (private mode)

  let token = store.get("cm_token");
  let home = null, authTab = "login", authMsg = "", busy = false, results = {}, drafts = {}, pwOpen = false, pwMsg = "";

  function header(extra) {
    return `<header class="top"><div class="brand">${CM.markHtml()}<div><h1 class="wm">hadro</h1><p class="muted small">${esc((window.CLASSMATE || {}).UNIVERSITY_NAME || "")}</p></div></div><div class="row">${CM.themeBtn()}${extra || ""}</div></header>`;
  }

  /* ---------------- sign in / first time ---------------- */
  function renderAuth() {
    app.innerHTML = header() + `
      <section class="panel">
        <div class="tabs" role="group"><button id="tLogin" aria-pressed="${authTab === "login"}">دخول</button><button id="tReg" aria-pressed="${authTab === "reg"}">إنشاء حساب</button></div>
        ${authTab === "login" ? `
          <h2>الدخول بكود الطالب</h2>
          <label class="f"><span>كود الطالب</span><input type="text" id="code" inputmode="numeric" autocomplete="username" class="mono" style="text-align:start" value="${esc(store.get("cm_last_code") || "")}"></label>
          <label class="f"><span>كلمة السر</span><input type="password" id="pass" autocomplete="current-password"></label>
        ` : `
          <h2>أنشئ حسابك</h2>
          <p class="muted small">سيرتبط الحساب بهذا الهاتف، ولن تتمكن من تسجيل الحضور من هاتف آخر. لا تستخدم وضع التصفح الخفي.</p>
          <label class="f"><span>كود الطالب</span><input type="text" id="code" inputmode="numeric" autocomplete="username" class="mono" style="text-align:start"></label>
          <label class="f"><span>كلمة السر (6 أحرف على الأقل)</span><input type="password" id="pass" autocomplete="new-password"></label>
          <label class="f"><span>أعد كتابة كلمة السر</span><input type="password" id="pass2" autocomplete="new-password"></label>
          <label class="f"><span>رمز التفعيل (إن أعطاكم المحاضر رمزًا، مثل آخر 4 أرقام من الرقم القومي)</span><input type="text" id="pin" inputmode="numeric" class="mono" style="text-align:start"></label>
        `}
        ${authMsg ? `<div class="msg bad">${esc(authMsg)}</div>` : ""}
        ${!device ? `<div class="msg warn">هذا المتصفح لا يحفظ البيانات (غالبًا بسبب وضع التصفح الخفي). افتح الموقع في متصفح عادي.</div>` : ""}
        <button class="btn primary block" id="go" ${busy || !device ? "disabled" : ""}>${busy ? `<span class="spinner"></span>` : authTab === "login" ? "دخول" : "إنشاء الحساب"}</button>
      </section>
      <p class="muted small" style="margin-top:14px;text-align:center">نسيت كلمة السر أو غيّرت هاتفك؟ اطلب من المحاضر فك ربط الجهاز أو حذف حسابك لتنشئه من جديد.</p>`;
    $("#tLogin").onclick = () => { authTab = "login"; authMsg = ""; renderAuth(); };
    $("#tReg").onclick = () => { authTab = "reg"; authMsg = ""; renderAuth(); };
    $("#go").onclick = submitAuth;
    app.querySelectorAll("input").forEach(i => i.onkeydown = e => { if (e.key === "Enter") submitAuth(); });
  }

  async function submitAuth() {
    if (busy) return;
    // read every field before re-rendering (re-render clears the inputs)
    const code = $("#code").value.trim(), pass = $("#pass").value, pass2 = $("#pass2") ? $("#pass2").value : "", pin = $("#pin") ? $("#pin").value.trim() : "";
    authMsg = "";
    if (!code || !pass) { authMsg = "اكتب كود الطالب وكلمة السر."; return renderAuth(); }
    if (authTab === "reg") {
      if (pass.length < 6) { authMsg = "يجب ألا تقل كلمة السر عن 6 أحرف."; return renderAuth(); }
      if (pass !== pass2) { authMsg = "كلمتا السر غير متطابقتين."; return renderAuth(); }
    }
    busy = true; renderAuth();
    try {
      const r = authTab === "login"
        ? await rpc("student_login", { p_code: code, p_password: pass, p_device: device })
        : await rpc("student_register", { p_code: code, p_password: pass, p_pin: pin, p_device: device });
      token = r.token; store.set("cm_token", token); store.set("cm_last_code", code);
      busy = false; await loadHome();
    } catch (e) { busy = false; authMsg = errText(e); renderAuth(); }
  }

  /* ---------------- home ---------------- */
  async function loadHome(silent) {
    try {
      home = await rpc("student_home", { p_token: token });
      const q = qrGet();
      if (!silent || !q || q.code !== home.code) await refreshQrKey();
      else if (home.now_ms) { q.off = Number(home.now_ms) - Date.now(); store.set("cm_qr", JSON.stringify(q)); }
      renderHome();
      loadTasks(!silent);
    } catch (e) {
      const m = String(e.message || "");
      if (m.includes("not_signed_in")) { signOut(); return; }
      if (m.includes("device_mismatch")) { signOut(); authMsg = errText(e); renderAuth(); return; }
      if (silent && home) return;
      const net = /Failed to fetch|NetworkError|network|Load failed/i.test(m);
      app.innerHTML = header() + `<section class="col">
        <div class="msg ${net ? "warn" : "bad"}">${net ? "لا يوجد اتصال بالإنترنت الآن." : esc(errText(e))}</div>
        ${qrCta()}
        <p><button class="btn" id="retry">أعد المحاولة</button></p></section>`;
      $("#retry").onclick = () => loadHome();
      wireQrCta();
    }
  }

  /* ---------------- personal QR: works with no internet ---------------- */
  const qrGet = () => { try { return JSON.parse(store.get("cm_qr") || "null"); } catch (e) { return null; } };
  async function refreshQrKey() {
    try {
      const r = await rpc("student_qr_key", { p_token: token, p_device: device });
      store.set("cm_qr", JSON.stringify({ code: r.code, name: r.name, key: r.key, off: Number(r.now_ms) - Date.now() }));
    } catch (e) {}
  }
  const qrCta = () => `<div class="qrcta"><div><b>لا يوجد إنترنت أو إشارة GPS؟</b><span class="small muted">اعرض بطاقة حضورك على المحاضر أو المعيد ليمسحها من هاتفه، وهي تعمل دون إنترنت.</span></div><button class="btn primary" id="qrBtn">بطاقة الحضور</button></div>`;
  const wireQrCta = () => { const b = $("#qrBtn"); if (b) b.onclick = openQr; };
  let qrTimer = null, qrStep = null, wake = null;
  function qrMsg(title, body) {
    $("#qrIn").innerHTML = `<h2>${esc(title)}</h2><p class="hint">${esc(body)}</p><button class="btn" id="qrClose">رجوع</button>`;
    $("#qrClose").onclick = closeQr;
  }
  function openQr() {
    const q = qrGet();
    $("#qrOv").hidden = false;
    if (!q || !q.key) return qrMsg("بطاقة الحضور ليست جاهزة بعد", "افتح التطبيق مرة واحدة وأنت متصل بالإنترنت، وبعدها تعمل البطاقة حتى دون إنترنت.");
    if (typeof window.qrcode !== "function") return qrMsg("تعذّر عرض البطاقة", "افتح التطبيق مرة واحدة وأنت متصل بالإنترنت ليُحمَّل، وبعدها يعمل دون إنترنت.");
    $("#qrIn").innerHTML = `<div><div class="hint mono">${esc(q.code)}</div><h2>${esc(q.name || "")}</h2></div>
      <div class="qrbox" id="qrBox"></div>
      <div class="live"><span class="dot"></span><span id="qrClock"></span></div>
      <div class="qbar"><i id="qrBar"></i></div>
      <p class="hint">اعرض هذه الشاشة على المحاضر أو المعيد ليمسحها. تتغيّر البطاقة كل 15 ثانية، لذا لا تصلح صورة الشاشة. وإذا تعذّر المسح فارفع سطوع الشاشة.</p>
      <button class="btn" id="qrClose">رجوع</button>`;
    $("#qrClose").onclick = closeQr;
    qrStep = null; clearInterval(qrTimer); qrTick(); qrTimer = setInterval(qrTick, 500);
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(w => { wake = w; }).catch(() => {}); } catch (e) {}
  }
  function closeQr() {
    clearInterval(qrTimer); qrTimer = null; $("#qrOv").hidden = true;
    if (wake) { wake.release().catch(() => {}); wake = null; }
  }
  async function qrTick() {
    const q = qrGet(); if (!q || $("#qrOv").hidden) return;
    const now = Date.now() + (Number(q.off) || 0), step = Math.floor(now / CM.QR_STEP);
    const clk = $("#qrClock"); if (clk) clk.textContent = new Date(now).toLocaleTimeString("en-GB");
    const bar = $("#qrBar"); if (bar) bar.style.width = (100 - (now % CM.QR_STEP) / CM.QR_STEP * 100) + "%";
    if (step === qrStep) return;
    qrStep = step;
    try {
      const p = await CM.qrPayload(q.code, q.key, step);
      const box = $("#qrBox"); if (!box || step !== qrStep) return;
      box.dataset.p = p; box.innerHTML = qrSvg(p);
    } catch (e) { qrMsg("تعذّر على هذا الهاتف إنشاء البطاقة", "اطلب من المحاضر تسجيلك يدويًّا، وجرّب تحديث المتصفح."); clearInterval(qrTimer); }
  }
  function qrSvg(text) {
    const qr = window.qrcode(0, "M"); qr.addData(text); qr.make();
    const n = qr.getModuleCount(), m = 4, size = n + m * 2; let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
    return `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" role="img" aria-label="بطاقة الحضور"><rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }

  function signOut() {
    if (token) rpc("student_logout", { p_token: token }).catch(() => {});
    closeQr(); token = null; home = null; results = {}; tasks = null; tasksAt = 0; tkId = null; $("#tkOv").hidden = true; store.del("cm_token"); store.del("cm_qr"); authTab = "login"; renderAuth();
  }

  function sessionBlock(c) {
    const s = c.session, res = results[c.id];
    if (!s) return `<p class="muted small">لا توجد محاضرة جارية الآن. عندما يبدأ المحاضر، ستظهر هنا خانة الرمز.</p>`;
    const mine = s.mine;
    let body = "";
    if (mine && mine.status !== "pending") body = `<div class="result ok"><b>${mine.makeup ? "سُجِّل حضورك التعويضي" : "سُجِّل حضورك"}</b><span class="small">المحاضرة ${s.n} · ${CM.fmtT(mine.at)}${mine.status === "manual" ? " · سجّلك المحاضر يدويًّا" : mine.via === "scan" ? " · بمسح بطاقة الحضور" : ""}</span></div>`;
    else if (mine) body = `<div class="result warn"><b>طلبك بانتظار موافقة المحاضر</b><span class="small">${esc(mine.reason)}</span></div>`;
    else if (!s.open) body = `<div class="result bad"><b>أُغلق التسجيل بالرمز</b><span class="small">إذا كنت موجودًا فعلًا، فاعرض «بطاقة الحضور» على المحاضر أو المعيد ليمسحها.</span></div>`;
    else if (!s.own && !s.allow_makeup) body = `<div class="result warn"><b>محاضرة اليوم للمجموعة ${esc(s.grp)}</b><span class="small">أنت في ${c.grp ? "مجموعة " + esc(c.grp) : "مجموعة أخرى"}، ومحاضرتك في موعدها الخاص. إذا احتجت إلى التعويض، فاطلب من المحاضر إتاحة الحضور التعويضي.</span></div>`;
    else if (s.tries_left <= 0) body = `<div class="result bad"><b>استُنفدت محاولاتك في هذه المحاضرة</b><span class="small">أدخلت الرمز خطأً 5 مرات. تواصل مع المحاضر.</span></div>`;
    else body = `
      ${!s.own ? `<div class="msg">هذه محاضرة المجموعة ${esc(s.grp)}، وسيُسجَّل حضورك تعويضيًّا.</div>` : ""}
      ${s.kind === "outdoor" ? `<div class="msg">محاضرة خارجية: يظهر الرمز على هاتف المحاضر أو المعيد. إذا تعذّر عليك الوصول إليه أو لم يتوفر لديك إنترنت، فاعرض عليه «بطاقة الحضور» ليمسحها.</div>` : ""}
      <label class="f"><span>${s.kind === "outdoor" ? "اكتب الرمز الظاهر على هاتف المحاضر" : "اكتب الرمز الظاهر على الشاشة"}</span><input type="text" class="codein" id="ci-${c.id}" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000" value="${esc(drafts[c.id] || "")}"></label>
      <button class="btn primary block" data-ci="${c.id}" ${busy ? "disabled" : ""}>${busy === c.id ? `<span class="spinner"></span> جارٍ تحديد موقعك…` : "سجّل حضوري"}</button>
      <p class="muted small">سيطلب التطبيق إذن الوصول إلى الموقع للتأكد من أنك ${s.kind === "outdoor" ? "في مكان المحاضرة" : "في القاعة"}.${s.tries_left < 5 ? ` متبقٍّ لك ${s.tries_left} محاولات.` : ""}</p>`;
    return `<div class="row between"><span class="eyebrow">المحاضرة ${s.n} · ${s.grp ? "مجموعة " + esc(s.grp) : "الدفعة كاملة"}</span>${s.open ? `<span class="chip ok">التسجيل مفتوح</span>` : ""}</div>${body}
      ${res ? `<div class="result ${res.k}"><b>${esc(res.title)}</b>${res.checks.length ? `<ul class="checks">${res.checks.map(ch => `<li class="${ch[0]}">${esc(ch[1])}</li>`).join("")}</ul>` : ""}</div>` : ""}`;
  }

  /* ---------------- إشعار الإنذار ---------------- */
  const missedTxt = c => (c.missed || []).length ? "، في " + (c.missed.length > 1 ? "المحاضرات " : "المحاضرة ") + c.missed.map(m => m.n + " (" + CM.fmtD(m.at) + ")").join("، ") : "";
  function afterTxt(ab) {
    const l = CM.lvl(ab);
    if (l >= 4) return "بلغت حد الانسحاب الإجباري؛ راجع المحاضر أو شؤون الطلاب.";
    if (l === 3) return "هذا إنذار نهائي، وأي غياب آخر يعني انسحابًا إجباريًّا من المادة.";
    return "الغياب مرة أخرى يعني " + CM.WARN[l + 1].t + ".";
  }
  function noticeHtml(c) {
    const l = c.level, w = CM.WARN[l];
    return `<div class="notice lv${l}" role="alert">
      <div class="eyebrow">إشعار بإنذار غياب</div>
      <h3>${w.t} · ${esc(c.name)}</h3>
      <p>بلغ عدد مرات غيابك في هذه المادة ${CM.times(c.absences)}، ولذلك صدر لك ${w.t}. ${afterTxt(c.absences)}</p>
      ${(c.missed || []).length ? `<p class="small">المحاضرات التي غبت عنها: ${c.missed.map(m => `${m.n} (${CM.fmtD(m.at)})`).join("، ")}.</p>` : ""}
      <p class="small">إذا كنت حاضرًا في إحدى هذه المحاضرات وسُجّلت غائبًا، فراجع المحاضر لتصحيح الكشف.</p>
      ${ackErr[c.id] ? `<div class="msg bad">${esc(ackErr[c.id])}</div>` : ""}
      <button class="btn primary" data-ack="${c.id}">اطّلعت على الإنذار</button>
      <p class="small muted">يُسجَّل اطّلاعك على الإنذار ويظهر لفريق المادة.</p>
    </div>`;
  }
  const ackErr = {};
  async function ackWarning(cid, btn) {
    const c = home.courses.find(x => x.id === cid); if (!c) return;
    btn.disabled = true; ackErr[cid] = "";
    try { c.seen = await rpc("student_ack_warning", { p_token: token, cid }); }
    catch (e) { ackErr[cid] = errText(e); }
    renderHome();
  }

  function renderHome() {
    const active = document.activeElement && document.activeElement.id;
    app.innerHTML = header(`<div class="row"><button class="btn sm ghost" id="pwBtn">كلمة السر</button><button class="btn sm ghost" id="out">خروج</button></div>`) + `
      <section class="col">
        <div><div class="eyebrow mono" style="text-align:start">${esc(home.code)}</div><h2>أهلًا ${esc((home.name || "").split(" ")[0])}</h2></div>
        ${home.courses.filter(c => (c.level || 0) > (c.seen || 0)).map(noticeHtml).join("")}
        ${home.courses.length ? qrCta() : ""}
        ${pwOpen ? `<div class="panel"><h3>تغيير كلمة السر</h3>
          <label class="f"><span>كلمة السر الحالية</span><input type="password" id="pwOld" autocomplete="current-password"></label>
          <label class="f"><span>كلمة السر الجديدة</span><input type="password" id="pwNew" autocomplete="new-password"></label>
          ${pwMsg ? `<div class="msg ${pwMsg.startsWith("!") ? "bad" : "ok"}">${esc(pwMsg.replace(/^!/, ""))}</div>` : ""}
          <button class="btn primary" id="pwSave">حفظ</button></div>` : ""}
        ${home.courses.length ? home.courses.map(c => `
          <article class="course">
            <div class="row between"><div><h2>${esc(c.name)}</h2>${c.label ? `<div class="small muted">${esc(c.label)}</div>` : ""}${c.grp ? `<span class="small muted">مجموعة ${esc(c.grp)}</span>` : ""}</div>${CM.warnChip(c.absences)}</div>
            ${c.absences ? `<p class="small muted">غبت ${CM.times(c.absences)}${missedTxt(c)}. ${afterTxt(c.absences)}</p>` : ""}
            ${sessionBlock(c)}
            ${tasksBlock(c)}
          </article>`).join("") : `<div class="empty">كودك غير موجود في أي مادة حاليًّا. تواصل مع المحاضر.</div>`}
      </section>`;
    $("#out").onclick = signOut;
    $("#pwBtn").onclick = () => { pwOpen = !pwOpen; pwMsg = ""; renderHome(); };
    const ps = $("#pwSave"); if (ps) ps.onclick = async () => {
      try { await rpc("student_change_password", { p_token: token, p_old: $("#pwOld").value, p_new: $("#pwNew").value }); pwMsg = "تم تغيير كلمة السر."; }
      catch (e) { pwMsg = "!" + errText(e); }
      renderHome();
    };
    app.querySelectorAll("input.codein").forEach(inp => {
      const cid = inp.id.slice(3);
      inp.oninput = () => { const v = inp.value.replace(/\D/g, "").slice(0, 6); if (v !== inp.value) inp.value = v; drafts[cid] = v; };
      inp.onkeydown = e => { if (e.key === "Enter") checkIn(cid); };
    });
    app.querySelectorAll("[data-ci]").forEach(b => b.onclick = () => checkIn(b.dataset.ci));
    app.querySelectorAll("[data-ack]").forEach(b => b.onclick = () => ackWarning(b.dataset.ack, b));
    app.querySelectorAll("[data-task]").forEach(b => b.onclick = () => openTask(b.dataset.task));
    wireQrCta();
    if (active && $("#" + CSS.escape(active))) { const el = $("#" + CSS.escape(active)); el.focus(); }
  }

  /* ---------------- التكليفات والتسليم ---------------- */
  let tasks = null, tasksAt = 0, tkId = null, pickFile = null, linkMode = false, tkMsg = null, up = null, tkOff = 0;
  async function loadTasks(force) {
    if (!token || (!force && Date.now() - tasksAt < 120000)) return;
    try {
      const r = await rpc("student_tasks", { p_token: token });
      tasks = r.tasks || []; tasksAt = Date.now(); tkOff = Number(r.now_ms) - Date.now();
      if (home) renderHome();
      if (tkId) renderTask();
    } catch (e) { if (String(e.message || "").includes("not_signed_in")) signOut(); }
  }
  const nowS = () => Date.now() + tkOff;
  function relDue(t) {
    const ms = new Date(t.due_at).getTime() - nowS(), a = Math.abs(ms), h = Math.round(a / 36e5), d = Math.round(a / 864e5);
    const span = a < 36e5 ? Math.max(1, Math.round(a / 6e4)) + " دقيقة" : a < 864e5 * 2 ? (h === 1 ? "ساعة" : h === 2 ? "ساعتين" : h + " ساعة") : (d === 2 ? "يومين" : d + " أيام");
    return ms >= 0 ? "باقٍ " + span : "مضى " + span;
  }
  const dueTxt = t => new Date(t.due_at).toLocaleString("ar-EG", { weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit" });
  const gNum = n => Number(n).toLocaleString("en", { maximumFractionDigits: 2 });
  const tot = m => Number(m.grade) + Number(m.bonus || 0);
  function tkState(t) {
    const m = t.mine || {}, past = new Date(t.due_at).getTime() < nowS();
    if (m.grade != null) return ["ok", "الدرجة " + gNum(tot(m)) + " من " + gNum(t.max)];
    if (t.mode === "manual") return ["none", "رصد يدوي"];
    if (m.graded) return ["ok", "صُحِّح، والدرجة لم تُعلن بعد"];
    if (m.submitted_at) return [m.late ? "warn" : "ok", m.late ? "سُلِّم متأخرًا" : "سُلِّم"];
    if (!past) return [new Date(t.due_at).getTime() - nowS() < 864e5 ? "warn" : "none", relDue(t)];
    return t.late === "accept" ? ["bad", "تأخرت · التسليم ما زال مفتوحًا"] : ["bad", "انتهى موعد التسليم"];
  }
  function tasksBlock(c) {
    const list = (tasks || []).filter(t => t.course_id === c.id);
    if (!list.length) return "";
    return `<div class="tk-list"><div class="eyebrow">التكليفات</div>${list.map(t => { const [k, s] = tkState(t);
      return `<button class="tk-row" data-task="${t.id}"><span class="tk-t"><b>${esc(t.title)}</b><small>${t.mode === "manual" ? "درجة مرصودة من المحاضر" : "التسليم: " + esc(dueTxt(t))}</small></span><span class="chip ${k}">${esc(s)}</span></button>`; }).join("")}</div>`;
  }
  function openTask(id) {
    tkId = id; pickFile = null; linkMode = !HD.ready; tkMsg = null;
    if (HD.ready) HD.loadGis().catch(() => {});
    $("#tkOv").hidden = false; renderTask(); loadTasks(true);
  }
  function closeTask() { if (up) return; tkId = null; $("#tkOv").hidden = true; renderHome(); }
  const canSubmit = t => t.mode !== "manual" && !(t.mine && t.mine.graded) && (t.late === "accept" || new Date(t.due_at).getTime() >= nowS());
  function renderTask() {
    const t = (tasks || []).find(x => x.id === tkId), el = $("#tkIn");
    if (!t) { el.innerHTML = `<p class="muted">جارٍ التحميل…</p>`; return; }
    const m = t.mine || {}, [k, s] = tkState(t), sub = !!m.submitted_at, open = canSubmit(t);
    const stampOk = m.grade != null && m.kind === "drive" && HD.ready && HD.stampable(m.mime);
    el.innerHTML = `
      <div class="sheet-h"><div><div class="eyebrow">${esc(t.course)}</div><h2 id="tkTitle">${esc(t.title)}</h2></div><button class="btn sm ghost" id="tkClose" ${up ? "disabled" : ""} aria-label="إغلاق">إغلاق</button></div>
      <div class="tk-meta"><span class="chip ${k}">${esc(s)}</span>${t.mode === "manual" ? "" : `<span class="small">التسليم ${esc(dueTxt(t))}</span>`}<span class="small muted">الدرجة العظمى ${gNum(t.max)}</span></div>
      ${t.details ? `<p class="tk-det">${esc(t.details)}</p>` : ""}
      ${m.grade != null ? `<div class="result ok"><b>درجتك ${gNum(tot(m))} من ${gNum(t.max)}</b>${Number(m.bonus) ? `<span class="small">${gNum(m.grade)} + ${gNum(m.bonus)} درجة إضافية (بونص)</span>` : ""}${m.feedback ? `<span class="small">ملاحظة المحاضر: ${esc(m.feedback)}</span>` : ""}
        ${stampOk ? `<button class="btn sm" id="tkStamp" style="justify-self:start;margin-top:6px">نزّل نسختك المختومة بالدرجة (PDF)</button>` : ""}</div>` : ""}
      ${sub ? `<div class="tk-sub"><div class="eyebrow">تسليمك</div>
        <a href="${esc(m.url)}" target="_blank" rel="noopener" class="tk-file"><b>${esc(m.kind === "drive" ? m.file_name || "الملف" : m.url)}</b><small>${m.kind === "drive" ? "على Google Drive الخاص بك" + (m.size ? " · " + HD.size(m.size) : "") : "رابط"} · ${CM.fmtD(m.submitted_at)} ${CM.fmtT(m.submitted_at)}${m.version > 1 ? " · التسليم رقم " + m.version : ""}</small></a>
        ${m.late ? `<span class="small warn-t">سُلِّم بعد الموعد، ويظهر ذلك للمحاضر.</span>` : ""}
        ${m.kind === "drive" ? `<p class="small muted">لا تحذف هذا الملف من Drive ولا تعدّله؛ فالتطبيق يحفظ بصمته، وأي تعديل بعد التسليم يظهر للمحاضر.</p>` : ""}</div>` : ""}
      ${tkMsg ? `<div class="msg ${tkMsg.k}">${esc(tkMsg.t)}</div>` : ""}
      ${up ? `<div class="tk-up"><div class="row between small"><span>${esc(up.phase)}</span><span class="mono" id="upPct">${up.pct != null ? Math.round(up.pct * 100) + "%" : ""}</span></div><div class="qbar"><i id="upBar" style="width:${Math.round((up.pct || 0) * 100)}%"></i></div><p class="small muted">لا تغلق الصفحة حتى يكتمل التسليم.</p></div>`
      : open ? `<div class="tk-form">
        <h3>${sub ? "استبدال التسليم" : "سلّم التكليف"}</h3>
        ${HD.ready ? `<div class="tabs" role="group"><button id="tkModeF" aria-pressed="${!linkMode}">رفع ملف</button><button id="tkModeL" aria-pressed="${linkMode}">رابط</button></div>` : ""}
        ${!linkMode ? `
          <label class="filepick"><input type="file" id="tkFile"><span class="fp-b">${pickFile ? `<b>${esc(pickFile.name)}</b><small>${HD.size(pickFile.size)} · اضغط لاختيار ملف آخر</small>` : `<b>اختر الملف</b><small>PDF أو صور أو ملف مضغوط… حتى 1 جيجابايت</small>`}</span></label>
          <label class="f"><span>ملاحظة للمحاضر (اختياري)</span><input type="text" id="tkNote" maxlength="300"></label>
          <button class="btn primary block" id="tkGo" ${pickFile ? "" : "disabled"}>${sub ? "استبدل الملف وسلّم" : "سلّم عبر Google Drive"}</button>
          <p class="small muted">يُرفع الملف إلى Google Drive في حسابك أنت، داخل مجلد Hadro، ويُتاح لمن معه الرابط ليفتحه المحاضر. في المرة الأولى يطلب Google موافقتك.</p>`
        : `
          <label class="f"><span>رابط عملك (Google Drive أو Behance أو غيرهما)</span><input type="url" id="tkUrl" dir="ltr" placeholder="https://" value="${esc(m.kind === "link" ? m.url : "")}"></label>
          <label class="f"><span>ملاحظة للمحاضر (اختياري)</span><input type="text" id="tkNote" maxlength="300"></label>
          <button class="btn primary block" id="tkLink">سلّم الرابط</button>
          <p class="small muted">تأكّد أن الرابط مفتوح لمن معه الرابط، وإلا لن يتمكن المحاضر من فتحه.</p>`}
      </div>` : t.mode === "manual" ? "" : !m.graded ? `<div class="msg bad">انتهى موعد التسليم، وأُغلق التسليم في هذا التكليف.</div>` : ""}`;
    $("#tkClose").onclick = closeTask;
    const mf = $("#tkModeF"), ml = $("#tkModeL");
    if (mf) mf.onclick = () => { linkMode = false; tkMsg = null; renderTask(); };
    if (ml) ml.onclick = () => { linkMode = true; tkMsg = null; renderTask(); };
    const fi = $("#tkFile"); if (fi) fi.onchange = () => { const f = fi.files[0]; if (!f) return; tkMsg = null;
      if (f.size > HD.MAX) { pickFile = null; tkMsg = { k: "bad", t: "حجم الملف أكبر من 1 جيجابايت. اضغطه أو قسّمه، أو سلّم رابطًا." }; } else pickFile = f; renderTask(); };
    const go = $("#tkGo"); if (go) go.onclick = () => submitDrive(t, ($("#tkNote") || {}).value || "");
    const gl = $("#tkLink"); if (gl) gl.onclick = () => submitLink(t, $("#tkUrl").value.trim(), ($("#tkNote") || {}).value || "");
    const sp = $("#tkStamp"); if (sp) sp.onclick = () => myStamped(t, sp);
  }
  const setUp = (phase, pct) => { up = { phase, pct }; renderTask(); };
  async function submitDrive(t, note) {
    if (!pickFile || up) return;
    const f = pickFile, old = t.mine && t.mine.kind === "drive" ? t.mine.file_id : null;
    const auth = HD.authorize(); // من ضغطة الزر مباشرة، قبل أي انتظار
    setUp("في انتظار موافقة Google…", null); tkMsg = null;
    let fileId = null;
    try {
      await auth;
      setUp("جارٍ تجهيز المجلد على Drive…", null);
      const folder = await HD.folders(t.course, t.title);
      const ext = (f.name.match(/\.[A-Za-z0-9]{1,8}$/) || [""])[0];
      const name = HD.fileName(home.code + " - " + (home.name || "") + " - " + t.title) + ext;
      setUp("جارٍ رفع الملف…", 0);
      const meta = await HD.upload(f, folder, name, p => { up.pct = p; const b = $("#upBar"), n = $("#upPct"); if (b) b.style.width = Math.round(p * 100) + "%"; if (n) n.textContent = Math.round(p * 100) + "%"; });
      fileId = meta.id;
      setUp("جارٍ إتاحة الملف للمحاضر…", 1);
      await HD.shareAnyone(meta.id);
      setUp("جارٍ تسجيل التسليم…", 1);
      const r = await rpc("student_submit", { p_token: token, tid: t.id, p_kind: "drive", p_url: meta.webViewLink || ("https://drive.google.com/file/d/" + meta.id + "/view"),
        p_file_id: meta.id, p_name: meta.name, p_mime: meta.mimeType || f.type, p_size: Number(meta.size) || f.size, p_md5: meta.md5Checksum, p_modified: meta.modifiedTime, p_note: note });
      fileId = null;
      if (old && old !== meta.id) HD.trash(old);
      pickFile = null; tkMsg = { k: "ok", t: r.late ? "تم التسليم بعد الموعد، وسيظهر ذلك للمحاضر." : "تم التسليم. يمكنك استبدال الملف حتى موعد التسليم." };
    } catch (e) {
      if (fileId) HD.trash(fileId);
      tkMsg = { k: "bad", t: errText(e) };
    }
    up = null; await loadTasks(true); renderTask();
  }
  async function submitLink(t, url, note) {
    if (up) return;
    if (!/^https:\/\/\S+$/i.test(url)) { tkMsg = { k: "bad", t: errText({ message: "bad_link" }) }; return renderTask(); }
    setUp("جارٍ تسجيل التسليم…", null);
    try {
      const r = await rpc("student_submit", { p_token: token, tid: t.id, p_kind: "link", p_url: url, p_file_id: null, p_name: "", p_mime: null, p_size: null, p_md5: null, p_modified: null, p_note: note });
      tkMsg = { k: "ok", t: r.late ? "سُلِّم الرابط بعد الموعد، وسيظهر ذلك للمحاضر." : "تم تسليم الرابط." };
    } catch (e) { tkMsg = { k: "bad", t: errText(e) }; }
    up = null; await loadTasks(true); renderTask();
  }
  async function myStamped(t, btn) {
    const auth = HD.authorize(), m = t.mine;
    btn.disabled = true; btn.textContent = "جارٍ التجهيز…";
    try {
      await auth;
      const bytes = await HD.myFile(m.file_id);
      const out = await HD.stamped(bytes, m.mime, { grade: tot(m), max: t.max, task: t.title, course: t.course,
        student: home.code + " · " + (home.name || ""), by: "رُصدت في Hadro",  footer: "Hadro · " + home.code + " · " + t.title + " · " + gNum(tot(m)) + " من " + gNum(t.max) });
      HD.saveBytes(out, HD.fileName(home.code + " - " + t.title + " - مختوم") + ".pdf");
      btn.textContent = "تم التنزيل";
    } catch (e) { tkMsg = { k: "bad", t: errText(e) }; renderTask(); }
  }
  $("#tkOv").onclick = e => { if (e.target.id === "tkOv") closeTask(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && tkId) closeTask(); });

  /* ---------------- check in ---------------- */
  async function checkIn(cid) {
    if (busy) return;
    const c = home.courses.find(x => x.id === cid); if (!c || !c.session) return;
    const code = (drafts[cid] || "").trim();
    if (code.length !== 6) { results[cid] = { k: "bad", title: "الرمز من 6 أرقام", checks: [["x", "اكتب الرمز كاملًا كما يظهر على الشاشة"]] }; return renderHome(); }
    busy = cid; results[cid] = null; renderHome();
    const pos = await CM.getPosition();
    try {
      const r = await rpc("student_check_in", { p_token: token, sid: c.session.id, p_code: code,
        p_lat: pos.lat ?? null, p_lng: pos.lng ?? null, p_acc: pos.acc ?? null, p_device: device });
      results[cid] = describe(r, pos, c.session.kind);
      if (r.result === "present" || r.result === "pending" || r.result === "already") drafts[cid] = "";
      else if (r.reason === "wrong_code" || r.reason === "expired_code") drafts[cid] = "";
    } catch (e) {
      if (String(e.message || "").includes("not_signed_in")) { busy = false; return signOut(); }
      results[cid] = { k: "bad", title: "تعذّر التسجيل", checks: [["x", errText(e)]] };
    }
    busy = false; await loadHome(true);
  }

  function describe(r, pos, kind) {
    const QR = ["q", "إذا كنت موجودًا فعلًا، فاعرض «بطاقة الحضور» على المحاضر أو المعيد ليمسحها"];
    const ch = [];
    switch (r.result) {
      case "present":
        ch.push(["", "الحساب مرتبط بهذا الهاتف"], ["", "الرمز صحيح وفي وقته"]);
        if (r.no_geo) ch.push(["q", "بدأ المحاضر المحاضرة دون التحقق من الموقع"]); else ch.push(["", (kind === "outdoor" ? "في نطاق مكان المحاضرة (" : "في نطاق القاعة (") + CM.dist(r.dist) + ")"]);
        return { k: "ok", title: r.makeup ? "تم تسجيل حضورك التعويضي" : "تم تسجيل حضورك", checks: ch };
      case "already": return { k: "ok", title: "سُجِّل حضورك من قبل", checks: [] };
      case "pending":
        if (r.reason === "no_location") ch.push(["q", pos.error === "denied" ? "رفضتَ إذن الموقع. فعّله للمتصفح من إعدادات الهاتف في المرة القادمة" : "تعذّر على الهاتف تحديد موقعك"]);
        else ch.push(["q", "دقة الموقع " + r.acc + " م، وهي أضعف من المسموح به. جرّب بالقرب من نافذة في المرة القادمة"]);
        ch.push(["q", "لتسجيل حضورك فورًا، اعرض «بطاقة الحضور» على المحاضر أو المعيد ليمسحها"]);
        return { k: "warn", title: "الرمز صحيح، وأُرسل طلبك إلى المحاضر للموافقة", checks: ch };
      case "locked": return { k: "bad", title: "استُنفدت محاولاتك في هذه المحاضرة", checks: [["x", "تواصل مع المحاضر"]] };
      case "closed": return { k: "bad", title: "أُغلق التسجيل", checks: [] };
      default: {
        const left = r.tries_left != null ? (r.tries_left > 0 ? [["q", "متبقٍّ لك " + r.tries_left + " محاولات"]] : [["x", "استُنفدت محاولاتك"]]) : [];
        const m = {
          wrong_code: ["الرمز غير صحيح", [["x", "اكتب الرمز الظاهر على الشاشة كما هو"], ...left]],
          expired_code: ["انتهت صلاحية هذا الرمز", [["x", "يتغيّر الرمز كل 3 دقائق. اكتب الرمز الظاهر على الشاشة الآن"], ...left]],
          too_far: [kind === "outdoor" ? "أنت بعيد عن مكان المحاضرة" : "أنت لست في القاعة", [["x", "تبعد مسافة " + CM.dist(r.dist) + (kind === "outdoor" ? " عن المحاضر" : " عن القاعة") + "، والمسموح به " + r.radius + " م"], QR]],
          device_used: ["لا يمكنك التسجيل من هذا الهاتف", [["x", "سُجِّل من هذا الهاتف حضور طالب آخر في هذه المحاضرة"]]],
          other_group: ["ليست محاضرة مجموعتك", [["x", "هذه المحاضرة للمجموعة " + r.session_grp]]],
          not_enrolled: ["أنت غير مسجَّل في ملف هذه المادة", []]
        }[r.reason] || ["تعذّر التسجيل", []];
        return { k: "bad", title: m[0], checks: m[1] };
      }
    }
  }

  // refresh while open: picks up a lecture that just started
  setInterval(() => { if (token && home && !busy && !up && document.visibilityState === "visible" && !(document.activeElement && document.activeElement.tagName === "INPUT")) loadHome(true); }, 15000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && token && !busy) loadHome(true); });

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  if (token) loadHome(); else renderAuth();
})();
</script>
</body>
</html>
